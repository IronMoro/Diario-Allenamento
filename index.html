<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diario di allenamento</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1D2830">
<link rel="icon" href="icon-192-v2.png">
<link rel="apple-touch-icon" href="icon-192-v2.png">
<script>window.DIARIO_NS='prova'</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#E8EBE6; --surface:#F6F7F4; --raise:#FFFFFF; --ink:#1D2830; --muted:#5C6970; --line:#C9D0C8;
  --accent:#1D2830; --on-accent:#F6F7F4;
  --ok:#92D050; --fat:#FFC000; --ko:#E3342F; --skip:#0070C0; --on-ok:#1D2830; --on-ko:#FFFFFF;
  --rest:#DCE6E2; --warn:#FFC000;
  --f-text:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141B20; --surface:#1C252B; --raise:#243037; --ink:#E4EAE5; --muted:#9AA7AE; --line:#34434C;
    --accent:#E4EAE5; --on-accent:#141B20; --rest:#1F3330;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141B20; --surface:#1C252B; --raise:#243037; --ink:#E4EAE5; --muted:#9AA7AE; --line:#34434C;
  --accent:#E4EAE5; --on-accent:#141B20; --rest:#1F3330;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-text);min-height:100%;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--skip);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1,h2,h3{font-family:var(--f-num);font-weight:700;letter-spacing:.01em;margin:0;line-height:1.1}
h1{font-size:32px}
h2{font-size:24px}
h3{font-size:20px}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* barra superiore */
.top{display:flex;align-items:baseline;gap:12px;margin:4px 0 16px}
.top .save{margin-left:auto;font-size:14px;color:var(--muted)}
.banner{background:var(--raise);border-left:4px solid var(--fat);padding:10px 12px;margin:0 0 16px;font-size:14px}

/* tab in basso */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;max-width:200px;background:none;border:0;padding:7px 2px 8px;font-family:var(--f-num);font-size:15px;font-weight:600;color:var(--muted);border-top:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:25px;height:25px}
.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--ink)}
.minitimer{position:fixed;left:0;right:0;z-index:19;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.minitimer[hidden]{display:none}
.minitimer button{pointer-events:auto;background:var(--accent);color:var(--on-accent);border:0;border-radius:20px;padding:6px 16px;font-family:var(--f-num);font-size:18px;font-weight:600;margin-bottom:8px}

/* campi */
label.f{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0;color:var(--ink);font-size:16px}
textarea{resize:vertical;min-height:44px}
input[type=number]{font-family:var(--f-num);font-size:19px;font-weight:600}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:6px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.big{font-family:var(--f-num);font-size:22px;padding:12px 22px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--ko)}
.btn:disabled{opacity:.45;cursor:default}

/* seduta */
.sess-head{display:grid;grid-template-columns:1fr 90px;gap:10px;margin-bottom:6px}
.sess-meta{font-family:var(--f-num);font-size:18px;color:var(--muted);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin:0 0 14px}
.card-h{display:flex;gap:8px;align-items:center}
.card-h input{font-family:var(--f-num);font-size:22px;font-weight:700;border-color:transparent;background:transparent;padding:4px 6px}
.card-h input:hover,.card-h input:focus{border-color:var(--line);background:var(--raise)}
.sugg{font-size:14px;color:var(--muted);margin:2px 6px 10px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.grid .wide{grid-column:span 4}
.grid label.f{justify-content:flex-end}
@media (min-width:600px){.grid{grid-template-columns:repeat(8,minmax(0,1fr))}.grid .wide{grid-column:span 4}}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.chip{width:52px;height:56px;border-radius:6px;border:2px solid var(--line);background:var(--raise);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1}
.chip b{font-family:var(--f-num);font-size:26px;font-weight:700}
.chip small{font-size:11px;margin-top:2px;opacity:.8}
.chip.e-{color:var(--muted);border-style:dashed}
.chip.e-ok{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.chip.e-fat{background:var(--fat);border-color:var(--fat);color:var(--on-ok)}
.chip.e-ko{background:var(--ko);border-color:var(--ko);color:var(--on-ko)}
.chip.e-skip{background:var(--skip);border-color:var(--skip);color:var(--on-ko)}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 12px;margin:12px 0 4px;padding-top:10px;border-top:1px solid var(--line)}
@media (min-width:600px){.metrics{grid-template-columns:repeat(5,minmax(0,1fr))}}
.metrics div{display:flex;flex-direction:column}
.metrics span{font-size:12px;color:var(--muted)}
.metrics b{font-family:var(--f-num);font-size:20px;font-weight:600}
.card-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.prog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;padding:10px;background:var(--raise);border-radius:6px}
.prog p{grid-column:1/-1;margin:0;font-size:13px;color:var(--muted)}
.add{display:flex;gap:8px;margin:6px 0 18px}

/* nuova seduta */
.tpl{display:flex;flex-direction:column;gap:8px;margin:14px 0 22px}
.tpl>button,.tplrow>button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:56px 1fr;gap:2px 12px;align-items:center}
.tpl .wo{grid-row:span 2;font-family:var(--f-num);font-size:34px;font-weight:700;text-align:center;line-height:1}
.tpl .when{font-size:14px;color:var(--muted)}
.tpl .what{font-weight:600}

/* storico */
.week{margin:0 0 18px}
.week-h{display:flex;align-items:baseline;gap:10px;padding:0 2px 6px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.week-h{flex-wrap:wrap}
.week-h h3{font-size:20px;white-space:nowrap}
.week-h span{font-size:14px;color:var(--muted)}
.sess{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:0 0 8px}
.sess > button{all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;padding:10px 12px}
.sess > button:focus-visible{outline:3px solid var(--skip)}
.sess-t{display:flex;gap:10px;align-items:baseline;margin-bottom:4px}
.sess-t b{font-family:var(--f-num);font-size:19px}
.sess-t .wo{font-family:var(--f-num);font-weight:700;font-size:19px;background:var(--ink);color:var(--bg);border-radius:4px;padding:0 6px}
.exl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;font-size:15px}
.exl .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:flex;gap:2px}
.mini i{width:10px;height:14px;border-radius:2px;background:var(--line)}
.mini i.e-ok{background:var(--ok)}.mini i.e-fat{background:var(--fat)}.mini i.e-ko{background:var(--ko)}.mini i.e-skip{background:var(--skip)}
.sess-d{padding:0 12px 12px;border-top:1px solid var(--line)}
.sess-d .ex{padding:10px 0;border-bottom:1px dashed var(--line)}
.sess-d .ex:last-of-type{border-bottom:0}
.sess-d p{margin:4px 0;font-size:14px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;margin:0 0 14px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}

/* timer */
.seg{display:flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin:0 0 18px}
.seg button{flex:1;background:none;border:0;padding:10px 6px;font-family:var(--f-num);font-size:20px;font-weight:600;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.sm{border-width:1px;margin:0}
.seg.sm button{font-size:17px;padding:7px 4px}
.tcfg{display:flex;flex-direction:column;gap:14px}
.tcfg .lead{margin:0;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--raise);width:max-content}
.stepper button{background:none;border:0;width:48px;height:48px;font-size:24px;font-weight:600}
.stepper output{min-width:56px;text-align:center;font-family:var(--f-num);font-size:26px;font-weight:700}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.swatches input[type=color]{width:42px;height:34px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--raise)}
.emx{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.exrow{display:grid;grid-template-columns:minmax(0,1fr) 72px 84px;gap:8px;align-items:end}
.run{border-radius:12px;padding:20px 16px 22px;text-align:center;background:var(--accent);color:var(--on-accent);transition:background .25s}
.run.rest{background:var(--rest);color:var(--ink)}
.run.flash{background:var(--warn);color:#1D2830}
.run.done{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.run .ph{font-family:var(--f-num);font-size:22px;font-weight:600;margin:0}
.run .ex-now{font-family:var(--f-num);font-size:clamp(30px,8vw,46px);font-weight:700;margin:6px 0 0;line-height:1.05}
.run .clock{font-family:var(--f-num);font-weight:700;font-size:clamp(96px,30vw,210px);line-height:.95;font-variant-numeric:tabular-nums;margin:6px 0}
.run .sub{font-size:17px;margin:0;opacity:.85}
.run .ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.run .btn{background:transparent;color:inherit;border-color:currentColor}
.run .btn.primary{background:var(--pfg,var(--on-accent));color:var(--pbg,var(--accent));border-color:var(--pfg,var(--on-accent))}
.run.rest .btn.primary,.run.done .btn.primary,.run.flash .btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.repadj{display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0 4px}
.repadj button{width:64px;height:64px;border-radius:50%;border:2px solid currentColor;background:transparent;color:inherit;font-size:32px;font-weight:600}
.repadj output{font-family:var(--f-num);font-size:64px;font-weight:700;min-width:80px}
.esito{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px auto 0;max-width:420px}
.esito button{border:0;border-radius:6px;padding:12px 6px;font-weight:600}
.esito button{border:2px solid rgba(255,255,255,.75)}
.esito button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink);text-decoration:underline}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;text-align:left}
.tot div{background:rgba(127,127,127,.14);border-radius:6px;padding:8px 10px}
.tot b{font-family:var(--f-num);font-size:24px;display:block}
.sumlist{text-align:left;margin:12px auto 0;max-width:420px;font-size:15px}

/* foglio in basso */
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,18,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:14px 14px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:calc(100dvh - 12px);max-height:calc(100vh - 12px);overflow-y:auto;overscroll-behavior:contain}
@supports (height:100dvh){.sheet{max-height:calc(100dvh - 12px)}}
.sheet h3{margin-bottom:4px}
.sheet .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.sheet .opts button{border:0;border-radius:8px;padding:14px 10px;font-weight:600;font-size:16px}
.o-ok{background:var(--ok);color:var(--on-ok)}.o-fat{background:var(--fat);color:var(--on-ok)}.o-ko{background:var(--ko);color:var(--on-ko)}.o-skip{background:var(--skip);color:var(--on-ko)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
body.lock{overflow:hidden}
.run.full{position:fixed;inset:0;z-index:30;border-radius:0;margin:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "main" "side";gap:clamp(4px,1.2vh,14px);padding:calc(env(safe-area-inset-top,0px) + clamp(6px,1.5vh,14px)) clamp(10px,3vw,28px) calc(env(safe-area-inset-bottom,0px) + clamp(8px,2vh,18px));overflow:hidden}
.r-top{grid-area:top;display:flex;align-items:center;gap:10px;font-family:var(--f-num);font-size:clamp(15px,min(3.8vw,2.6vh),24px);font-weight:600}
.r-top .r-title{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-top .r-ses{white-space:nowrap;opacity:.9}
.r-top .fsb{background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:6px;width:clamp(32px,5vh,42px);height:clamp(32px,5vh,42px);font-size:clamp(14px,2.4vh,20px);padding:0;flex:none}
.r-main{grid-area:main;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:clamp(2px,.8vh,8px)}
.r-side{grid-area:side;display:flex;flex-direction:column;justify-content:center;gap:clamp(6px,1.4vh,14px);min-height:0}
.run.full .ph{font-size:clamp(16px,min(4.4vw,3.2vh),30px)}
.run.full .giro{font-family:var(--f-num);font-weight:700;font-size:clamp(34px,min(12vw,8.5vh),110px);line-height:1;margin:0;font-variant-numeric:tabular-nums}
.run.full .ex-now{font-size:clamp(20px,min(6.5vw,5vh),56px);margin:0}
.run.full .clock{font-size:clamp(48px,min(25vw,24vh),320px);margin:0;white-space:nowrap}
.run.full .sub{font-size:clamp(13px,min(3.8vw,2.5vh),22px);margin:0}
.run.full .ctl{margin:0;gap:clamp(6px,1.2vw,12px)}
.run.full .btn{font-size:clamp(14px,min(3.8vw,2.4vh),20px);padding:clamp(6px,1.1vh,12px) clamp(10px,2.2vw,20px)}
.run.full .btn.big{font-size:clamp(18px,min(5.2vw,3.4vh),30px);padding:clamp(8px,1.6vh,16px) clamp(16px,3vw,30px)}
.run.full .repadj{margin:0;gap:clamp(10px,3vw,22px)}
.run.full .repadj button{width:clamp(40px,min(12vw,7vh),76px);height:clamp(40px,min(12vw,7vh),76px);font-size:clamp(22px,4vh,34px)}
.run.full .repadj output{font-size:clamp(30px,min(11vw,7vh),76px);min-width:2ch}
.run.full .esito{margin:0 auto;width:100%}
.run.full .esito button{padding:clamp(6px,1.3vh,14px) 4px;font-size:clamp(13px,min(3.6vw,2.2vh),18px)}
.run.full .tot{margin:0;gap:clamp(6px,1vw,10px)}
.run.full .tot div{padding:clamp(4px,.8vh,8px) 10px;font-size:clamp(12px,1.8vh,16px)}
.run.full .tot b{font-size:clamp(16px,2.8vh,26px)}
.run:not(.full) .msub{margin-top:14px}
/* timer: dati più grandi e pulsanti facili da toccare */
.run.full .r-top{font-size:clamp(18px,min(4.8vw,3.4vh),34px)}
.run.full .r-top .r-ses{font-size:clamp(15px,min(3.8vw,2.6vh),24px);font-weight:600}
.run.full .ph{font-size:clamp(18px,min(5.6vw,4vh),42px)}
.run.full .giro{font-size:clamp(40px,min(16vw,10vh),150px)}
.run.full .ex-now{font-size:clamp(24px,min(8vw,6vh),76px)}
.run.full .clock{font-size:clamp(52px,min(27vw,25vh),340px)}
.run.full .sub{font-size:clamp(16px,min(5vw,3.2vh),32px)}
.run.full .btn{font-size:clamp(16px,min(4.6vw,2.9vh),28px);min-height:clamp(44px,7vh,84px);border-width:2px;line-height:1.15}
.run.full .btn.big,.run.full .r-side .btn.primary{font-size:clamp(20px,min(6.2vw,4vh),42px);min-height:clamp(52px,9.5vh,110px);width:100%}
.run.full .ctl2{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));width:100%}
.run.full .ctl2 .btn{padding-left:6px;padding-right:6px}
.run.full .repadj button{width:clamp(52px,min(18vw,10.5vh),116px);height:clamp(52px,min(18vw,10.5vh),116px);font-size:clamp(28px,6vh,56px);border-width:3px}
.run.full .repadj output{font-size:clamp(40px,min(15vw,9.5vh),110px)}
.run.full .esito{gap:clamp(6px,1.4vw,14px);max-width:none}
.run.full .esito button{min-height:clamp(48px,8.5vh,96px);font-size:clamp(15px,min(4.4vw,2.9vh),28px);padding:4px}
.run.full .tot div{font-size:clamp(14px,2.2vh,22px)}
.run.full .tot b{font-size:clamp(20px,3.8vh,40px)}
@media (orientation:landscape){
  .run.full .clock{font-size:clamp(48px,min(16.5vw,40vh),340px)}
  .run.full .giro{font-size:clamp(36px,min(9vw,12vh),150px)}
  .run.full .ex-now{font-size:clamp(22px,min(5vw,7vh),76px)}
}
@media (orientation:landscape){
  .run.full{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "main side"}
  .run.full .clock{font-size:clamp(48px,min(16.5vw,40vh),320px)}
}
.run.full{--u:14px;gap:calc(var(--u)*.5);padding:calc(env(safe-area-inset-top,0px) + var(--u)*.6) calc(var(--u)*.9) calc(env(safe-area-inset-bottom,0px) + var(--u)*.7)}
.run.full .r-top{font-size:calc(var(--u)*1.5)}
.run.full .r-top .r-ses{font-size:clamp(15px,min(3.8vw,2.6vh),24px)}

  const chk=(k,v,l)=>`<label class="row" style="flex-wrap:nowrap;grid-column:1/-1"><input type="checkbox" ${f[k]===v?'checked':''} data-f="pf:${k}" data-on="${v}" style="width:22px;height:22px"> ${l}</label>`;
  const sub=(arr,i,k,l,ty='number')=>`<label class="f">${l}<input type="${ty}" ${ty==='number'?'inputmode="decimal" step="any"':''} value="${esc(f[arr][i][k])}" data-f="pf:${arr}.${i}.${k}"></label>`;
  if(f.tipo==='emom'){const k=Number(f.k)||1;return `<div class="seg sm" role="group" aria-label="Esercizi per giro" style="grid-column:1/-1;max-width:360px">${[1,2,3].map(n=>`<button data-a="pfSet" data-k="k" data-v="${n}" aria-pressed="${k===n}">${emomName(n)}</button>`).join('')}</div>`
    +inp('Giri','giri')+inp('Riposo a fine giro (s, 0 = no)','restGiro')
    +f.slots.slice(0,k).map((x,i)=>`<div class="muted small" style="grid-column:1/-1;margin-top:4px">${k>1?`Esercizio ${i+1} del giro`:'Ogni intervallo'}</div>`+sub('slots',i,'sec','Secondi')+sub('slots',i,'rep','Ripetizioni (es. 6 o 3-6)','text')).join('')
    +(k>1?`<p class="muted small" style="grid-column:1/-1;margin:0">Nella seduta gli esercizi con questo protocollo prendono, in ordine, il primo, il secondo e il terzo intervallo.</p>`:'')}
  if(f.tipo==='st')return inp('Serie','serie')+inp('Ripetizioni per serie','rep','text')+inp('Recupero (s, 0 = libero)','rest')+`<p class="muted small" style="grid-column:1/-1;margin:0">Serie Target: tutte le serie previste con il recupero che ti serve; conta il tempo per completarle.</p>`;
  if(f.tipo==='ladder'){const v=f.verso==='ar'?'sugiu':f.verso,ok=f.ondaK||'gradini',src=f.sugSrc||'test';
    let body='';
    if(v==='onda'&&ok==='pers')body=inp('Sequenza (es. 1,7,2,8,3,1,7)','seq','text');
    else if(v==='onda'&&ok==='alt')body=inp('Bassi: da','loDa')+inp('Bassi: a','loA')+inp('Alti: da','hiDa')+inp('Alti: a','hiA')+inp('Passo','passo');
    else body=inp('Da (ripetizioni)','da')+inp('A (ripetizioni)','a')+inp('Passo','passo')+(v==='onda'?inp('Gradini per onda','lung')+inp('Spostamento tra le onde','sposta'):'');
    return `<div class="seg sm" role="group" aria-label="Andamento della scala" style="grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))">${LADV.map(([k2,l2])=>`<button data-a="pfSet" data-k="verso" data-v="${k2}" aria-pressed="${v===k2}">${l2}</button>`).join('')}</div>`
    +(v==='onda'?`<div class="seg sm" role="group" aria-label="Tipo di onda" style="grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">${ONDAK.map(([k2,l2])=>`<button data-a="pfSet" data-k="ondaK" data-v="${k2}" aria-pressed="${ok===k2}">${l2}</button>`).join('')}</div>`:'')
    +(v==='sugiu'?chk('top2','1','Ripeti il gradino più alto (es. 1-2-3-3-2-1)'):'')
    +body+inp('Quante volte ripeti la scala','volte')
    +`<div class="seg sm" role="group" aria-label="Recupero della ladder" style="grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));max-width:480px">${[['fix','Recupero fisso'],['mult','Multiplo della serie'],['free','Libero']].map(([k2,l2])=>`<button data-a="pfSet" data-k="restMode" data-v="${k2}" aria-pressed="${(f.restMode||'fix')===k2}">${l2}</button>`).join('')}</div>`+(f.restMode==='mult'?inp('Recupero = durata della serie ×','mult'):f.restMode==='free'?'':inp('Recupero (s)','rest'))+chk('group','super','Alternata con gli altri esercizi della seduta con questo protocollo')
    +`<p class="muted small" style="grid-column:1/-1;margin:0" id="ladPrev">${ladPrev(f)}</p>`
    +`<div class="emx" style="grid-column:1/-1;margin-top:6px"><b>Proponi una ladder</b>
      <div class="seg sm" role="group" aria-label="Da dove partire" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-top:6px">${[['test','Dai test'],['rm','Da un 1RM'],['rep','Da massime ripetizioni']].map(([k2,l2])=>`<button data-a="pfSet" data-k="sugSrc" data-v="${k2}" aria-pressed="${src===k2}">${l2}</button>`).join('')}</div>
      <div class="row" style="align-items:flex-end;margin-top:6px">
        ${src==='test'?`<label class="f" style="flex:1;min-width:170px">Esercizio<input type="text" list="names" value="${esc(f.sugN||'')}" data-f="pf:sugN"></label><label class="f" style="width:150px">Carico (kg, facoltativo)<input type="number" inputmode="decimal" step="any" value="${esc(f.sugKg||'')}" data-f="pf:sugKg"></label>`
          :src==='rm'?`<label class="f" style="width:130px">1RM (kg)<input type="number" inputmode="decimal" step="any" value="${esc(f.sugRm||'')}" data-f="pf:sugRm"></label><label class="f" style="width:170px">Carico che userai (kg)<input type="number" inputmode="decimal" step="any" value="${esc(f.sugKg||'')}" data-f="pf:sugKg"></label>`
          :`<label class="f" style="width:280px">Massime ripetizioni (con il carico o a peso corporeo)<input type="number" inputmode="numeric" value="${esc(f.sugRep||'')}" data-f="pf:sugRep"></label>`}
        <label class="f" style="width:150px">Volume (volte le massime)<select data-f="pf:sugVol">${[1,1.5,2,2.5,3,3.5,4,4.5,5,5.5,6].map(x=>`<option value="${x}" ${Number(f.sugVol||2.5)===x?'selected':''}>${fmtN(x,1)}</option>`).join('')}</select></label>
        <button class="btn" data-a="ladSug">Proponi</button></div>
      ${f._sug?vLadSug(f._sug):''}</div>`}
  if(f.tipo==='rt')return inp('Ripetizioni totali da fare','target')+inp('Ripetizioni per serie (facoltativo)','rep','text')+inp('Recupero (s, 0 = libero)','rest')+`<p class="muted small" style="grid-column:1/-1;margin:0">Ripetizioni Target: fai tutte le serie che servono per arrivare al totale; l’app conta quante ne mancano.</p>`;
  if(f.tipo==='amrap')return inp('Minuti','min')+inp('Ripetizioni per esercizio','rep','text')+`<p class="muted small" style="grid-column:1/-1;margin:0">Più giri possibile entro il tempo: nella seduta gli esercizi con questo protocollo formano il giro, nell’ordine.</p>`;
  if(f.tipo==='edt')return inp('Minuti della PR Zone','min')+inp('Ripetizioni target','rep','text')+inp('Pausa tra due PR Zone (min)','restZ');
  if(f.tipo==='circ')return inp('Giri','giri')+inp('Pausa tra le stazioni (s)','restEx')+inp('Riposo tra i giri (s)','restGiroC')
    +f.stations.map((x,i)=>`<div class="row" style="grid-column:1/-1;align-items:flex-end;gap:8px"><span class="muted small" style="width:74px">Stazione ${i+1}</span>
      <div class="seg sm" role="group" aria-label="Stazione ${i+1}" style="width:230px"><button data-a="pfSt" data-i="${i}" data-v="time" aria-pressed="${x.work!=='rep'}">A tempo</button><button data-a="pfSt" data-i="${i}" data-v="rep" aria-pressed="${x.work==='rep'}">A ripetizioni</button></div>
      ${sub('stations',i,'val',x.work==='rep'?'Ripetizioni':'Secondi')}${f.stations.length>1?`<button class="btn ghost" data-a="pfStDel" data-i="${i}" aria-label="Togli la stazione ${i+1}">✕</button>`:''}</div>`).join('')
    +(f.stations.length<12?`<div style="grid-column:1/-1"><button class="btn" data-a="pfStAdd">+ Aggiungi stazione</button></div>`:'')
    +`<p class="muted small" style="grid-column:1/-1;margin:0">Le stazioni a ripetizioni finiscono quando tocchi «Fatto». Nella seduta gli esercizi con questo protocollo prendono le stazioni in ordine.</p>`;
  if(f.tipo==='max')return inp('Riposo tra gli esercizi (s)','rest');
  return inp('Serie','serie')+inp('Ripetizioni (es. 6 o 3-8)','rep','text')
    +`<div class="seg sm" role="group" aria-label="Recupero" style="grid-column:1/-1;max-width:320px"><button data-a="pfSet" data-k="restMode" data-v="fix" aria-pressed="${f.restMode!=='mult'}">Recupero fisso</button><button data-a="pfSet" data-k="restMode" data-v="mult" aria-pressed="${f.restMode==='mult'}">Multiplo della serie</button></div>`
    +(f.restMode==='mult'?inp('Recupero = durata ×','mult'):inp('Recupero (s)','rest'))
    +chk('group','super','Superset con gli altri esercizi della seduta con questo protocollo')+(f.group==='super'?inp('Pausa tra gli esercizi del superset (s)','tr'):'');
}
function ladPrev(f){const l=ladList(f);return `Serie: ${ladWaves(f).map(x=>x.join(' · ')).join('  |  ')}${num(f.volte)>1?` (x${f.volte})`:''}, in tutto ${l.length} serie e ${l.reduce((x,y)=>x+y,0)} ripetizioni`}
function repsAtPct(pc){if(pc>=1)return 1;let best=30,d=9;for(let r=1;r<=30;r+=.5){const q=pctOfReps(r);if(q&&Math.abs(q-pc)<d){d=Math.abs(q-pc);best=r}}return Math.round(best)}
function ladSuggest(f){
  const src=f.sugSrc||'test',vol=Number(f.sugVol)||2.5;let R=null,txt='';
  if(src==='rm'){const rm=num(f.sugRm),kg=num(f.sugKg);if(!(rm>0)||!(kg>0))return {err:'Indica il 1RM e il carico che userai.'};const pc=kg/rm;R=repsAtPct(pc);txt=`1RM ${fmtN(rm,1)} kg: con ${fmtN(kg,kg%1?1:0)} kg (${fmtN(pc*100)}%) fai circa ${R} ripetizioni massime.`}
  else if(src==='rep'){R=num(f.sugRep);if(!(R>0))return {err:'Indica le massime ripetizioni.'};txt=`${R} ripetizioni massime.`}
  else{const n=String(f.sugN||'').trim();if(!n)return {err:'Indica l’esercizio.'};
    const mr=[...S.tests.values()].filter(t=>!t.deleted&&t.n===n&&t.tipo==='maxrep').sort((a,b)=>a.d<b.d?1:-1)[0],t1=maxFor(n,todayIso());let load=num(f.sugKg);
    if(!(load>0)&&!mr&&t1){for(const s of S.hist){const e=s.ex.find(x=>x.n===n&&Number(x.kg)>0);if(e){load=Number(e.kg);break}}}
    if(load>0&&t1){const pc=load/t1.rm;R=repsAtPct(pc);txt=`Massimale ${fmtN(t1.rm,1)} kg: con ${fmtN(load,load%1?1:0)} kg (${fmtN(pc*100)}%) fai circa ${R} ripetizioni massime.`}
    else if(mr){R=num(mr.rep);txt=`Test del ${fmtD(mr.d)}: ${R} ripetizioni massime a corpo libero.`}
    if(!R)return {err:`Per ${esc(n)} non trovo né un massimale né un test di massime ripetizioni: registrane uno nella sezione Test, oppure scegli «Da un 1RM» o «Da massime ripetizioni».`}}
  if(R<4)return {err:`${txt} Con meno di 4 ripetizioni massime la ladder non ha senso: scegli un carico più leggero.`};
  const goal=vol*R,sum=P=>ladList(P).reduce((x,y)=>x+y,0),base={tipo:'ladder',passo:1,lung:3,sposta:1,rest:60,top2:'',ondaK:'gradini'};
  const pick=(cands,tgt)=>{let bp=null,bs=1e9;for(const P of cands){const l=ladList(P);if(l.length>=80)continue;const top=Math.max(...l),sc=Math.abs(sum(P)-goal)/R+.8*Math.abs(top/R-tgt);if(sc<bs){bs=sc;bp=P}}return bp};
  const tops=(lo,hi)=>{const o=[];for(let t=Math.max(2,Math.round(R*lo));t<=Math.max(2,Math.round(R*hi));t++)o.push(t);return o};
  const V=n=>Array.from({length:n},(_,i)=>i+1);
  const C=[];
  C.push(pick(tops(.35,.65).flatMap(t=>V(12).map(v=>({...base,verso:'su',da:1,a:t,volte:v}))),.5));
  C.push(pick(tops(.35,.6).flatMap(t=>V(10).map(v=>({...base,verso:'sugiu',da:1,a:t,volte:v}))),.45));
  C.push(pick(tops(.3,.55).flatMap(t=>V(10).map(v=>({...base,verso:'sugiu',top2:'1',da:1,a:t,volte:v}))),.4));
  C.push(pick(tops(.4,.7).flatMap(t=>V(8).flatMap(nw=>V(4).map(v=>({...base,verso:'onda',ondaK:'gradini',da:Math.max(1,t-2-(nw-1)),a:t,volte:v})))),.55));
  C.push(pick(tops(.45,.7).flatMap(t=>[3,4,5].flatMap(L=>V(6).map(v=>({...base,verso:'onda',ondaK:'alt',loDa:1,loA:L,hiDa:Math.max(L+1,t-(L-2)),hiA:t,volte:v})))),.6));
  return {R,vol,src:txt,list:C.filter(Boolean).map(P=>{const l=ladList(P);return {P,tot:l.reduce((x,y)=>x+y,0),top:Math.max(...l),sets:l.length}})};
}
function vLadSug(g){
  if(g.err)return `<p class="muted small" style="margin:8px 0 0">${g.err}</p>`;
  return `<p class="small" style="margin:8px 0 4px">${g.src} Volume cercato: ${fmtN(g.vol,1)} volte, cioè circa ${Math.round(g.vol*g.R)} ripetizioni.</p><p class="muted small" style="margin:0 0 6px">Il gradino più alto resta intorno al 40–70% delle massime, per allenarti lontano dal cedimento.</p>
    ${g.list.map((x,i)=>`<div class="trow"><div><b>${ladKind(x.P).replace(/^./,c=>c.toUpperCase())}</b>: ${ladDesc(x.P)}${x.P.volte>1?` x${x.P.volte}`:''}
      <div class="muted small">${x.sets} serie, ${x.tot} ripetizioni (${fmtN(x.tot/g.R,1)} volte le massime), gradino più alto ${x.top} = ${fmtN(x.top/g.R*100)}%</div></div>
      <div class="acts"><button class="btn" data-a="ladUse" data-i="${i}">Usa questa</button></div></div>`).join('')}`;
}
function vProtocolli(){
  if(!S.pf)S.pf=newPf();const f=S.pf,list=protoList();
  return `<section class="card"><h3 style="margin-bottom:10px">${f.editId?'Modifica protocollo':'Nuovo protocollo'}</h3>
    <div class="seg sm" role="group" aria-label="Tipo di protocollo" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));margin-bottom:10px">${PTIPI.map(([k,l])=>`<button data-a="pfSet" data-k="tipo" data-v="${k}" aria-pressed="${f.tipo===k}">${l}</button>`).join('')}</div>

  <section class="card"><h3>Protocolli</h3>
    ${list.length?PTIPI.map(([k,l])=>{const g=list.filter(P=>P.tipo===k);return g.length?`<h3 style="font-size:16px;margin:12px 0 2px" class="muted">${l}</h3>${g.map(P=>{const u=protoUse(P.id);return `<div class="trow"><div><b>${esc(pName(P))}</b>${P.nome?`<div class="muted small">${esc(pAuto(P))}</div>`:''}<div class="muted small">${u?`Usato in ${u} ${u===1?'seduta':'sedute'}`:'Non ancora usato'}${(P.src||[]).length?`; corrisponde a «${esc(P.src.slice(0,2).join('», «'))}»${P.src.length>2?'…':''}`:''}</div></div>
      <div class="acts"><button class="btn primary" data-a="pUse" data-id="${esc(P.id)}">Usa in seduta</button><button class="btn" data-a="pfEdit" data-id="${esc(P.id)}">Modifica</button><button class="btn ghost danger" data-a="pfAskDel" data-id="${esc(P.id)}">Elimina</button></div></div>`}).join('')}`:''}).join(''):'<p class="muted">Ancora nessun protocollo.</p>'}
    ${S.hist.length?'<button class="btn" data-a="pfRebuild" style="margin-top:10px">Aggiungi quelli usati negli ultimi mesi</button>':''}
    <p class="muted small" style="margin:8px 0 0">Nella seduta scegli il protocollo di ogni esercizio: il timer usa questi valori. Gli esercizi con lo stesso protocollo di gruppo (superset, E2MOM, EDT, circuito) partono insieme.</p></section>`;
}

/* ----- profili sul dispositivo ----- */
const profName=id=>{const x=S.prof.list.find(p=>p.id===id);return (x&&x.nome)||(id==='main'?'Profilo principale':'Profilo')};
async function saveProf(){try{if(S.mode==='db'&&S.db&&S.uid)await S.db.doc(`data/users/${S.uid}/profili`).set(S.prof);else store('diario-profili',S.prof)}catch(e){}}
let profPubT=null;
function profPublishSoon(){if(S.prof.list.length<2||!S.hist.length)return;clearTimeout(profPubT);profPubT=setTimeout(()=>{const sm=teamSummary(),key=JSON.stringify({...sm,upd:0});if(key===S.profLastKey)return;S.profLastKey=key;S.prof.sum={...S.prof.sum,[PID]:sm};saveProf()},6000)}
function profSwitch(id){if(id===PID){closeSheet();return}if(T&&!T.done){confirmSheet('Cambiare profilo?','Il timer in corso verrà fermato.','Cambia','profGoNow',`data-id="${esc(id)}"`);return}profGo(id)}
function profGo(id){try{if(S.draft)persistDraft()}catch(e){}try{localStorage.setItem(NS+'diario-profilo',id);sessionStorage.setItem(NS+'diario-chiesto','1')}catch(e){}location.reload()}
function profAsk(){let asked=false;try{asked=sessionStorage.getItem(NS+'diario-chiesto')==='1';sessionStorage.removeItem(NS+'diario-chiesto')}catch(e){}if(!asked&&profCheck())return;if(asked||S.prof.list.length<2||S.prof.ask===false)return;sheet(vProfPick('Chi si allena?'))}
function profChip(){return S.prof.list.length>1?`<button class="btn ghost" data-a="profPick" style="margin-left:auto;font-size:17px" aria-label="Profilo in uso: ${esc(profName(PID))}. Cambia profilo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="vertical-align:-4px;margin-right:4px"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>${esc(profName(PID))} ▾</button>`:''}
function devData(){const r={};if(S.mode==='db')return r;
  try{for(const k of Object.keys(localStorage)){if(!k.startsWith(NS+'diario-storico')&&!k.startsWith(NS+'diario-sedute'))continue;const m=k.match(/@([^@]+)$/),id=m?m[1]:'main';
    let n=0;try{const v=JSON.parse(localStorage.getItem(k)||'null');n=Array.isArray(v)?v.length:v?Object.values(v).filter(x=>x&&!x.deleted).length:0}catch(e){}r[id]=(r[id]||0)+n}}catch(e){}return r}
function profCheck(){
  if(S.mode!=='local'||S.hist.length)return false;
  const d=devData(),altri=Object.entries(d).filter(([id,n])=>id!==PID&&n>0);if(!altri.length)return false;
  const known=new Set(S.prof.list.map(x=>x.id));
  sheet(`<h3>Questo profilo è vuoto</h3><p class="muted">Sei nel profilo «${esc(profName(PID))}», che non ha sedute. Su questo dispositivo ci sono sedute salvate in altri profili:</p>
    <div style="display:grid;gap:8px;margin-top:10px">${altri.map(([id,n])=>known.has(id)?`<button class="btn primary" data-a="profUse" data-id="${esc(id)}" style="justify-content:flex-start;min-height:56px">Passa a «${esc(profName(id))}» (${n} sedute)</button>`
      :`<button class="btn primary" data-a="profRecover" data-id="${esc(id)}" style="justify-content:flex-start;min-height:56px">Ripristina il profilo con ${n} sedute</button>`).join('')}</div>
    ${altri.some(([id])=>!known.has(id))?'<p class="muted small" style="margin:10px 0 0">«Ripristina» rimette in elenco un profilo i cui dati sono ancora sul dispositivo ma che non compariva più.</p>':''}
    <div class="row" style="margin-top:12px"><button class="btn" data-a="closeSheet">Resta qui</button></div>`);return true;
}
function vProfPick(title){return `<h3>${title}</h3><div style="display:grid;gap:8px;margin-top:10px">${S.prof.list.map((x,i)=>`<button class="btn ${x.id===PID?'primary':''}" data-a="profUse" data-id="${esc(x.id)}" style="justify-content:flex-start;font-size:20px;min-height:56px"><span class="chipx" style="background:${TCOL[i%10]}"></span>${esc(profName(x.id))}${(()=>{const n=x.id===PID&&S.mode==='local'?S.hist.length:devData()[x.id];return n!=null&&S.mode==='local'?` <span class="small" style="opacity:.75">&nbsp;${n} sedute</span>`:''})()}${x.id===PID?' (in uso)':''}</button>`).join('')}</div>
  <div class="row" style="margin-top:14px"><button class="btn" data-a="profManage">Gestisci profili</button><button class="btn" data-a="closeSheet">Chiudi</button></div>`}
function vProfili(){
  const L=S.prof.list;
  return `<section class="card"><h3 style="margin-bottom:6px">Profili su questo dispositivo</h3>
    <p class="muted small" style="margin:0 0 8px">Ogni profilo ha le sue sedute, i suoi test, protocolli, dati biometrici e impostazioni. Utile se più persone usano lo stesso tablet.</p>
    ${L.map((x,i)=>`<div class="trow"><div style="display:flex;align-items:center;gap:8px"><span class="chipx" style="background:${TCOL[i%10]}"></span><input type="text" value="${esc(x.nome||'')}" placeholder="${esc(profName(x.id))}" data-f="pl:${esc(x.id)}" aria-label="Nome del profilo" style="max-width:220px">${x.id===PID?' <b class="small">in uso</b>':''}</div>

const teamOk=()=>S.mode==='db'&&!!S.db&&!!S.uid&&PID==='main';
const teamCodes=()=>(S.cfg&&S.cfg.team&&S.cfg.team.codes)||[];
const teamShare=()=>!(S.cfg&&S.cfg.team&&S.cfg.team.share===false);
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<6;i++)c+=a[Math.floor(Math.random()*a.length)];return c}
function teamSummary(){
  const from=isoMinus(todayIso(),365),info=new Map();
  for(const s of S.hist){if(s.d<from)break;for(const e of s.ex){if(!e.n||e.st==='Non eseguito')continue;info.set(e.n,(info.get(e.n)||0)+1)}}
  const names=[...info.entries()].sort((a,b)=>b[1]-a[1]).slice(0,25).map(x=>x[0]),ex={};
  const r=(x,d)=>x==null?null:Math.round(x*d)/d;
  names.forEach(n=>{const sr=exSeries(n,from).slice(-60);const t=maxFor(n,todayIso());ex[n]={p:sr.map(x=>[x.d,r(x.e1,10),r(x.dens,100),r(x.pi,10),r(x.vol,100),r(x.ton,1)]),rm:t?t.rm:null}});
  const weeks=[];let mo=mondayOf(todayIso());for(let i=0;i<12;i++){const nx=isoMinus(mo,-7);weeks.push([mo,S.hist.filter(s=>s.d>=mo&&s.d<nx).length]);mo=isoMinus(mo,7)}
  return {v:1,squadre:teamCodes(),upd:Date.now(),ex,weeks:weeks.reverse()};
}
let teamPubT=null;
function teamPublishSoon(){if(!teamOk()||!teamCodes().length)return;clearTimeout(teamPubT);teamPubT=setTimeout(()=>teamPublish(false),8000)}
async function teamPublish(force){
  if(!teamOk())return;
  try{
    if(!teamCodes().length||!teamShare()){if(S.teamPubbed||force){await S.db.doc('membri/'+S.uid).delete();S.teamPubbed=false;S.teamLastKey=''}return}
    const sm=teamSummary(),key=JSON.stringify({...sm,upd:0});if(!force&&key===S.teamLastKey)return;
    await S.db.doc('membri/'+S.uid).set(sm);S.teamLastKey=key;S.teamPubbed=true;S.teamErr='';
  }catch(e){S.teamErr=(e&&e.code)||'errore';if(S.tab==='esercizi'&&S.exView==='team')render()}
}
function teamWatch(code){
  if(S.team.unsub){try{S.team.unsub()}catch(e){}}S.team.unsub=null;S.team.members=new Map();S.team.code=code||null;S.team.mem=null;
  if(!code||!teamOk())return;
  try{S.team.unsub=S.db.collection('membri').where('squadre','array-contains',code).onSnapshot(q=>{S.team.members=new Map(q.docs.map(d=>[d.id,d.data()]));teamNames();if(S.tab==='esercizi'&&S.exView==='team')render()},()=>{})}catch(e){}
  S.db.doc('squadre/'+code).get().then(d=>{S.team.meta[code]=d.exists?d.data():null;if(S.tab==='esercizi'&&S.exView==='team')render()}).catch(()=>{});
}
async function teamNames(){try{const ps=await S.userNS.profiles([...S.team.members.keys()]);S.team.names=ps||{};if(S.tab==='esercizi'&&S.exView==='team')render()}catch(e){}}
const tName=id=>id===S.uid?'Tu':((S.team.names[id]&&S.team.names[id].name)||'Atleta');
const TCOL=['#0284C7','#F97316','#16A34A','#9333EA','#DC2626','#0D9488','#CA8A04','#DB2777','#475569','#65A30D'];
const PMI={e1:1,dens:2,pi:3,vol:4,ton:5};
function memSeries(m,n,from){const x=m.ex&&m.ex[n];if(!x)return [];const k=PMI[S.progM]||1;return x.p.filter(p=>p[0]>=from&&p[k]!=null).map(p=>({d:p[0],v:p[k]}))}
function mChart(title,series,dec){
  const all=series.flatMap(s=>s.pts);if(all.length<2)return '';
  const W=640,H=240,L=52,R=14,T=14,B=30,xs=all.map(p=>isoUTC(p.d)),x0=Math.min(...xs),x1=Math.max(...xs),vs=all.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);const pd=(hi-lo)*.1||1;lo-=pd;hi+=pd;
  const X=t=>L+(W-L-R)*(x1===x0?.5:(t-x0)/(x1-x0)),Y=v=>H-B-(H-T-B)*(v-lo)/(hi-lo);
  return `<div class="chart"><h3>${title}</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">
    ${[0,1,2,3].map(i=>{const v=lo+(hi-lo)*(i+.5)/4;return `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${L-6}" y="${Y(v)+5}" font-size="15" fill="var(--muted)" text-anchor="end">${fmtN(v,dec)}</text>`}).join('')}
    <text x="${L}" y="${H-8}" font-size="15" fill="var(--muted)">${fmtD(new Date(x0).toISOString().slice(0,10))}</text><text x="${W-R}" y="${H-8}" font-size="15" fill="var(--muted)" text-anchor="end">${fmtD(new Date(x1).toISOString().slice(0,10))}</text>
    ${series.map(s=>s.pts.length?`<polyline fill="none" stroke="${s.c}" stroke-width="${s.me?3.4:2.2}" stroke-linejoin="round" points="${s.pts.map(p=>`${X(isoUTC(p.d))},${Y(p.v)}`).join(' ')}"/>`:'').join('')}
    ${series.map(s=>s.pts.map(p=>`<g class="pt" data-tip="${esc(`${s.name}, ${fmtD(p.d)}: ${fmtN(p.v,dec)}`)}"><circle cx="${X(isoUTC(p.d))}" cy="${Y(p.v)}" r="11" fill="transparent"/><circle class="dot" cx="${X(isoUTC(p.d))}" cy="${Y(p.v)}" r="2.6" fill="${s.c}"/></g>`).join('')).join('')}
  </svg><p class="tip muted" aria-live="polite">Tocca un punto per vedere atleta, data e valore.</p><p class="muted small" style="margin:4px 0 0"><b>Orizzontale</b>: la data di ogni seduta. <b>Verticale</b>: ${esc(title.split(':')[0])}. Una linea per atleta.</p><div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.name)}</span>`).join('')}</div></div>`;
}

/* ----- guida ----- */
function vGuida(){
  const sec=(t,b,open)=>`<details${open||(S.guideOpen&&t.startsWith(S.guideOpen))?' open':''}><summary>${t}</summary><div class="gb">${b}</div></details>`;
  const ch=(c,t)=>`<span class="chipx" style="background:${c}"></span>${t}`;
  const tb=(h,rows)=>`<div style="overflow-x:auto"><table class="tbl"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  return `<div class="top"><h1>Guida</h1></div><div class="guide">
  <p class="muted" style="margin:0 0 14px">Come usare l’app e come sono calcolati i numeri. Tocca un titolo per aprirlo. <span class="small">Versione ${APP_VER}</span></p>
  ${sec('Iniziare da zero, passo per passo',`<p>Per chi apre l’app per la prima volta, senza un backup da importare.</p>
    <ol>
    <li><b>Apri l’app.</b> Su claude.ai basta il link. Sul tablet o sul telefono aprila con Chrome e installala dal menu ⋮ → «Installa app» (o «Aggiungi a schermata Home»): avrai l’icona e funzionerà anche senza internet.</li>
    <li><b>Il tuo profilo.</b> In <b>Test → Dati biometrici</b> scrivi nome, sesso e data di nascita, e fai la prima misurazione (almeno il peso corporeo: serve per i test a corpo libero). Se il dispositivo lo usano più persone, crea qui un profilo per ciascuno.</li>
    <li><b>I massimali.</b> In <b>Test → Test e massimali</b> registra un test per gli esercizi principali: 1RM, ripetizioni con un carico, 5RM o corpo libero. Bastano carico e ripetizioni: il massimale lo calcola l’app. Da quel momento la % 1RM delle sedute si calcola da sola. Senza test l’app funziona lo stesso, ma la % la scrivi tu.</li>
    <li><b>I protocolli.</b> In <b>Esercizi → Protocolli</b> crea i protocolli che usi (es. Set&amp;Pause 4x6 Rest 90″, E2MOM 10x60″, EDT 15′, una ladder). È facoltativo ma comodo: nella seduta li scegli da un elenco e il timer parte già impostato.</li>
    <li><b>La prima seduta.</b> In <b>Diario</b> tocca «Seduta vuota». Scrivi un codice nel campo <b>WO</b> (es. A): è il nome dell’allenamento e servirà per ripeterlo. Aggiungi gli esercizi con «Aggiungi un esercizio», oppure parti da un esercizio («Aggiungi alla seduta» nella sua scheda) o da un protocollo («Usa in seduta»).</li>
    <li><b>Ogni esercizio.</b> Scegli il protocollo, scrivi il carico in Kg (a corpo libero: peso corporeo + zavorra), le <b>Rep previste</b> e il <b>N° serie</b>. Se vuoi la doppia progressione, apri «Progressione» e imposta tetto, ripartenza e kg in più.</li>
    <li><b>Durante l’allenamento.</b> Tocca il pulsante del timer sulla scheda: segni l’esito delle serie mentre recuperi. Senza timer, tocca le serie: un tocco = completata, un secondo tocco per a fatica, fallita (con le ripetizioni fatte) o non eseguita. Alla fine indica la <b>Fatica</b>.</li>
    <li><b>Chiudi la seduta.</b> Il salvataggio è automatico; «Chiudi seduta» quando hai finito. Se era solo una prova, «Elimina seduta».</li>
    <li><b>Le sedute successive.</b> In Diario → Nuova seduta compare il tuo WO: toccandolo riparte dall’ultima volta con il piano successivo già proposto. Crea altri WO (B, C…) per gli altri allenamenti della settimana.</li>
    <li><b>Quando vuoi, il resto.</b> Nella scheda Timer, «Fasi della seduta» per riscaldamento e stretching; in fondo alla seduta il <b>finisher</b>; in Esercizi → Andamento i progressi (servono almeno 4 sedute per esercizio nel periodo scelto).</li>
    <li><b>Il backup.</b> Ogni tanto, in <b>Storico → Esporta backup</b>, salva un file: sul tablet i dati stanno nella memoria di Chrome, e con il backup li ritrovi su un altro dispositivo con «Importa backup».</li>
    </ol>`)}
  ${sec('Comporre una seduta: da dove partire',`<ul>
    <li><b>Da un WO</b> (Diario → Nuova seduta): copia gli esercizi dell’ultima seduta con quel WO, con il piano successivo e il finisher.</li>
    <li><b>Da una seduta vuota</b>: aggiungi gli esercizi uno per uno.</li>
    <li><b>Da un esercizio</b> (Esercizi → scheda dell’esercizio → «Aggiungi alla seduta»): lo aggiunge alla seduta aperta, oppure ne apre una nuova di oggi.</li>
    <li><b>Da un protocollo</b> (Esercizi → Protocolli → «Usa in seduta»): scegli gli esercizi (uno, o più se il protocollo è di gruppo: E2MOM, superset, EDT, circuito, AMRAP…) e li trovi nella seduta già con quel protocollo; il pulsante del timer sulla scheda parte già impostato.</li>
    <li><b>Solo il timer</b> (scheda Timer): senza toccare il diario.</li></ul>
    <p><b>Registrare o no.</b> Una seduta composta resta nel diario finché non la elimini (Diario → «Elimina seduta»). I timer usati senza seduta, alla fine, chiedono «Inserisci nel diario» o «Non inserire»: così puoi provare un protocollo o fare un allenamento extra senza registrarlo.</p>`)}
  ${sec('Il Diario: In corso, Programmate, Archiviate',`<ul>
    <li><b>In corso</b>: i WO che stai usando. Toccane uno per allenarti: copio gli esercizi dell’ultima volta e propongo il piano successivo. «Archivia» lo sposta negli archiviati. «+ Nuova seduta» ne apre una vuota.</li>
    <li><b>Programmate</b>: sedute preparate e mai eseguite, che si aprono così come le hai lasciate. «+ Nuova seduta programmata» ne crea una con nome, WO nuovo e data. Sono le uniche sedute che si possono eliminare.</li>
    <li><b>Usare una programmata</b>: aprila da Programmate, controlla o cambia quello che vuoi, poi «Avvia la seduta» (oppure segna le serie a mano). Alla <b>prima serie registrata</b> diventa una seduta dello storico con la data di oggi e il suo WO passa in «In corso», anche se era archiviato. Se la apri o la avvii e ti fermi prima della prima serie, resta tra le programmate.</li>
    <li><b>Archiviate</b>: WO eseguiti che ora non usi. Non si cancellano, per non perdere lo storico. «Rimetti in corso» li riporta in uso; «Programma di nuovo» ne prepara una seduta con il piano successivo; «Modifica una copia» crea una copia con un WO nuovo da cambiare liberamente.</li>
    <li>All’inizio sono in corso i WO usati negli ultimi sei mesi e archiviati gli altri. Una seduta eseguita con un WO archiviato lo rimette in corso.</li>
    <li>Con una seduta aperta, «← Sedute» torna all’elenco e «Riprendi» la riapre. Una singola seduta si può eliminare dallo Storico o dalla seduta stessa: se contiene dati (serie fatte, note) l’app chiede conferma e mostra cosa si perde; se è stata solo avviata e terminata senza nulla di fatto, la elimina subito. I WO eseguiti invece non si cancellano: si archiviano.</li></ul>`)}
  ${sec('Preparare una seduta per un’altra volta',`<p>Puoi preparare una seduta senza farla subito: componi gli esercizi, i carichi, i protocolli, il finisher, poi tocca <b>«Salva per un prossimo allenamento»</b> in fondo alla seduta.</p>
    <ul><li><b>Aggiorna questa seduta</b>: la salva così com’è e la chiude.</li>
    <li><b>Salva come nuova seduta</b>: con un nome, un WO e una data. Il WO proposto è la prima lettera libera e si può cambiare, ma non può essere uno già usato. La seduta aperta resta com’era.</li></ul>
    <p>Le sedute preparate compaiono in <b>Diario → Programmate</b> e si aprono così come le hai lasciate. Per usarne una: aprila, controllala, «Avvia la seduta». Finché non c’è la prima serie registrata non contano nello storico, nell’andamento né nella progressione; alla prima serie diventano sedute normali, con la data del giorno in cui le fai, e il WO passa in «In corso». Da lì in poi la ritrovi in «In corso»: toccandola riparte con il piano successivo.</p>`)}
  ${sec('Avviare tutta la seduta dal diario',`<p>Nella seduta tocca <b>«Avvia la seduta»</b>, il pulsante in alto. Si apre il piano:</p>
    <ul><li><b>Blocchi</b>, nell’ordine: ogni esercizio o gruppo (superset, E2MOM, EDT…) con il suo timer, già impostato dal protocollo, e il finisher alla fine. «Modifica» apre il timer del blocco: tempi, giri, preparazione, colori, avvisi. «Salva e torna al piano» vale solo per questa seduta.</li>
    <li><b>Tra un blocco e l’altro</b>: la pausa in secondi e se il blocco successivo parte da solo.</li>
    <li><b>Fasi della seduta</b>: riscaldamento e defaticamento (anche lo stretching a posizioni).</li></ul>
    <p>Poi <b>«Avvia la seduta»</b>: riscaldamento → primo blocco → pausa (vedi il blocco successivo, con «Avvia ora» o «Salta questo blocco») → … → finisher → defaticamento → riepilogo con i tempi. Le serie si scrivono da sole nelle schede degli esercizi. Durante la seduta il pulsante del diario diventa «Torna alla seduta in corso».</p>`)}
  ${sec('Una seduta, passo per passo',`<ul>
    <li><b>Nuova seduta</b>: scegli il WO (X, F, Z, A…). Copio gli esercizi dell’ultima volta con il piano successivo già pronto; oppure parti da «Seduta vuota».</li>
    <li><b>Segna le serie</b>: un tocco su una serie = completata; un secondo tocco apre esito (a fatica, fallita con le ripetizioni vere, non eseguita) e − / +.</li>
    <li><b>Fatica e note</b> per ogni esercizio; la % 1RM si calcola da sola dal massimale («auto»), ma puoi scriverla a mano.</li>
    <li><b>Protocollo e timer</b>: scegli il protocollo dall’elenco (Esercizi → Protocolli) e il pulsante sulla scheda apre il timer già impostato. Con «Testo libero» il timer prova a leggere il testo (Rest 90″, EMOM 10x60″, EDT 15′, «+ Calf» = superset).</li>
    <li><b>Finisher</b> e <b>riepilogo</b> in fondo alla seduta. Il salvataggio è automatico: «Chiudi seduta» quando hai finito.</li></ul>`,true)}
  ${sec('Colori delle serie',`<p>${ch('var(--ok)','completata')} &nbsp; ${ch('var(--fat)','a fatica')} &nbsp; ${ch('var(--ko)','fallita (il numero è quante ne hai fatte)')} &nbsp; ${ch('var(--skip)','non eseguita')}</p>
    <p>Le serie tratteggiate sono ancora da fare e mostrano l’obiettivo. Con «Rep previste» compilato, una serie sotto l’obiettivo diventa rossa da sola.</p>`)}
  ${sec('Doppia progressione',`<p><b>Rep previste</b> = ripetizioni base; <b>Serie a +1</b> = quante delle prime serie ne fanno una in più. Esempio: 4-4-4-3-3-3 = base 3, prime 3 a +1.</p>
    <p>La seduta dopo: se qualche serie è fallita → stesso piano; se tutte riuscite → una serie a +1 in più; quando tutte sono a +1 → la base sale. Con «Progressione» imposti <b>tetto</b>, <b>riparti da</b> e <b>kg in più</b>: arrivato al tetto riparte dalla base bassa con più carico.</p>`)}
  ${sec('I timer',`<ul>
    <li><b>Set&amp;Pause</b>: avvii la serie, «Fine serie», parte il recupero (fisso, multiplo della durata o libero: in quel caso tocchi «Inizia serie»). Più esercizi: uno dopo l’altro oppure superset / triset / giant set. Nelle ripetizioni puoi scrivere una scala come 1-2-3-4-5 (Ladder).</li>
    <li><b>EMOM / E2MOM / E3MOM</b>: un esercizio per intervallo, a rotazione, per N giri; riposo a fine giro e a fine EMOM facoltativi; segni le ripetizioni durante o dopo l’intervallo.</li>
    <li><b>EDT</b>: alterni due esercizi per il tempo della PR Zone confermando le ripetizioni; con due PR Zone, pausa e poi un’altra coppia.</li>
    <li><b>AMRAP</b>: più giri possibile entro il tempo; a ogni esercizio confermi le ripetizioni con ➜ (✓ se l’esercizio è uno solo).</li>
    <li><b>RT</b>: un totale di ripetizioni da raggiungere; dopo ogni serie segni quante ne hai fatte e vedi quante ne mancano.</li>
    <li><b>Circuito</b>: stazioni a tempo o a ripetizioni, pausa tra le stazioni e riposo tra i giri.</li>
    <li><b>Test</b>: Test 30′ / 15′ con +1 a ogni ripetizione, divise nei tre blocchi.</li></ul>
    <p>Per tutti: preparazione, colori, avviso prima della fine, avviso a metà, suoni (anche a voce), schermo intero, riposo alla fine. «Torna alla seduta» lascia il timer acceso. I timer avviati dalla seduta scrivono serie e tempo nel diario; gli altri a fine timer chiedono se inserirli.</p>`)}
  ${sec('Andamento: capire se e quanto migliori',`<p>Lo trovi in <b>Esercizi → Andamento</b> (tutti gli esercizi) e nella scheda di ogni esercizio (il dettaglio).</p>
    <h3 style="margin:10px 0 4px">Le cinque misure</h3><ul>
    <li><b>Forza stimata</b>: il massimale che dimostri con quello che hai fatto in seduta. Per ogni serie: ripetizioni massime stimate = ripetizioni fatte + quelle che probabilmente avevi ancora in riserva (fallita 0, a fatica 0,5, completata secondo la fatica e almeno 1); dalla tabella ripetizioni ↔ % trovi la percentuale; forza stimata = kg ÷ %. Si tiene la serie migliore della seduta. Esempio: 6 ripetizioni a fatica con 80 kg → 6,5 ripetizioni massime → 84% → 95,2 kg. Con recuperi brevi (EMOM, superset) la stanchezza abbassa le ripetizioni, quindi la stima è di solito più bassa del massimale dei test: conta la direzione della linea.</li>
    <li><b>Volume</b>: ripetizioni × % 1RM. Sale se fai più ripetizioni o usi carichi più vicini al massimale.</li>
    <li><b>Tonnellaggio</b>: kg × ripetizioni, il peso totale sollevato; non dipende dai massimali né da stime (a corpo libero i kg sono peso corporeo + zavorra).</li>
    <li><b>Densità</b>: ripetizioni al minuto (serve il campo Tempo).</li>
    <li><b>PowerIndex</b>: volume² ÷ tempo; premia molto lavoro in poco tempo (serve il campo Tempo).</li></ul>
    <h3 style="margin:10px 0 4px">La vista d’insieme</h3>
    <p>Scegli il periodo (3 mesi, 6 mesi, 1 anno, tutto) e la misura. Per ogni esercizio con almeno 4 sedute nel periodo vedi: il valore attuale, la variazione (▲ verde se sale di oltre l’1%, ▼ rossa se scende, ● grigia se è stabile) e un mini grafico. La variazione confronta la media del primo quarto delle sedute del periodo con quella dell’ultimo quarto, così una seduta storta non cambia il giudizio. In cima: quanti esercizi migliorano, peggiorano o sono stabili.</p>
    <h3 style="margin:10px 0 4px">Il dettaglio di un esercizio</h3>
    <ul><li>La frase in alto e i riquadri: forza stimata e variazione, miglior stima, carico massimo, volume a settimana (confrontato con la prima metà del periodo), sedute a settimana, % di serie fallite, densità, PowerIndex, ultimo test.</li>
    <li><b>Per seduta / Per settimana</b>: per seduta ogni punto è un allenamento; per settimana ogni punto è una settimana dell’anno (forza stimata e carico = la seduta migliore, volume = la somma, densità e PowerIndex = la media). La settimana ti mostra la tendenza anche se non ti alleni sempre negli stessi giorni.</li>
    <li><b>I grafici</b>: forza stimata, volume, densità, PowerIndex e carico usato. In orizzontale c’è il tempo (date o settimane), in verticale il valore della misura con la sua unità. I punti verdi sono sedute (o settimane) con tutte le serie riuscite, quelli rossi con almeno una serie fallita; la linea grigia sottile unisce i punti, quella scura è la media degli ultimi 5 punti e mostra la tendenza senza gli sbalzi.</li>
    <li><b>Tocca un punto</b> per leggere sotto il grafico la data (o la settimana) e il valore esatto.</li></ul>
    <h3 style="margin:10px 0 4px">Come leggerlo</h3>
    <p>Forza stimata che sale = a parità di carico fai più ripetizioni, o a parità di ripetizioni sollevi di più. Volume che sale con forza ferma = stai accumulando lavoro (spesso arriva dopo). Molti punti rossi in fila = carico o progressione troppo aggressivi. Densità e PowerIndex dicono se fai lo stesso lavoro in meno tempo.</p>`)}
  ${sec('Protocolli',`<p>In <b>Esercizi → Protocolli</b> descrivi ogni protocollo con i suoi valori invece che a parole: Set&amp;Pause (serie, ripetizioni, recupero fisso o multiplo, superset), EMOM (giri, secondi, ripetizioni, riposo a fine giro), EDT (minuti, ripetizioni target, pausa tra PR Zone), Circuito (giri, stazioni a tempo o a ripetizioni, pause) e Max ripetizioni (riposo).</p>
    <ul><li><b>ST (Serie Target)</b>: N serie da X ripetizioni con il recupero che ti serve (libero o fisso); conta il tempo per completarle.</li>
    <li><b>Ladder</b>: scala di ripetizioni, ripetibile più volte. Andamenti: in salita (1-2-3-4), in discesa (4-3-2-1), su e giù (1-2-3-4-3-2-1, con l’opzione di ripetere il gradino più alto: 1-2-3-4-4-3-2-1) e a onda: a gradini (1-2-3 / 2-3-4 / 3-4-5), alternata basso / alto (bassi 1→3 e alti 5→6 = 1-5-2-6-3) o personalizzata (scrivi la sequenza, es. 1,7,2,8,3,1,7). Ogni gradino è una serie con il suo obiettivo; può alternare più esercizi. Il recupero può essere fisso, un multiplo della durata della serie (come in Set&amp;Pause: ×1,5 vuol dire che dopo una serie di 20″ riposi 30″) oppure libero. «Proponi una ladder» parte dai test, da un 1RM con il carico che userai o dalle massime ripetizioni, e cerca per ogni andamento la scala più vicina al volume che scegli (da 1 a 6 volte le massime), con il gradino più alto intorno al 40–70% delle massime.</li>
    <li><b>RT (Ripetizioni Target)</b>: un totale da raggiungere con le serie che servono.</li>
    <li><b>AMRAP</b>: più giri possibile in N minuti con gli esercizi del protocollo.</li>
    <li><b>E2MOM / E3MOM</b>: ogni esercizio del giro può avere secondi e ripetizioni suoi.</li>
    <li><b>Circuito</b>: ogni stazione può essere a tempo o a ripetizioni.</li></ul>
    <p>Le ripetizioni del piano dell’esercizio (doppia progressione) hanno la precedenza; se l’esercizio non ha un piano valgono quelle del protocollo.</p>
    <p>Il nome si scrive da solo (es. «EMOM 10x60″ x 6») oppure gli dai tu un nome. Nella seduta, gli esercizi con lo stesso protocollo di gruppo partono insieme: due esercizi con lo stesso EMOM diventano un E2MOM, con lo stesso superset un superset, e così via. I protocolli usati negli ultimi mesi sono già pronti, e le nuove sedute li riconoscono dal testo che usavi.</p>`)}
  ${sec('La schermata dell’EDT',`<ul>
    <li><b>In alto</b>: EDT, il cronometro della seduta e ⛶ per lo schermo intero.</li>
    <li><b>Al centro</b>: «PR Zone 1 / 2, tempo rimasto» (o solo «Tempo rimasto»), l’esercizio da fare adesso e il tempo grande che scende.</li>
    <li><b>Sotto il tempo</b>: il target di ripetizioni e l’esercizio che viene dopo.</li>
    <li><b>− numero +</b>: le ripetizioni della serie che hai appena fatto; parte dal target, correggilo se ne hai fatte di più o di meno.</li>
    <li><b>➜</b>: conferma le ripetizioni e passa all’altro esercizio. Il colore dello schermo cambia con l’esercizio.</li>
    <li><b>I due riquadri</b>: ripetizioni e serie fatte finora per ciascun esercizio della zona; quello evidenziato è in corso.</li>
    <li><b>Pausa, Termina, Torna alla seduta</b>. Nella pausa tra le PR Zone e nel riposo finale puoi ancora registrare la serie in corso.</li></ul>`)}
  ${sec('Seduta completa: riscaldamento, finisher, stretching',`<ul>
    <li>In «Fasi della seduta» attivi <b>riscaldamento</b> e <b>defaticamento</b>: partono da soli o li avvii tu, a tempo fisso o finché non dici basta. Il defaticamento può essere <b>stretching a posizioni</b> (nome e secondi per ognuna).</li>
    <li>Il <b>finisher</b> (1–6 esercizi, con il suo WO) si fa a tempo, in Set&amp;Pause o a massime ripetizioni; viene riproposto dall’ultima seduta con lo stesso WO. Se c’è un finisher da fare, lo stretching aspetta che tu lo finisca.</li>
    <li>Alla fine hai i tempi di riscaldamento, allenamento, defaticamento e totale, salvati nella seduta.</li></ul>`)}
  ${sec('Esercizi, Andamento, Test e Misure',`<ul>
    <li><b>Esercizi</b>: «+ Nuovo esercizio» per crearne uno con il suo nome e la sua icona (o quella automatica, scelta dal nome); toccando l’icona nella scheda di un esercizio la cambi. Nella scheda: massimale in uso, tabella carichi, progressione, test, andamento e sedute.</li>
    <li><b>Andamento</b>: per periodo e per misura (forza stimata, tonnellaggio, volume, densità, PowerIndex) vedi quali esercizi migliorano; nella scheda dell’esercizio i grafici per seduta o per settimana (vedi «Andamento» qui sopra).</li>
    <li><b>Test</b>: 1RM, ripetizioni con carico, 5RM / corpo libero, massime ripetizioni a corpo libero, Test 30′ e 15′. I test sul massimale valgono dalla data «Applica da» e aggiornano la % delle sedute da quella data. I massimali di default vengono dalle ultime settimane dello storico.</li>
    <li><b>Dati biometrici</b>: profilo (nome, sesso, data di nascita ed età), peso corporeo e circonferenze, con l’età a ogni data e la differenza dalla volta prima.</li></ul>`)}
  ${sec('Profili sullo stesso dispositivo',`<p>Se più persone usano lo stesso tablet, crea un profilo per ciascuno in <b>Test → Dati biometrici → Profili su questo dispositivo</b>. Ogni profilo ha sedute, test, protocolli, dati biometrici, impostazioni e seduta in corso separati.</p>
    <ul><li>All’apertura l’app chiede «Chi si allena?» (si può disattivare); per cambiare profilo tocca il nome in alto nel Diario.</li>
    <li>In <b>Esercizi → Squadra → Profili di questo dispositivo</b> vedi tutti i profili come una squadra: atleti, esercizi in miglioramento, confronto per esercizio e andamenti di ognuno. I dati di un profilo si aggiornano quando quel profilo usa l’app.</li>
    <li>Il backup esporta il profilo in uso: per salvare tutti, esporta da ciascun profilo.</li></ul>`)}
  ${sec('Squadra',`<p>Nella versione su claude.ai ognuno entra con il proprio account e vede solo le proprie sedute. In <b>Esercizi → Squadra</b> puoi creare una squadra (ricevi un codice) o entrare in una con il codice.</p>
    <ul><li><b>Cosa si condivide</b>: solo i riepiloghi degli andamenti di ogni esercizio (forza stimata, densità, PowerIndex), i massimali in uso e quante sedute a settimana; sedute, note, test e dati biometrici restano privati. Puoi smettere di condividere con una casella o uscire dalla squadra.</li>
    <li><b>Cosa vedi</b>: l’elenco degli atleti con sedute delle ultime 4 settimane ed esercizi in miglioramento o in calo; il confronto per esercizio con le linee di tutti e la variazione media della squadra; toccando un atleta, i suoi andamenti uno per uno.</li>
    <li><b>Per invitare</b>: condividi l’app dal menu «Condividi» di claude.ai con il ruolo Contributor, poi dai il codice della squadra.</li>
    <li>Nell’app installata sul tablet la squadra non c’è (i dati restano sul dispositivo): importa il backup nella versione su claude.ai per aggiornare i tuoi riepiloghi.</li></ul>`)}
  ${sec('Storico, backup e tablet',`<p>Lo <b>Storico</b> mostra le sedute per settimana; aprendone una puoi modificarla o eliminarla. «Esporta CSV» crea un file da aprire con un foglio di calcolo.</p>
    <p><b>Esporta / Importa backup</b> sposta sedute, test, misure e impostazioni tra l’app su claude.ai e quella installata sul tablet: vengono aggiunte solo le cose nuove o modificate. Sul tablet i dati stanno nella memoria di Chrome: esporta un backup ogni tanto.</p>`)}
  ${sec('Formule',`${tb(['Valore','Come si calcola'],[
    ['TotRep','somma delle ripetizioni delle serie segnate (non quelle saltate)'],
    ['Tonnellaggio','TotRep × Kg'],
    ['Volume','TotRep × % 1RM'],
    ['1RM calc','Kg ÷ % 1RM'],
    ['Delta Kg 1RM','1RM calc − Kg'],
    ['Densità','TotRep ÷ Tempo (minuti)'],
    ['PowerIndex','(parte intera del Volume)² ÷ Tempo'],
    ['% 1RM automatica','Kg ÷ massimale valido nella data della seduta'],
    ['Serie fallite','serie sotto il proprio obiettivo (base, o base+1 per le prime serie)'],
    ['Riepilogo seduta','somme di TotRep, tonnellaggio e volume; densità e PowerIndex medi degli esercizi; densità della seduta = TotRep ÷ minuti totali'],
    ['Kg corpo libero','peso corporeo + zavorra (la zavorra è annotata a parte)']])}
    <h3 style="margin:14px 0 6px">Ripetizioni massime e % del massimale</h3>
    ${tb(['% 1RM','Rip. massime'],[...REPMAX].reverse().map(([q,r])=>[`${fmtN(q*100)}%`,r]))}
    <p class="muted small">Usata per «Rep max», per la tabella carichi (kg arrotondati per eccesso al chilo) e, al contrario, per stimare il massimale da un test a ripetizioni: ripetizioni fatte + in riserva, con valori intermedi a metà tra i due vicini.</p>
    <h3 style="margin:14px 0 6px">Fatica, RPE e ripetizioni in riserva</h3>
    ${tb(['Fatica','RPE','In riserva'],[['Facile','6–7','3–4'],['Liscia','8','2'],['Difficile','9','1'],['Dura','10','0'],['Fallito','11','non completato']])}
    <p class="muted small">I livelli intermedi (es. Liscia/Difficile) stanno a metà.</p>
    <h3 style="margin:14px 0 6px">Altre stime</h3>
    ${tb(['Cosa','Formula'],[

function vExHistory(name,noCharts){

function chart(title,data,dec){
  const W=600,H=200,P=30;const vals=data.map(d=>d.v).filter(v=>v!=null);
  if(!vals.length)return '';
  let lo=Math.min(...vals),hi=Math.max(...vals);if(lo===hi){lo-=1;hi+=1}
  const x=i=>P+(W-2*P)*(data.length===1?.5:i/(data.length-1)),y=v=>H-P-(H-2*P)*(v-lo)/(hi-lo);
  const pts=data.map((d,i)=>d.v==null?null:[x(i),y(d.v)]).filter(Boolean);
  return `<div class="chart"><h3>${title}</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title} nelle ultime ${data.length} sedute">
    <line x1="${P}" x2="${W-P}" y1="${H-P}" y2="${H-P}" stroke="var(--line)"/>
    <text x="${P}" y="${H-4}" font-size="20" fill="var(--muted)">${fmtD(data[0].d)}</text>
    <text x="${W-P}" y="${H-4}" font-size="20" fill="var(--muted)" text-anchor="end">${fmtD(data[data.length-1].d)}</text>
    <text x="${P}" y="20" font-size="20" fill="var(--muted)">${fmtN(hi,dec)}</text><text x="${P}" y="${H-P-4}" font-size="20" fill="var(--muted)">${fmtN(lo,dec)}</text>
    <polyline fill="none" stroke="var(--ink)" stroke-width="2.5" points="${pts.map(p=>p.join(',')).join(' ')}"/>
    ${data.map((d,i)=>d.v==null?'':`<circle cx="${x(i)}" cy="${y(d.v)}" r="5" fill="${d.f?'var(--ko)':'var(--ok)'}" stroke="var(--surface)" stroke-width="1.5"/>`).join('')}
  </svg><div class="legend"><span><i style="background:var(--ok)"></i>tutte riuscite</span><span><i style="background:var(--ko)"></i>con serie fallite</span></div></div>`;
}

function emomName(k){return k===1?'EMOM':`E${k}MOM`}
function parseProto(p){
  p=String(p||'').replace(/[″“”]/g,'"').replace(/''|""/g,'"');let m;
  if(m=p.match(/^\s*EDT\s*(\d+)/i))return {type:'edt',min:+m[1]};
  if(/EMOM/i.test(p)){
    let giri=null,sec=null,rep=null;
    if(m=p.match(/EMOM\s*(\d+)\s*x\s*(\d+)\s*x\s*(\d+)\s*"/i)){giri=+m[1];rep=+m[2];sec=+m[3]}
    else if(m=p.match(/EMOM\s*(\d+)\s*x\s*(\d+)\s*"/i)){giri=+m[1];sec=+m[2]}
    else if(m=p.match(/EMOM\s*(\d+)\s*"/i)){sec=+m[1]}
    if(rep==null&&(m=p.match(/"\s*x\s*(\d+)(?!\d)(?!\s*-)/)))rep=+m[1];
    return sec?{type:'emom',giri,sec,rep}:null;
  }
  if((m=p.match(/(?:Rest|Pausa|Rec)\s*(\d+)\s*("|s\b|sec|$|\s)/i))||(m=p.match(/(\d+)\s*"\s*(?:Calf\s*\+\s*)?Rest/i)))return {type:'rest',sec:+m[1]};
  return null;
}

function recPartners(i){
  const ex=S.draft.ex,e=ex[i],out=[i];
  String(e.p||'').split('+').slice(1).forEach(tok=>{
    const t=normN(tok.replace(/(rest|pausa|rec)\s*\d+.*$/i,'').replace(/\d+\s*["″']*/g,''));if(t.length<3)return;
    const j=ex.findIndex((x,k)=>k!==i&&!out.includes(k)&&x.n&&(normN(x.n).startsWith(t)||t.startsWith(normN(x.n).slice(0,Math.max(4,normN(x.n).length)))));
    if(j>=0&&out.length<6)out.push(j)});
  return out;
}
function timerPlan(i){
  const ex=S.draft.ex,e=ex[i],P=e.pid&&S.protos.get(e.pid);
  if(P&&!P.deleted){
    const same=ex.map((x,j)=>x.pid===e.pid&&!!x.fin===!!e.fin?j:-1).filter(j=>j>=0);
    const grp=P.tipo==='edt'||P.tipo==='circ'||P.tipo==='max'||P.tipo==='amrap'||(P.tipo==='emom'?emK(P)>1:P.tipo!=='rt'&&P.tipo!=='st'&&P.group==='super');
    let idx=grp?same:[i];
    if(P.tipo==='amrap')idx=idx.slice(0,6);
    if(P.tipo==='emom'&&idx.length>Math.min(3,emK(P)))idx=idx.sort((a,b)=>Math.abs(a-i)-Math.abs(b-i)).slice(0,Math.min(3,emK(P))).sort((a,b)=>a-b);
    if(P.tipo==='edt')idx=idx.slice(0,4);
    const mode={emom:'emom',edt:'edt',circ:'circ',amrap:'amrap',rt:'rt'}[P.tipo]||'rec';
    const label=P.tipo==='amrap'?'Timer AMRAP':P.tipo==='rt'?'Timer RT':P.tipo==='st'?'Timer ST':P.tipo==='ladder'?(idx.length>1?'Timer Ladder alternata':'Timer Ladder'):P.tipo==='emom'?`Timer ${emomName(idx.length)}`:P.tipo==='edt'?(idx.length>2?'Timer EDT, 2 PR Zone':'Timer EDT'):P.tipo==='circ'?'Timer Circuito':P.tipo==='max'?'Timer max ripetizioni':idx.length>1?`Timer ${grpName(idx.length)}`:'Set&Pause';
    return {mode,idx,proto:P,pp:{type:'proto'},label};
  }
  const pp=parseProto(e.p);
  if(pp&&pp.type==='emom'){
    let idx=ex.map((x,j)=>[j,parseProto(x.p)]).filter(([,q])=>q&&q.type==='emom'&&emomSig(q)===emomSig(pp)).map(([j])=>j);
    if(idx.length>3)idx=idx.sort((a,b)=>Math.abs(a-i)-Math.abs(b-i)).slice(0,3).sort((a,b)=>a-b);
    return {mode:'emom',idx,pp,label:`Timer ${emomName(idx.length)}`};
  }
  if(pp&&pp.type==='edt'){let all=ex.map((x,j)=>[j,parseProto(x.p)]).filter(([,q])=>q&&q.type==='edt').map(([j])=>j).slice(0,4);if(!all.includes(i))all=[i];return {mode:'edt',idx:all,pp,label:all.length>2?'Timer EDT, 2 PR Zone':'Timer EDT'}}
  const idx=recPartners(i),rp=idx.map(j=>parseProto(ex[j].p)).find(q=>q&&q.type==='rest')||null;
  return {mode:'rec',idx,pp:rp,label:idx.length>1?`Timer ${grpName(idx.length)}${rp?` ${rp.sec}″`:''}`:rp?`Set&Pause ${rp.sec}″`:'Set&Pause'};
}

function warnBeep(rem){if(T.cfg.warnSec>3&&rem<=T.cfg.warnSec*1000&&!T.warned){T.warned=true;sound('warn')}}

function countdownBeeps(remMs){

}
function tick(){

  if(!T||T.done||T.paused){updateRun();return}
  const t=clk();
  if(T.mode==='amrap'){if(amTick(t))return}
  else if(T.mode==='rt'){if(rtTick(t))return}
  else if(T.mode==='tst'){if(tstTick(t))return}
  else if(T.mode==='rec'){
    if(T.phase==='lead'){const rem=T.cfg.lead*1000-t;countdownBeeps(rem);if(rem<=0){T.restKind=null;spGo(t,true)}}
    else if(T.phase==='work'){const st=spStep();if(st&&st.w){const rem=st.w*1000-(t-T.ph0);countdownBeeps(rem);warnBeep(rem);halfBeep(rem,st.w*1000);if(rem<=0&&spEndSet(t)==='stop'){render();return}}}
    else if(T.phase==='rest'&&!isFinite(T.restMs)){}
    else if(T.phase==='rest'){const rem=T.restMs-(t-T.ph0);countdownBeeps(rem);warnBeep(rem);halfBeep(rem,T.restMs);
      if(rem<=0){if(T.final){tStop();sound('end');render();return}T.k++;spGo(t,false)}}

      if(idx===-1){emomAutoOk(T.slot);tStop();beepEnd();render();return}
      if(idx!==T.slot){if(T.slot>=0)emomAutoOk(T.slot);T.slot=idx;T.marked='';T.warned=false;T.halfDone=false;const sl=T.slots[idx];sound('change',sl.rest?'riposo':T.cfg.ex[sl.i].n);T.lastSec=null}
      T.rem=acc+T.slots[idx].sec*1000-u;countdownBeeps(T.rem);halfBeep(T.rem,T.slots[idx].sec*1000);

    if(t<T.leadMs){countdownBeeps(T.leadMs-t);updateRun();return}

  }

  async tfSave(){
    const f=S.tf,n=String(f.n||'').trim(),k=f.tipo,kg=num(f.kg);

    if(k==='1rm'){if(!(kg>0))return err('Indica il carico in kg.');t.kg=kg}

    if(k==='brz'){t.bw=num(f.bw)||0;t.kg=kg||0;t.rep=num(f.rep);t.rir=Math.max(0,num(f.rir)||0);if(!(t.bw+t.kg>0))return err('Indica il peso corporeo, il sovraccarico o entrambi.');if(!(t.rep>0))return err('Indica quante ripetizioni hai fatto.')}

    if(ENDU[k]){t.kg=kg;t.rif=num(f.rif)||null;t.parts=f.parts.map(x=>num(x)||0);if(!(kg>0))return err('Indica il peso usato.');if(!t.parts.some(x=>x>0))return err('Indica le ripetizioni fatte in almeno un blocco.');t.tot=t.parts.reduce((a,b)=>a+b,0)}
    let msg='';
    if(isRmType(k)){t.from=f.from||t.d;const rm=testRM(t);if(!rm)return err(k==='brz'?'Con 36 ripetizioni o più la formula non permette una stima.':'Con più di 30 ripetizioni la tabella non permette di stimare il massimale.');

    if(T.final){if(T.finalLogged)return;T.log.push({i:T.cur,rep:T.adj});T.finalLogged=true;beepShort();updateRun();return}
    T.log.push({i:T.cur,rep:T.adj});T.cur=(T.cur+1)%c.ex.length;if(T.cur===0){T.rounds++;sound('change',`giro ${T.rounds+1}`)}else beepShort();T.adj=c.ex[T.cur].rep;updateRun()},
  amAdd(){const c=S.tc.amrap;c.ex.push({n:'',rep:(c.ex[c.ex.length-1]||{rep:10}).rep});render()},
  amDel(el){S.tc.amrap.ex.splice(+el.dataset.i,1);render()},
  amSave(){const d=ensureDraft(),c=T.cfg;c.ex.forEach((x,i)=>{const log=T.log.filter(l=>l.i===i);if(!log.length)return;const e=exFromHistory(x.n,d.d,d.id);delete e._why;delete e.lad;
    e.p=`AMRAP ${c.min}′`;e.t=c.min;e.b=x.rep;e.k=0;e.s=log.map(l=>[l.rep,l.rep>=x.rep?'ok':'ko']);d.ex.push(e)});scheduleSave();tReset();S.tab='diario';render()},
  rtGo(){T.phase='work';T.ph0=clk();T.lastSec=null;beepLong();updateRun()},
  rtEnd(){T.phase='rest';T.ph0=clk();T.pend=rtDefault();T.lastSec=null;T.warned=false;T.halfDone=false;beepShort();updateRun()},
  rRep(el){T.pend=Math.max(0,(T.pend||0)+Number(el.dataset.d));updateRun()},
  rtNextB(){rtNext(clk())},
  rtSave(){const d=ensureDraft(),c=T.cfg,e=exFromHistory(c.n||'Esercizio',d.d,d.id);delete e._why;delete e.lad;e.p=`RT ${c.target} rip.`;e.b=null;e.k=0;e.s=T.sets.map(r=>[r,'ok']);e.t=Math.max(1,Math.round((T.workEnd??T.endClock)/60000));d.ex.push(e);scheduleSave();tReset();S.tab='diario';render()},
  eDone(){if(clk()<T.leadMs)return;const k=EK[T.zone*2+T.cur];
    if(T.zr){if(T.zrLogged)return;T.log.push({k,rep:T.adj});T.zrLogged=true;beepShort();updateRun();return}
    if(T.final){if(T.finalLogged)return;T.log.push({k,rep:T.adj});T.finalLogged=true;beepShort();updateRun();return}
    T.log.push({k,rep:T.adj});T.cur=1-T.cur;T.adj=T.cfg[EK[T.zone*2+T.cur]].rep;beepShort();updateRun()},
  edtSkipZ(){if(T&&T.zr)T.zr0=clk()-T.cfg.restZ*60000},
};
const canSave=()=>!!S.downloads||STANDALONE;
async function saveFile(filename,data){
  if(S.downloads){try{await S.downloads.save({filename,data})}catch(e){}return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:filename.endsWith('.json')?'application/json':'text/csv'}));
  a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
}
async function importBackup(obj){
  if(!obj||obj.app!=='diario-allenamento'||!Array.isArray(obj.sedute))throw new Error('formato');
  const cur=new Map(S.stor);for(const [id,x] of S.sed)cur.set(id,x);
  const base=[],upd=[];
  for(const x of obj.sedute){
    if(!x||typeof x.id!=='string')continue;
    if(!x.deleted&&(!x.d||!Array.isArray(x.ex)))continue;
    const c=cur.get(x.id);if(c&&(c.updated||0)>=(x.updated||0))continue;
    (x.updated||x.deleted?upd:base).push(x);
  }
  if(S.mode==='db'){for(const x of [...base,...upd])await S.base.collection('sedute').doc(x.id).set(x)}
  else{
    const st=new Map(S.stor);base.forEach(x=>st.set(x.id,x));/* riscrive sempre tutto, anche se non c’è nulla di nuovo */
    const sd=new Map(S.sed);upd.forEach(x=>sd.set(x.id,x));const m={};sd.forEach((v,k)=>m[k]=v);
    if(!store('diario-storico',[...st.values()])||!store('diario-sedute',m))throw new Error('spazio');
    S.stor=st;S.sed=sd;
  }
  let cfg=false;
  if(obj.cfg){const c=obj.cfg;
    if(c.esercizi)for(const k in c.esercizi)if(!S.cfg.esercizi[k]){S.cfg.esercizi[k]=c.esercizi[k];cfg=true}
    if(c.timer&&!S.cfg.timer){S.cfg.timer=c.timer;S.prefsLoaded=false;loadPrefs();cfg=true}
    if(Array.isArray(c.woRen)&&c.woRen.length>(S.cfg.woRen||[]).length){S.cfg.woRen=clone(c.woRen);cfg=true}
    if(c.profilo&&!S.cfg.profilo){S.cfg.profilo=clone(c.profilo);cfg=true}
    if(cfg)saveCfg();
  }
  let nt=0;
  for(const t of Array.isArray(obj.test)?obj.test:[]){if(!t||typeof t.id!=='string')continue;const c=S.tests.get(t.id);
    if(!c||(t.updated||0)>(c.updated||0)){S.tests.set(t.id,t);nt++;if(S.mode==='db')await saveTestDoc(t)}}
  if(nt&&S.mode!=='db')await saveTestDoc({});
  let np=0;
  for(const P of Array.isArray(obj.protocolli)?obj.protocolli:[]){if(!P||typeof P.id!=='string')continue;const c=S.protos.get(P.id);
    if(!c||(P.updated||0)>(c.updated||0)){S.protos.set(P.id,P);np++;if(S.mode==='db')await saveProtoDoc(P)}}
  if(np&&S.mode!=='db')await saveProtoDoc({});
  let nm=0;
  for(const m of Array.isArray(obj.misure)?obj.misure:[]){if(!m||typeof m.id!=='string')continue;const c=S.misure.get(m.id);
    if(!c||(m.updated||0)>(c.updated||0)){S.misure.set(m.id,m);nm++;if(S.mode==='db')await saveMisDoc(m)}}
  if(nm&&S.mode!=='db')await saveMisDoc({});
  merge();if(!nt)ensureDefaults();return {n:base.length+upd.length,cfg,nt,nm};
}
async function delSession(id){
  try{
    if(S.mode==='db'){S.sed.set(id,{id,deleted:true});merge();await S.base.collection('sedute').doc(id).set({id,deleted:true,updated:Date.now()})}
    else{const all=load('diario-sedute')||{};all[id]={id,deleted:true};store('diario-sedute',all);S.sed.set(id,{id,deleted:true});merge()}
  }catch(e){}
}
