<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diario di allenamento – prova</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1D2830">
<link rel="icon" href="icon-192-v2.png">
<link rel="apple-touch-icon" href="icon-192-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#E8EBE6; --surface:#F6F7F4; --raise:#FFFFFF; --ink:#1D2830; --muted:#5C6970; --line:#C9D0C8;
  --accent:#1D2830; --on-accent:#F6F7F4;
  --ok:#92D050; --fat:#FFC000; --ko:#E3342F; --skip:#0070C0; --on-ok:#1D2830; --on-ko:#FFFFFF;
  --rest:#DCE6E2; --warn:#FFC000;
  --f-text:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141B20; --surface:#1C252B; --raise:#243037; --ink:#E4EAE5; --muted:#9AA7AE; --line:#34434C;
    --accent:#E4EAE5; --on-accent:#141B20; --rest:#1F3330;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141B20; --surface:#1C252B; --raise:#243037; --ink:#E4EAE5; --muted:#9AA7AE; --line:#34434C;
  --accent:#E4EAE5; --on-accent:#141B20; --rest:#1F3330;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-text);min-height:100%;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--skip);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1,h2,h3{font-family:var(--f-num);font-weight:700;letter-spacing:.01em;margin:0;line-height:1.1}
h1{font-size:32px}
h2{font-size:24px}
h3{font-size:20px}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* barra superiore */
.top{display:flex;align-items:baseline;gap:12px;margin:4px 0 16px}
.top .save{margin-left:auto;font-size:14px;color:var(--muted)}
.banner{background:var(--raise);border-left:4px solid var(--fat);padding:10px 12px;margin:0 0 16px;font-size:14px}

/* tab in basso */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;max-width:200px;background:none;border:0;padding:7px 2px 8px;font-family:var(--f-num);font-size:15px;font-weight:600;color:var(--muted);border-top:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:25px;height:25px}
.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--ink)}
.minitimer{position:fixed;left:0;right:0;z-index:19;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.minitimer[hidden]{display:none}
.minitimer button{pointer-events:auto;background:var(--accent);color:var(--on-accent);border:0;border-radius:20px;padding:6px 16px;font-family:var(--f-num);font-size:18px;font-weight:600;margin-bottom:8px}

/* campi */
label.f{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0;color:var(--ink);font-size:16px}
textarea{resize:vertical;min-height:44px}
input[type=number]{font-family:var(--f-num);font-size:19px;font-weight:600}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:6px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.big{font-family:var(--f-num);font-size:22px;padding:12px 22px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--ko)}
.btn:disabled{opacity:.45;cursor:default}

/* seduta */
.sess-head{display:grid;grid-template-columns:1fr 90px;gap:10px;margin-bottom:6px}
.sess-meta{font-family:var(--f-num);font-size:18px;color:var(--muted);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin:0 0 14px}
.card-h{display:flex;gap:8px;align-items:center}
.card-h input{font-family:var(--f-num);font-size:22px;font-weight:700;border-color:transparent;background:transparent;padding:4px 6px}
.card-h input:hover,.card-h input:focus{border-color:var(--line);background:var(--raise)}
.sugg{font-size:14px;color:var(--muted);margin:2px 6px 10px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.grid .wide{grid-column:span 4}
.grid label.f{justify-content:flex-end}
@media (min-width:600px){.grid{grid-template-columns:repeat(8,minmax(0,1fr))}.grid .wide{grid-column:span 4}}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.chip{width:52px;height:56px;border-radius:6px;border:2px solid var(--line);background:var(--raise);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1}
.chip b{font-family:var(--f-num);font-size:26px;font-weight:700}
.chip small{font-size:11px;margin-top:2px;opacity:.8}
.chip.e-{color:var(--muted);border-style:dashed}
.chip.e-ok{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.chip.e-fat{background:var(--fat);border-color:var(--fat);color:var(--on-ok)}
.chip.e-ko{background:var(--ko);border-color:var(--ko);color:var(--on-ko)}
.chip.e-skip{background:var(--skip);border-color:var(--skip);color:var(--on-ko)}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 12px;margin:12px 0 4px;padding-top:10px;border-top:1px solid var(--line)}
@media (min-width:600px){.metrics{grid-template-columns:repeat(5,minmax(0,1fr))}}
.metrics div{display:flex;flex-direction:column}
.metrics span{font-size:12px;color:var(--muted)}
.metrics b{font-family:var(--f-num);font-size:20px;font-weight:600}
.card-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.prog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;padding:10px;background:var(--raise);border-radius:6px}
.prog p{grid-column:1/-1;margin:0;font-size:13px;color:var(--muted)}
.add{display:flex;gap:8px;margin:6px 0 18px}

/* nuova seduta */
.tpl{display:flex;flex-direction:column;gap:8px;margin:14px 0 22px}
.tpl>button,.tplrow>button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:56px 1fr;gap:2px 12px;align-items:center}
.tpl .wo{grid-row:span 2;font-family:var(--f-num);font-size:34px;font-weight:700;text-align:center;line-height:1}
.tpl .when{font-size:14px;color:var(--muted)}
.tpl .what{font-weight:600}

/* storico */
.week{margin:0 0 18px}
.week-h{display:flex;align-items:baseline;gap:10px;padding:0 2px 6px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.week-h{flex-wrap:wrap}
.week-h h3{font-size:20px;white-space:nowrap}
.week-h span{font-size:14px;color:var(--muted)}
.sess{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:0 0 8px}
.sess > button{all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;padding:10px 12px}
.sess > button:focus-visible{outline:3px solid var(--skip)}
.sess-t{display:flex;gap:10px;align-items:baseline;margin-bottom:4px}
.sess-t b{font-family:var(--f-num);font-size:19px}
.sess-t .wo{font-family:var(--f-num);font-weight:700;font-size:19px;background:var(--ink);color:var(--bg);border-radius:4px;padding:0 6px}
.exl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;font-size:15px}
.exl .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:flex;gap:2px}
.mini i{width:10px;height:14px;border-radius:2px;background:var(--line)}
.mini i.e-ok{background:var(--ok)}.mini i.e-fat{background:var(--fat)}.mini i.e-ko{background:var(--ko)}.mini i.e-skip{background:var(--skip)}
.sess-d{padding:0 12px 12px;border-top:1px solid var(--line)}
.sess-d .ex{padding:10px 0;border-bottom:1px dashed var(--line)}
.exser{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.exser span{min-width:42px;text-align:center;border-radius:6px;padding:4px 6px;font-family:var(--f-num);font-weight:700;font-size:16px;background:var(--line);color:var(--ink)}
.exser span small{display:block;font-family:var(--f-text);font-weight:400;font-size:10px}
.exser .e-ok{background:var(--ok);color:var(--on-ok)}.exser .e-fat{background:var(--fat);color:#111}.exser .e-ko{background:var(--ko);color:var(--on-ko)}.exser .e-skip{background:var(--skip);color:#fff}
.exfull{margin:10px 0 0}.exfull .sess{margin:0}
.sess-d .ex:last-of-type{border-bottom:0}
.sess-d p{margin:4px 0;font-size:14px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;margin:0 0 14px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}

/* timer */
.seg{display:flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin:0 0 18px}
.seg button{flex:1;background:none;border:0;padding:10px 6px;font-family:var(--f-num);font-size:20px;font-weight:600;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.sm{border-width:1px;margin:0}
.seg.sm button{font-size:17px;padding:7px 4px}
.tcfg{display:flex;flex-direction:column;gap:14px}
.tcfg .lead{margin:0;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--raise);width:max-content}
.stepper button{background:none;border:0;width:48px;height:48px;font-size:24px;font-weight:600}
.stepper output{min-width:56px;text-align:center;font-family:var(--f-num);font-size:26px;font-weight:700}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.swatches input[type=color]{width:42px;height:34px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--raise)}
.emx{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.exrow{display:grid;grid-template-columns:minmax(0,1fr) 72px 84px;gap:8px;align-items:end}
.run{border-radius:12px;padding:20px 16px 22px;text-align:center;background:var(--accent);color:var(--on-accent);transition:background .25s}
.run.rest{background:var(--rest);color:var(--ink)}
.run.flash{background:var(--warn);color:#1D2830}
.run.done{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.run .ph{font-family:var(--f-num);font-size:22px;font-weight:600;margin:0}
.run .ex-now{font-family:var(--f-num);font-size:clamp(30px,8vw,46px);font-weight:700;margin:6px 0 0;line-height:1.05}
.run .clock{font-family:var(--f-num);font-weight:700;font-size:clamp(96px,30vw,210px);line-height:.95;font-variant-numeric:tabular-nums;margin:6px 0}
.run .sub{font-size:17px;margin:0;opacity:.85}
.run .ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.run .btn{background:transparent;color:inherit;border-color:currentColor}
.run .btn.primary{background:var(--pfg,var(--on-accent));color:var(--pbg,var(--accent));border-color:var(--pfg,var(--on-accent))}
.run.rest .btn.primary,.run.done .btn.primary,.run.flash .btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.repadj{display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0 4px}
.repadj button{width:64px;height:64px;border-radius:50%;border:2px solid currentColor;background:transparent;color:inherit;font-size:32px;font-weight:600}
.repadj output{font-family:var(--f-num);font-size:64px;font-weight:700;min-width:80px}
.esito{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px auto 0;max-width:420px}
.esito button{border:0;border-radius:6px;padding:12px 6px;font-weight:600}
.esito button{border:2px solid rgba(255,255,255,.75)}
.esito button[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink),0 0 0 7px #fff;font-weight:800;border-color:#fff}
.esito button[aria-pressed="false"]{opacity:.35;filter:saturate(.4)}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;text-align:left}
.tot div{background:rgba(127,127,127,.14);border-radius:6px;padding:8px 10px}
.tot b{font-family:var(--f-num);font-size:24px;display:block}
.sumlist{text-align:left;margin:12px auto 0;max-width:420px;font-size:15px}

/* foglio in basso */
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,18,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:14px 14px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:calc(100dvh - 12px);max-height:calc(100vh - 12px);overflow-y:auto;overscroll-behavior:contain}
@supports (height:100dvh){.sheet{max-height:calc(100dvh - 12px)}}
.sheet h3{margin-bottom:4px}
.sheet .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.sheet .opts button{border:0;border-radius:8px;padding:14px 10px;font-weight:600;font-size:16px}
.o-ok{background:var(--ok);color:var(--on-ok)}.o-fat{background:var(--fat);color:var(--on-ok)}.o-ko{background:var(--ko);color:var(--on-ko)}.o-skip{background:var(--skip);color:var(--on-ko)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
body.lock{overflow:hidden}
.run.full{position:fixed;inset:0;z-index:30;border-radius:0;margin:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "main" "side";gap:clamp(4px,1.2vh,14px);padding:calc(env(safe-area-inset-top,0px) + clamp(6px,1.5vh,14px)) clamp(10px,3vw,28px) calc(env(safe-area-inset-bottom,0px) + clamp(8px,2vh,18px));overflow:hidden}
.r-top{grid-area:top;display:flex;align-items:center;gap:10px;font-family:var(--f-num);font-size:clamp(15px,min(3.8vw,2.6vh),24px);font-weight:600}
.r-top .r-title{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-top .r-ses{white-space:nowrap;opacity:.9}
.r-top .fsb{background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:6px;width:clamp(32px,5vh,42px);height:clamp(32px,5vh,42px);font-size:clamp(14px,2.4vh,20px);padding:0;flex:none}
.r-main{grid-area:main;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:clamp(2px,.8vh,8px)}
.r-side{grid-area:side;display:flex;flex-direction:column;justify-content:center;gap:clamp(6px,1.4vh,14px);min-height:0}
.run.full .ph{font-size:clamp(16px,min(4.4vw,3.2vh),30px)}
.run.full .giro{font-family:var(--f-num);font-weight:700;font-size:clamp(34px,min(12vw,8.5vh),110px);line-height:1;margin:0;font-variant-numeric:tabular-nums}
.run.full .ex-now{font-size:clamp(20px,min(6.5vw,5vh),56px);margin:0}
.run.full .clock{font-size:clamp(48px,min(25vw,24vh),320px);margin:0;white-space:nowrap}
.run.full .sub{font-size:clamp(13px,min(3.8vw,2.5vh),22px);margin:0}
.run.full .ctl{margin:0;gap:clamp(6px,1.2vw,12px)}
.run.full .btn{font-size:clamp(14px,min(3.8vw,2.4vh),20px);padding:clamp(6px,1.1vh,12px) clamp(10px,2.2vw,20px)}
.run.full .btn.big{font-size:clamp(18px,min(5.2vw,3.4vh),30px);padding:clamp(8px,1.6vh,16px) clamp(16px,3vw,30px)}
.run.full .repadj{margin:0;gap:clamp(10px,3vw,22px)}
.run.full .repadj button{width:clamp(40px,min(12vw,7vh),76px);height:clamp(40px,min(12vw,7vh),76px);font-size:clamp(22px,4vh,34px)}
.run.full .repadj output{font-size:clamp(30px,min(11vw,7vh),76px);min-width:2ch}
.run.full .esito{margin:0 auto;width:100%}
.run.full .esito button{padding:clamp(6px,1.3vh,14px) 4px;font-size:clamp(13px,min(3.6vw,2.2vh),18px)}
.run.full .tot{margin:0;gap:clamp(6px,1vw,10px)}
.run.full .tot div{padding:clamp(4px,.8vh,8px) 10px;font-size:clamp(12px,1.8vh,16px)}
.run.full .tot b{font-size:clamp(16px,2.8vh,26px)}
.run:not(.full) .msub{margin-top:14px}
/* timer: dati più grandi e pulsanti facili da toccare */
.run.full .r-top{font-size:clamp(18px,min(4.8vw,3.4vh),34px)}
.run.full .r-top .r-ses{font-size:clamp(15px,min(3.8vw,2.6vh),24px);font-weight:600}
.run.full .ph{font-size:clamp(18px,min(5.6vw,4vh),42px)}
.run.full .giro{font-size:clamp(40px,min(16vw,10vh),150px)}
.run.full .ex-now{font-size:clamp(24px,min(8vw,6vh),76px)}
.run.full .clock{font-size:clamp(52px,min(27vw,25vh),340px)}
.run.full .sub{font-size:clamp(16px,min(5vw,3.2vh),32px)}
.run.full .btn{font-size:clamp(16px,min(4.6vw,2.9vh),28px);min-height:clamp(44px,7vh,84px);border-width:2px;line-height:1.15}
.run.full .btn.big,.run.full .r-side .btn.primary{font-size:clamp(20px,min(6.2vw,4vh),42px);min-height:clamp(52px,9.5vh,110px);width:100%}
.run.full .ctl2{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));width:100%}
.run.full .ctl2 .btn{padding-left:6px;padding-right:6px}
.run.full .repadj button{width:clamp(52px,min(18vw,10.5vh),116px);height:clamp(52px,min(18vw,10.5vh),116px);font-size:clamp(28px,6vh,56px);border-width:3px}
.run.full .repadj output{font-size:clamp(40px,min(15vw,9.5vh),110px)}
.run.full .esito{gap:clamp(6px,1.4vw,14px);max-width:none}
.run.full .esito button{min-height:clamp(48px,8.5vh,96px);font-size:clamp(15px,min(4.4vw,2.9vh),28px);padding:4px}
.run.full .tot div{font-size:clamp(14px,2.2vh,22px)}
.run.full .tot b{font-size:clamp(20px,3.8vh,40px)}
@media (orientation:landscape){
  .run.full .clock{font-size:clamp(48px,min(16.5vw,40vh),340px)}
  .run.full .giro{font-size:clamp(36px,min(9vw,12vh),150px)}
  .run.full .ex-now{font-size:clamp(22px,min(5vw,7vh),76px)}
}
@media (orientation:landscape){

const rng=(a,b,ps)=>{const lo=Math.min(a,b),hi=Math.max(a,b),o=[];for(let r=lo;r<=hi&&o.length<40;r+=ps)o.push(r);return o};
function ladWaves(P){
  const ps=Math.max(1,num(P.passo)||1),up=rng(Math.max(1,num(P.da)||1),Math.max(1,num(P.a)||5),ps);
  if(P.verso==='onda'){const k=P.ondaK||'gradini';
    if(k==='pers'){const q=String(P.seq||'').split(/[^0-9]+/).map(Number).filter(x=>x>0).slice(0,40);return [q.length?q:up]}
    if(k==='alt'){const lo=rng(Math.max(1,num(P.loDa)||1),Math.max(1,num(P.loA)||3),ps),hi=rng(Math.max(1,num(P.hiDa)||5),Math.max(1,num(P.hiA)||6),ps),o=[];
      for(let i=0;i<Math.max(lo.length,hi.length);i++){if(lo[i]!=null)o.push(lo[i]);if(hi[i]!=null)o.push(hi[i])}return [o]}
    const L=Math.max(2,num(P.lung)||3),sh=Math.max(1,num(P.sposta)||1),lo=up[0],hi=up[up.length-1],w=[];
    for(let st=lo;st+(L-1)*ps<=hi&&w.length<12;st+=sh){const x=[];for(let q=0;q<L;q++)x.push(st+q*ps);w.push(x)}return w.length?w:[up]}
  if(P.verso==='giu')return [[...up].reverse()];
  if(P.verso==='sugiu'||P.verso==='ar'){const top2=P.verso==='ar'||!!P.top2,pg=Math.max(1,num(P.passoGiu)||ps),lo=up[0],top=up[up.length-1],dn=[];for(let r=top2?top:top-pg;r>=lo&&dn.length<40;r-=pg)dn.push(r);return [[...up,...dn]]}
  return [up];
}
const LADV=[['su','In salita'],['giu','In discesa'],['sugiu','Su e giù'],['onda','A onda']];

function ladList(P){const one=ladWaves(P).flat(),out=[];for(let i=0;i<Math.max(1,num(P.volte)||1);i++)out.push(...one);return out.slice(0,80)}
function ladKind(P){if(P.verso==='onda'){const k=P.ondaK||'gradini';return k==='alt'?'a onda alternata':k==='pers'?'personalizzata':'a onda'}if(P.verso==='sugiu'||P.verso==='ar')return (P.verso==='ar'||P.top2)?'su e giù, vertice ripetuto':'su e giù';return P.verso==='giu'?'in discesa':'in salita'}
function ladDesc(P){const w=ladWaves(P);return w.map(x=>x.join('-')).join(' / ')}
const restTxt=r=>num(r)>0?`Rest ${num(r)}″`:'recupero libero';
function pAuto(P){
  if(P.tipo==='st')return `ST ${P.serie||'?'}x${P.rep||'?'}, ${restTxt(P.rest)}`;
  if(P.tipo==='ladder'){const k=ladKind(P);return `Ladder${k==='in salita'?'':' '+k} ${ladDesc(P)}${num(P.volte)>1?` x${P.volte}`:''}, ${P.restMode==='mult'?`Rest ×${String(num(P.mult)||2).replace('.',',')}`:P.restMode==='free'?'recupero libero':restTxt(P.rest)}`}
  if(P.tipo==='rt')return `RT ${P.target||'?'} rip.${P.rep?` (serie da ${P.rep})`:''}, ${restTxt(P.rest)}`;
  if(P.tipo==='amrap')return `AMRAP ${P.min}′${P.rep?` x ${P.rep}`:''}`;
  if(P.tipo==='emom'&&emK(P)>1&&P.slots)return `${emomName(emK(P))} ${P.giriMax?'MAX':P.giri} giri: ${P.slots.slice(0,emK(P)).map(x=>`${x.sec}″${x.rep?` x ${x.rep}`:''}`).join(' / ')}${num(P.restGiro)>0?` + riposo ${P.restGiro}″`:''}`;
  if(P.tipo==='circ'&&Array.isArray(P.stations)&&P.stations.length)return `Circuito ${P.giri} giri: ${P.stations.map(x=>x.work==='rep'?`${x.val} rep`:`${x.val}″`).join(' / ')}, pausa ${P.restEx}″, riposo ${P.restGiroC}″`;
  if(P.tipo==='hst'){const ph=P.fase==='neg'?'5 negative':`${P.fase||10} rip.`;return `HST fase ${ph}, ${P.serie||2}x${P.fase==='neg'?5:(P.fase||10)}, ${restTxt(P.rest)}`}
  if(P.tipo==='gvt')return `GVT ${P.serie||10}x${P.rep||10}${P.group==='super'?' alternato':''}, ${restTxt(P.rest)}`;
  if(P.tipo==='btc')return `Beat the clock, limite ${num(P.cap)||12}′`;
  if(P.tipo==='rpm')return `${Math.min(3,Math.max(1,Math.round(num(P.rep)||1)))} rep ${num(P.sec)&&num(P.sec)!==60?`ogni ${num(P.sec)}″`:'al minuto'} x ${num(P.giri)||10}`;
  const r=P.rep?`x${P.rep}`:'';
  if(P.tipo==='emom')return `EMOM ${P.giriMax||/max/i.test(String(P.giri))?'MAX ':P.giri+'x'}${P.sec}″${P.rep?` x ${P.rep}`:''}${num(P.restGiro)>0?` + riposo ${P.restGiro}″`:''}`;
  if(P.tipo==='edt')return `EDT ${P.min}′${P.rep?` x ${P.rep}`:''}`;
  if(P.tipo==='circ')return `Circuito ${P.giri} giri, ${P.work==='rep'?`${P.val} rep`:`${P.val}″`}, pausa ${P.restEx}″, riposo ${P.restGiroC}″`;
  if(P.tipo==='max')return `Max rip., riposo ${P.rest}″`;
  if(P.tipo==='ft')return 'Per tempo';
  return `${P.group==='super'?'Superset':'Set&Pause'} ${P.serie||'?'}${r} ${P.restMode==='mult'?`Rest ×${P.mult}`:`Rest ${P.rest}″`}`;
}

function protoFromText(text,nsets){
  const q=parseProto(text),t=String(text||'');let m;
  if(q&&q.type==='emom'){const r=(m=t.replace(/[″“”]/g,'"').match(/"\s*x\s*(\d+(?:\s*-\s*\d+)?)/i))?m[1].replace(/\s/g,''):'';
    return {tipo:'emom',giri:q.giri||nsets||10,sec:q.sec,rep:r,group:/\+/.test(t)?'super':'single',restGiro:0}}
  if(q&&q.type==='edt')return {tipo:'edt',min:q.min,rep:'',restZ:5};
  if(q&&q.type==='rest'){let serie=nsets||null,r='';
    if(m=t.match(/^\s*(\d+)\s*x\s*(\d+(?:-\d+)?)/i)){serie=+m[1];r=m[2]}else if(m=t.match(/^\s*(\d+-\d+)\s*x\s*(\d+)/i)){r=m[1];serie=+m[2]}
    const rest=t.replace(/\+\s*(\d+\s*["″']*\s*)?(calf\s*\+\s*)?(rest|pausa).*$/i,'');
    return {tipo:'sp',serie,rep:r,rest:q.sec,restMode:'fix',mult:2,group:/\+\s*[a-z]/i.test(rest)?'super':'single',tr:0}}
  return null;
}
function ensureProtos(force){
  if(!S.protosLoaded||!S.hist.length)return 0;if(!force&&S.protos.size)return 0;
  const lim=isoMinus(S.hist[0].d,120),seen=new Map();let n=0;
  for(const s of S.hist){if(s.d<lim)break;for(const e of s.ex){if(!e.p)continue;const P=protoFromText(e.p,(e.s||[]).length);if(!P)continue;
    const key=pAuto(P);if(seen.has(key)){const o=seen.get(key);if(!o.src.includes(e.p))o.src.push(e.p);continue}
    if(protoList().some(x=>pAuto(x)===key))continue;
    const o={...P,id:'p'+Date.now().toString(36)+(n++),nome:'',src:[e.p],updated:Date.now()};seen.set(key,o)}}
  seen.forEach(o=>{S.protos.set(o.id,o);saveProtoDoc(o)});
  return seen.size;
}

  else if((P.tipo==='sp'||P.tipo==='st')&&num(P.serie)>0){if(P.tipo==='st'&&num(P.rep)>0){e.b=num(P.rep);e.k=0}setN(e,num(P.serie))}

  else if(P.tipo==='max'){e.b=null;e.k=0;setN(e,1)}
  else if(P.tipo==='hst'||P.tipo==='gvt'){const r=num(P.tipo==='hst'?(P.fase==='neg'?5:(P.fase||10)):P.rep);if(r>0){e.b=r;e.k=0}setN(e,num(P.serie)||(P.tipo==='gvt'?10:2))}

}

function ladPrev(f){const l=ladList(f);return `Serie: ${ladWaves(f).map(x=>x.join(' · ')).join('  |  ')}${num(f.volte)>1?` (x${f.volte})`:''}, in tutto ${l.length} serie e ${l.reduce((x,y)=>x+y,0)} ripetizioni`}
function repsAtPct(pc){if(pc>=1)return 1;let best=30,d=9;for(let r=1;r<=30;r+=.5){const q=pctOfReps(r);if(q&&Math.abs(q-pc)<d){d=Math.abs(q-pc);best=r}}return Math.round(best)}
function ladSuggest(f){
  const src=f.sugSrc||'test',vol=Number(f.sugVol)||2.5;let R=null,txt='';
  if(src==='rm'){const rm=num(f.sugRm),kg=num(f.sugKg);if(!(rm>0)||!(kg>0))return {err:'Indica il 1RM e il carico che userai.'};const pc=kg/rm;R=repsAtPct(pc);txt=`1RM ${fmtN(rm,1)} kg: con ${fmtN(kg,kg%1?1:0)} kg (${fmtN(pc*100)}%) fai circa ${R} ripetizioni massime.`}
  else if(src==='rep'){R=num(f.sugRep);if(!(R>0))return {err:'Indica le massime ripetizioni.'};txt=`${R} ripetizioni massime.`}
  else{const n=String(f.sugN||'').trim();if(!n)return {err:'Indica l’esercizio.'};
    const mr=[...S.tests.values()].filter(t=>!t.deleted&&t.n===n&&t.tipo==='maxrep').sort((a,b)=>a.d<b.d?1:-1)[0],t1=maxFor(n,todayIso());let load=num(f.sugKg);
    if(!(load>0)&&!mr&&t1){for(const s of S.hist){const e=s.ex.find(x=>x.n===n&&Number(x.kg)>0);if(e){load=Number(e.kg);break}}}
    if(load>0&&t1){const pc=load/t1.rm;R=repsAtPct(pc);txt=`Massimale ${fmtN(t1.rm,1)} kg: con ${fmtN(load,load%1?1:0)} kg (${fmtN(pc*100)}%) fai circa ${R} ripetizioni massime.`}
    else if(mr){R=num(mr.rep);txt=`Test del ${fmtD(mr.d)}: ${R} ripetizioni massime a corpo libero.`}
    if(!R)return {err:`Per ${esc(n)} non trovo né un massimale né un test di massime ripetizioni: registrane uno nella sezione Test, oppure scegli «Da un 1RM» o «Da massime ripetizioni».`}}
  if(R<4)return {err:`${txt} Con meno di 4 ripetizioni massime la ladder non ha senso: scegli un carico più leggero.`};
  const goal=vol*R,sum=P=>ladList(P).reduce((x,y)=>x+y,0),base={tipo:'ladder',passo:1,lung:3,sposta:1,rest:60,top2:'',ondaK:'gradini'};
  const pick=(cands,tgt)=>{let bp=null,bs=1e9;for(const P of cands){const l=ladList(P);if(l.length>=80)continue;const top=Math.max(...l),sc=Math.abs(sum(P)-goal)/R+.8*Math.abs(top/R-tgt);if(sc<bs){bs=sc;bp=P}}return bp};
  const tops=(lo,hi)=>{const o=[];for(let t=Math.max(2,Math.round(R*lo));t<=Math.max(2,Math.round(R*hi));t++)o.push(t);return o};
  const V=n=>Array.from({length:n},(_,i)=>i+1);
  const C=[];
  C.push(pick(tops(.35,.65).flatMap(t=>V(12).map(v=>({...base,verso:'su',da:1,a:t,volte:v}))),.5));
  C.push(pick(tops(.35,.6).flatMap(t=>V(10).map(v=>({...base,verso:'sugiu',da:1,a:t,volte:v}))),.45));
  C.push(pick(tops(.3,.55).flatMap(t=>V(10).map(v=>({...base,verso:'sugiu',top2:'1',da:1,a:t,volte:v}))),.4));
  C.push(pick(tops(.4,.7).flatMap(t=>V(8).flatMap(nw=>V(4).map(v=>({...base,verso:'onda',ondaK:'gradini',da:Math.max(1,t-2-(nw-1)),a:t,volte:v})))),.55));
  C.push(pick(tops(.45,.7).flatMap(t=>[3,4,5].flatMap(L=>V(6).map(v=>({...base,verso:'onda',ondaK:'alt',loDa:1,loA:L,hiDa:Math.max(L+1,t-(L-2)),hiA:t,volte:v})))),.6));
  return {R,vol,src:txt,list:C.filter(Boolean).map(P=>{const l=ladList(P);return {P,tot:l.reduce((x,y)=>x+y,0),top:Math.max(...l),sets:l.length}})};
}
function vLadSug(g){
  if(g.err)return `<p class="muted small" style="margin:8px 0 0">${g.err}</p>`;
  return `<p class="small" style="margin:8px 0 4px">${g.src} Volume cercato: ${fmtN(g.vol,1)} volte, cioè circa ${Math.round(g.vol*g.R)} ripetizioni.</p><p class="muted small" style="margin:0 0 6px">Il gradino più alto resta intorno al 40–70% delle massime, per allenarti lontano dal cedimento.</p>
    ${g.list.map((x,i)=>`<div class="trow"><div><b>${ladKind(x.P).replace(/^./,c=>c.toUpperCase())}</b>: ${ladDesc(x.P)}${x.P.volte>1?` x${x.P.volte}`:''}
      <div class="muted small">${x.sets} serie, ${x.tot} ripetizioni (${fmtN(x.tot/g.R,1)} volte le massime), gradino più alto ${x.top} = ${fmtN(x.top/g.R*100)}%</div></div>
      <div class="acts"><button class="btn" data-a="ladUse" data-i="${i}">Usa questa</button></div></div>`).join('')}`;
}

/* ----- squadra ----- */
const teamOk=()=>S.mode==='db'&&!!S.db&&!!S.uid&&PID==='main';
const teamCodes=()=>(S.cfg&&S.cfg.team&&S.cfg.team.codes)||[];
const teamShare=()=>!(S.cfg&&S.cfg.team&&S.cfg.team.share===false);
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<6;i++)c+=a[Math.floor(Math.random()*a.length)];return c}
function teamSummary(){
  const from=isoMinus(todayIso(),365),info=new Map();
  for(const s of S.hist){if(s.d<from)break;for(const e of s.ex){if(!e.n||e.st==='Non eseguito')continue;info.set(e.n,(info.get(e.n)||0)+1)}}
  const names=[...info.entries()].sort((a,b)=>b[1]-a[1]).slice(0,25).map(x=>x[0]),ex={};
  const r=(x,d)=>x==null?null:Math.round(x*d)/d;
  names.forEach(n=>{const sr=exSeries(n,from).slice(-60);const t=maxFor(n,todayIso());ex[n]={p:sr.map(x=>[x.d,r(x.e1,10),r(x.dens,100),r(x.pi,10),r(x.vol,100),r(x.ton,1)]),rm:t?t.rm:null}});
  const weeks=[];let mo=mondayOf(todayIso());for(let i=0;i<12;i++){const nx=isoMinus(mo,-7);weeks.push([mo,S.hist.filter(s=>s.d>=mo&&s.d<nx).length]);mo=isoMinus(mo,7)}
  return {v:1,squadre:teamCodes(),upd:Date.now(),ex,weeks:weeks.reverse()};
}
let teamPubT=null;
function teamPublishSoon(){if(!teamOk()||!teamCodes().length)return;clearTimeout(teamPubT);teamPubT=setTimeout(()=>teamPublish(false),8000)}
async function teamPublish(force){
  if(!teamOk())return;
  try{
    if(!teamCodes().length||!teamShare()){if(S.teamPubbed||force){await S.db.doc('membri/'+S.uid).delete();S.teamPubbed=false;S.teamLastKey=''}return}
    const sm=teamSummary(),key=JSON.stringify({...sm,upd:0});if(!force&&key===S.teamLastKey)return;
    await S.db.doc('membri/'+S.uid).set(sm);S.teamLastKey=key;S.teamPubbed=true;S.teamErr='';
  }catch(e){S.teamErr=(e&&e.code)||'errore';if(S.tab==='esercizi'&&S.exView==='team')render()}
}
function teamWatch(code){
  if(S.team.unsub){try{S.team.unsub()}catch(e){}}S.team.unsub=null;S.team.members=new Map();S.team.code=code||null;S.team.mem=null;
  if(!code||!teamOk())return;
  try{S.team.unsub=S.db.collection('membri').where('squadre','array-contains',code).onSnapshot(q=>{S.team.members=new Map(q.docs.map(d=>[d.id,d.data()]));teamNames();if(S.tab==='esercizi'&&S.exView==='team')render()},()=>{})}catch(e){}
  S.db.doc('squadre/'+code).get().then(d=>{S.team.meta[code]=d.exists?d.data():null;if(S.tab==='esercizi'&&S.exView==='team')render()}).catch(()=>{});
}
async function teamNames(){try{const ps=await S.userNS.profiles([...S.team.members.keys()]);S.team.names=ps||{};if(S.tab==='esercizi'&&S.exView==='team')render()}catch(e){}}
const tName=id=>id===S.uid?'Tu':((S.team.names[id]&&S.team.names[id].name)||'Atleta');
const TCOL=['#0284C7','#F97316','#16A34A','#9333EA','#DC2626','#0D9488','#CA8A04','#DB2777','#475569','#65A30D'];
const PMI={e1:1,dens:2,pi:3,vol:4,ton:5};
function memSeries(m,n,from){const x=m.ex&&m.ex[n];if(!x)return [];const k=PMI[S.progM]||1;return x.p.filter(p=>p[0]>=from&&p[k]!=null).map(p=>({d:p[0],v:p[k]}))}
function mChart(title,series,dec){
  const all=series.flatMap(s=>s.pts);if(all.length<2)return '';
  const W=640,H=240,L=52,R=14,T=14,B=30,xs=all.map(p=>isoUTC(p.d)),x0=Math.min(...xs),x1=Math.max(...xs),vs=all.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);const pd=(hi-lo)*.1||1;lo-=pd;hi+=pd;
  const X=t=>L+(W-L-R)*(x1===x0?.5:(t-x0)/(x1-x0)),Y=v=>H-B-(H-T-B)*(v-lo)/(hi-lo);
  return `<div class="chart"><h3>${title}</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">
    ${[0,1,2,3].map(i=>{const v=lo+(hi-lo)*(i+.5)/4;return `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${L-6}" y="${Y(v)+5}" font-size="15" fill="var(--muted)" text-anchor="end">${fmtN(v,dec)}</text>`}).join('')}
    <text x="${L}" y="${H-8}" font-size="15" fill="var(--muted)">${fmtD(new Date(x0).toISOString().slice(0,10))}</text><text x="${W-R}" y="${H-8}" font-size="15" fill="var(--muted)" text-anchor="end">${fmtD(new Date(x1).toISOString().slice(0,10))}</text>
    ${series.map(s=>s.pts.length?`<polyline fill="none" stroke="${s.c}" stroke-width="${s.me?3.4:2.2}" stroke-linejoin="round" points="${s.pts.map(p=>`${X(isoUTC(p.d))},${Y(p.v)}`).join(' ')}"/>`:'').join('')}
    ${series.map(s=>s.pts.map(p=>`<g class="pt" data-tip="${esc(`${s.name}, ${fmtD(p.d)}: ${fmtN(p.v,dec)}`)}"><circle cx="${X(isoUTC(p.d))}" cy="${Y(p.v)}" r="11" fill="transparent"/><circle class="dot" cx="${X(isoUTC(p.d))}" cy="${Y(p.v)}" r="2.6" fill="${s.c}"/></g>`).join('')).join('')}
  </svg><p class="tip muted" aria-live="polite">Tocca un punto per vedere atleta, data e valore.</p><p class="muted small" style="margin:4px 0 0"><b>Orizzontale</b>: la data di ogni seduta. <b>Verticale</b>: ${esc(title.split(':')[0])}. Una linea per atleta.</p><div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.name)}</span>`).join('')}</div></div>`;
}

      <div class="row" style="align-items:flex-end;margin-top:10px"><label class="f" style="flex:1;min-width:180px">Oppure crea una squadra: nome<input type="text" id="tmName" maxlength="40"></label><button class="btn" data-a="teamCreate">Crea</button></div>

  return seg+`<section class="card"><div class="row" style="align-items:flex-start"><div><div class="muted small">Squadra</div><h2 style="margin:0">${esc(meta&&meta.nome||code)}</h2><div class="muted small">Codice <b style="font-family:var(--f-num);font-size:18px;letter-spacing:.08em">${esc(code)}</b> · ${ids.length} ${ids.length===1?'atleta':'atleti'}</div></div><span class="spacer"></span>

function vBoard(ctx){
  const from=periodStart(),mem=[...ctx.members.entries()];
  const cnt=new Map();mem.forEach(([,m])=>Object.keys(m.ex||{}).forEach(n=>cnt.set(n,(cnt.get(n)||0)+1)));

    let up=0,down=0;Object.keys(m.ex||{}).forEach(n=>{const t=trendOf(memSeries(m,n,from).map(p=>p.v));if(t){if(t.pct>1)up++;else if(t.pct<-1)down++}});return {id,m,pts,tr,w4,up,down}})
    .sort((a,b)=>(b.id===ctx.me)-(a.id===ctx.me)||ctx.name(a.id).localeCompare(ctx.name(b.id),'it'));
  const trs=rows.filter(r=>r.tr),avg=trs.length?trs.reduce((a,r)=>a+r.tr.pct,0)/trs.length:null;

  <section class="card"><h3 style="margin-bottom:6px">Atleti</h3>
    <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Atleta</th><th>Sedute (4 sett.)</th><th>Migliorano</th><th>Peggiorano</th><th>Aggiornato</th></tr></thead><tbody>
    ${rows.map(r=>`<tr data-a="boardMem" data-k="${ctx.k}" data-id="${esc(r.id)}" style="cursor:pointer"><td style="font-family:var(--f-text);font-size:16px">${nm(r.id)}</td><td>${r.w4}</td><td class="up">${r.up}</td><td class="down">${r.down}</td><td style="font-size:14px">${r.m.upd?fmtD(new Date(r.m.upd).toISOString().slice(0,10)):'–'}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Ancora nessun dato.</td></tr>'}</tbody></table></div>

      <label class="f" style="min-width:220px">Esercizio<select data-f="bx:${ctx.k}">${exs.map(n=>`<option value="${esc(n)}" ${n===exSel?'selected':''}>${esc(n)} (${cnt.get(n)})</option>`).join('')}</select></label></div>
    ${avg!=null?`<p class="lead2">${M[1]} della squadra: <b class="${trCls(avg)}">${trArr(avg)} ${fmtPct(avg)}</b> in media (${trs.length} ${trs.length===1?'atleta':'atleti'} con abbastanza sedute).</p>`:'<p class="muted">Servono almeno 4 sedute nel periodo per una tendenza.</p>'}
    ${mChart(`${M[1]}${M[2]?` (${M[2]})`:''}: ${esc(exSel)}`,rows.map(r=>({name:ctx.name(r.id),c:ctx.color(r.id),me:r.id===ctx.me,pts:r.pts})),M[3])}

    ${rows.map(r=>{const x=r.m.ex&&r.m.ex[exSel];return `<tr><td style="font-family:var(--f-text);font-size:16px">${nm(r.id)}</td><td>${r.tr?fmtN(r.tr.a,M[3]):'–'}</td><td>${r.tr?fmtN(r.tr.b,M[3]):'–'}</td><td class="${r.tr?trCls(r.tr.pct):''}">${r.tr?`${trArr(r.tr.pct)} ${fmtPct(r.tr.pct)}`:'–'}</td><td>${x&&x.rm?`${fmtN(x.rm,1)} kg`:'–'}</td></tr>`}).join('')}</tbody></table></div></section>`:''}`;

function vBoardMember(ctx,id){

  const rows=Object.keys(m.ex||{}).map(n=>{const pts=memSeries(m,n,from);return {n,pts,tr:trendOf(pts.map(p=>p.v)),last:pts.length?pts[pts.length-1].d:''}}).filter(r=>r.pts.length).sort((a,b)=>a.last<b.last?1:-1);

    <h2 style="margin:0 0 4px"><span class="chipx" style="background:${ctx.color(id)}"></span>${esc(ctx.name(id))}</h2><p class="muted small" style="margin:0 0 10px">Aggiornato il ${m.upd?fmtD(new Date(m.upd).toISOString().slice(0,10)):'–'}; sedute nelle ultime 4 settimane: ${(m.weeks||[]).slice(-4).reduce((a,x)=>a+x[1],0)}</p>
    ${pSeg()}<div class="seg sm" role="group" aria-label="Misura" style="max-width:480px;margin-bottom:12px">${PMET.map(([k,l])=>`<button data-a="setProgM" data-v="${k}" aria-pressed="${S.progM===k}">${l}</button>`).join('')}</div>
    ${rows.map(r=>{const c=r.tr?trCls(r.tr.pct):'flat',x=m.ex[r.n];return `<div class="prow" style="cursor:default">${exIcon(r.n,40)}<span><b>${esc(r.n)}</b><br><span class="muted small">${r.pts.length} sedute${x.rm?`, massimale ${fmtN(x.rm,1)} kg`:''}</span></span>${spark(r.pts.map(p=>p.v),c)}
      <span class="v">${r.tr?fmtN(r.tr.b,M[3]):fmtN(r.pts[r.pts.length-1].v,M[3])}<small class="${c}">${r.tr?`${trArr(r.tr.pct)} ${fmtPct(r.tr.pct)}`:'poche sedute'}</small></span></div>`}).join('')||'<p class="muted">Nessun dato nel periodo scelto.</p>'}`;
}

/* ----- guida ----- */
function vGuida(){
  const sec=(t,b,open)=>`<details${open||(S.guideOpen&&t.startsWith(S.guideOpen))?' open':''}><summary>${t}</summary><div class="gb">${b}</div></details>`;
  const ch=(c,t)=>`<span class="chipx" style="background:${c}"></span>${t}`;
  const tb=(h,rows)=>`<div style="overflow-x:auto"><table class="tbl"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  return `<div class="top"><h1>Guida</h1></div><div class="guide">
  <p class="muted" style="margin:0 0 14px">Come usare l’app e come sono calcolati i numeri. Tocca un titolo per aprirlo. <span class="small">Versione ${APP_VER}</span></p>
  ${window.DIARIO_DEMO&&!load('diario-demo-tolti')?sec('Questa è la versione di prova',`<p>L’app contiene già <b>dati di esempio</b> di circa tre mesi di allenamento, così vedi subito come funziona: sedute nel Diario e nello Storico, grafici in <b>Esercizi → Andamento</b>, massimali e test (anche ILTITO) in <b>Test</b>, peso e misure in <b>Test → Dati biometrici</b>, protocolli in <b>Esercizi → Protocolli</b>.</p>
    <p>Prova pure tutto: modifica, avvia i timer, aggiungi sedute. Quando vuoi iniziare con i tuoi dati, tocca qui sotto: tolgo solo i dati di esempio, quello che hai aggiunto tu resta.</p>
    <button class="btn danger" data-a="demoAsk" style="border:1px solid var(--ko)">Togli i dati di esempio</button>`,true):''}
  ${sec('Benvenuto: come è fatta l’app',`<p>È il diario dei tuoi allenamenti: scrivi cosa fai, usi i timer in palestra e vedi se e quanto migliori. In basso ci sono sei schede:</p>
    ${tb(['Scheda','A cosa serve'],[
      ['<b>Diario</b>','Le tue sedute. Crei quella di oggi, segni le serie man mano, la chiudi. In alto: «In corso» (gli allenamenti che stai facendo), «Programmate» (preparate per un altro giorno), «Archiviate».'],
      ['<b>Timer</b>','I timer da palestra: recupero tra le serie, EMOM, EDT, AMRAP, circuiti, ladder, per tempo, test e un semplice conto alla rovescia. Collegati alla seduta scrivono da soli nel diario; con «Timer libero» li usi da soli.'],
      ['<b>Storico</b>','Tutte le sedute fatte, settimana per settimana. Da qui esporti e importi il backup.'],
      ['<b>Esercizi</b>','L’elenco degli esercizi, l’<b>Andamento</b> (i grafici dei progressi), i <b>Protocolli</b> (i tuoi schemi con il loro codice, es. 4x6 recupero 90″) e la <b>Squadra</b>.'],
      ['<b>Test</b>','Massimali e test (1RM, ripetizioni con carico, Test 30′ e 15′, ILTITO per tempo) e i <b>Dati biometrici</b> (peso, misure, profili).'],
      ['<b>Guida</b>','Questa pagina.']])}
    <p>Tutto si salva da solo ${S.mode==='db'?'nel tuo account Claude':'sul telefono, non serve internet'}. Ogni tanto fai un backup (vedi «Backup» più sotto).</p>`,!(window.DIARIO_DEMO&&!load('diario-demo-tolti')))}
  ${sec('La prima seduta in 5 minuti',`<ol>
    <li>Vai in <b>Diario</b> e tocca <b>«+ Nuova seduta»</b>.</li>
    <li>Nel campo <b>WO</b> scrivi un codice breve, per esempio <code>A</code>. È il nome di quell’allenamento (es. A = spinta, B = trazione, C = gambe): la volta dopo lo ritrovi in «In corso» già pronto.</li>
    <li>In fondo, in <b>«Aggiungi un esercizio»</b>, scrivi il nome (mentre scrivi ti propongo quelli già usati) e tocca <b>Aggiungi</b>.</li>
    <li>Nella scheda dell’esercizio compila <b>Kg</b>, <b>Rep previste</b> (le ripetizioni di ogni serie) e <b>N° serie</b>. Le caselle tratteggiate sono le serie da fare, con il numero di ripetizioni.</li>
    <li>Finita una serie, <b>toccala</b>: diventa verde, cioè completata. Se è andata diversamente toccala di nuovo e scegli «A fatica», «Fallita» (con − / + indichi quante ne hai fatte) o «Non eseguita».</li>
    <li>Alla fine indica la <b>Fatica</b> dell’esercizio e tocca <b>«Chiudi seduta»</b>. La trovi nello Storico.</li></ol>
    <p><b>Esempio</b>: Trazioni, Kg 80 (peso corporeo), Rep previste 6, N° serie 4 → compaiono quattro caselle «6». Fai la prima serie e tocchi la prima casella, e così via.</p>
    <p class="muted small">Finché non segni la prima serie la seduta non va nello storico. Chiudendola senza serie ti chiedo se tenere le modifiche nel WO, programmarla o scartarla.</p>`)}
  ${sec('Allenarsi con il timer',`<ul>
    <li>Sulla scheda di ogni esercizio c’è il pulsante del timer (es. «Set&amp;Pause 90″»): apre il timer già impostato. Controlla e tocca <b>Avvia</b>.</li>
    <li>Parte un conto alla rovescia di preparazione, poi la serie: quando hai finito tocca <b>«Fine serie»</b> e parte il recupero.</li>
    <li>Durante il recupero segni la serie appena fatta: − / + per le ripetizioni e <b>Completata / A fatica / Fallita</b>. L’esito in vigore è sempre evidenziato (con ✓): all’inizio «Completata»; se segni «A fatica» resta selezionato anche nelle serie e nei giri dopo finché non lo cambi. Con meno ripetizioni del previsto la serie diventa «Fallita»; le ripetizioni cambiate valgono anche per le serie dopo. Se non tocchi niente vale l’esito evidenziato.</li>
    <li>Alla fine le serie e il tempo sono già nella seduta: «Torna alla seduta».</li>
    <li><b>«Avvia la seduta»</b> (il pulsante grande in cima alla seduta) mette in fila tutti gli esercizi con i loro timer, con pause tra un blocco e l’altro e, se li attivi, riscaldamento e defaticamento.</li>
    <li><b>Timer libero</b>: nella scheda Timer scegli «Timer libero» per usare un timer da solo, senza scrivere nel diario.</li>
    <li>Durante il timer lo schermo resta acceso; ⛶ apre lo schermo intero. Il tipo di suono (anche a voce) si sceglie in fondo alla pagina del timer: «Prova il suono».</li></ul>`)}
  ${sec('Salvare, programmare, modificare un allenamento',`<ul>
    <li><b>Si salva da sola</b> mentre ti alleni: alla prima serie segnata la seduta va nello Storico. Finché non segni niente resta solo «aperta» (puoi uscire e riprenderla con «Riprendi»): così aprire un WO per guardarlo non riempie lo storico e non fa avanzare la progressione.</li>
    <li><b>«Chiudi seduta»</b> quando hai finito: ferma anche il timer e il cronometro della seduta, se stanno ancora andando, e salva i tempi. Se non hai fatto serie ti chiedo se tenere le modifiche nel WO, programmarla o scartarla.</li>
    <li><b>«Salva, programma…»</b> in fondo alla seduta:
      <ul><li><b>Aggiorna il WO</b>: le modifiche (esercizi, protocolli, finisher, nome) valgono le prossime volte che apri quel WO da «In corso». Non crea sedute nuove.</li>
      <li><b>Programma per un altro giorno</b>: la seduta va in «Programmate» con la data che scegli.</li>
      <li><b>Salva come nuovo WO</b>: una copia con un codice nuovo, in «In corso» oppure programmata.</li></ul></li>
    <li><b>Esempio</b>: vuoi aggiungere un finisher al WO A senza allenarti oggi. Apri A da «In corso», aggiungi il finisher, «Salva, programma…» → «Aggiorna il WO A».</li></ul>`)}
  ${sec('La volta dopo: la progressione automatica',`<p>In <b>Diario → In corso</b> tocca il tuo WO: copio gli esercizi dell’ultima volta con carichi e protocolli e ti propongo il <b>piano successivo</b>. Sotto il nome dell’esercizio c’è scritto il perché.</p>
    <p><b>Esempio</b> con 4 serie da 6: se le completi tutte, la volta dopo la prima serie sale a 7 (7-6-6-6), poi due serie (7-7-6-6) e così via; quando sono tutte a 7 la base diventa 7. Se una serie fallisce, ripeti lo stesso piano.</p>
    <p>Con «Progressione» (sulla scheda dell’esercizio) imposti un tetto: arrivato lì riparti più in basso con qualche kg in più.</p>`)}
  ${sec('Vedere i progressi',`<ul>
    <li><b>Esercizi → Andamento</b>: per ogni esercizio con almeno 4 sedute nel periodo vedi se migliori (▲ verde), peggiori (▼ rosso) o sei stabile (●). Scegli il periodo e la misura.</li>
    <li>Tocca un esercizio per i grafici: forza stimata, volume, tonnellaggio, densità, PowerIndex e carico. Tocca un punto del grafico per leggere data e valore.</li>
    <li>La <b>forza stimata</b> è il massimale che dimostri in allenamento (dai kg e dalle ripetizioni fatte): se la linea sale, stai diventando più forte.</li>
    <li>Lo <b>Storico</b> mostra le sedute settimana per settimana: tocca una seduta per vederla, modificarla o eliminarla.</li></ul>`)}
  ${sec('Massimali e test',`<ul>
    <li>In <b>Test → Test e massimali</b> registra il massimale degli esercizi principali: basta il carico e le ripetizioni fatte, il massimale (1RM) lo calcolo io. Da quel momento la <b>% 1RM</b> delle sedute si compila da sola.</li>
    <li><b>Test 30′ e 15′</b>: quante ripetizioni riesci a fare con un carico fisso; il timer ti fa contare con +1.</li>
    <li><b>Per tempo (ILTITO)</b>: un percorso da finire il prima possibile (es. 2 km di corsa, 50 V-pushup, 50 trazioni, 50 squat bulgari per arto, 50 dip, 50 body row, 2 km di corsa). Il percorso si può cambiare o se ne possono salvare altri. Con il timer: il tempo totale corre, nella corsa tocchi «Fatto», negli esercizi a ripetizioni registri le serie e passi avanti da solo quando arrivi al totale. Alla fine vedi parziali e record, salvi il test e se vuoi crei una seduta.</li>
    <li>In <b>Dati biometrici</b>: nome, data di nascita, peso e misure nel tempo. Se il telefono lo usano più persone, crea un profilo per ciascuno.</li></ul>`)}
  ${sec('Backup: non perdere i dati',`<p>${S.mode==='db'?'I dati stanno nel tuo account Claude; il backup serve per portarli nell’app sul telefono o per tenerne una copia.':'I dati stanno solo su questo telefono.'} Ogni tanto vai in <b>Storico → «Esporta backup completo»</b> e salva il file (per esempio su Drive o mandalo a te stesso).${window.AndroidBridge?' Nell’app Android il file va direttamente nella cartella <b>Download/DiarioAPP</b> del telefono, senza uscire dall’app; con «Invia o salva altrove…» lo mandi anche su Drive o per mail.':''}</p>
    <p>Il backup completo contiene <b>tutto</b>: sedute e WO, esercizi con le loro impostazioni (monolaterali, icone, progressione), protocolli, timer registrati e impostazioni dei timer (anche il conto alla rovescia), test e massimali, dati biometrici, profilo e promemoria.</p>
    <p>Su un telefono nuovo, o dopo aver reinstallato l’app: <b>Storico → «Importa backup»</b> e scegli quel file. Puoi scegliere:</p>
    <ul><li><b>Ripristina tutto</b>: le impostazioni diventano quelle del backup (la scelta giusta su un dispositivo nuovo);</li>
    <li><b>Aggiungi ai miei dati</b>: tieni le tue impostazioni e aggiungi solo quello che manca.</li></ul>
    <p>Sedute, test, misure e protocolli vengono sempre uniti a quelli che ci sono già, senza cancellare niente: puoi importare anche più volte. Con più profili sullo stesso dispositivo il backup riguarda il profilo in uso.</p>
    <p>Quando esporti scegli: <b>Esporta</b> (i dati restano anche qui) oppure <b>Esporta e svuota questo dispositivo</b> (per esempio se passi a un altro telefono): l’app cancella i dati solo dopo aver controllato che il file sia stato salvato e dopo la tua conferma.</p>
    ${window.AndroidBridge?'<p>Nell’app Android c’è anche una <b>copia di sicurezza automatica</b> nella memoria dell’app, aggiornata mentre la usi: se un giorno l’app si apre vuota, ti propone di ripristinarla. Resta finché non disinstalli l’app, quindi il backup su file serve comunque.</p>':''}
    <p>«Esporta CSV (Excel)» crea invece un file con il solo diario, da aprire con Excel o Fogli Google.</p>
    ${window.AndroidBridge?'':'<p class="muted small">Sul telefono, apri l’indirizzo dell’app con Chrome e dal menu ⋮ scegli «Installa app»: avrai l’icona e funzionerà anche senza internet.</p>'}`)}
  ${sec('Parole che trovi nell’app',tb(['Parola','Significato'],[
    ['WO','Il codice di un allenamento (A, B, C…): serve a ritrovarlo e ripeterlo.'],
    ['Set&amp;Pause','Serie e recupero: fai la serie, poi il recupero (fisso o proporzionale alla serie).'],
    ['Superset, Triset, Giant set','2, 3 o più esercizi uno dopo l’altro, poi il recupero.'],
    ['EMOM (E2MOM, E3MOM)','A ogni minuto (o intervallo) fai le ripetizioni; il tempo che avanza è recupero. E2MOM alterna due esercizi.'],
    ['EDT','Due esercizi alternati per un tempo fisso (la «PR Zone»): conta quante ripetizioni fai in tutto.'],
    ['AMRAP','Più giri possibile in un tempo dato.'],
    ['RT / ST','RT: un totale di ripetizioni da raggiungere con le serie che servono. ST: N serie da X ripetizioni con il recupero che ti serve.'],
    ['Ladder','Scala di ripetizioni (es. 1-2-3-4-5): ogni numero è una serie.'],
    ['Circuito','Stazioni una dopo l’altra (a tempo o a ripetizioni) e riposo tra i giri.'],
    ['Per tempo','Un percorso da finire nel minor tempo possibile (es. ILTITO).'],
    ['Finisher','Esercizi brevi da fare alla fine della seduta.'],
    ['Per arto','Esercizio monolaterale: ripetizioni per ogni lato, prima DX poi SX oppure alternati.'],
    ['1RM e % 1RM','Il massimo carico per una ripetizione; la % dice quanto è pesante il carico rispetto al massimale.'],
    ['Fatica / RPE','Quanto è stato duro: da Facile (ne avevi ancora 3–4) a Fallito.'],
    ['Doppia progressione','Prima aumenti le ripetizioni, poi, raggiunto il tetto, il carico.'],
    ['Volume, tonnellaggio','Volume = ripetizioni × % 1RM; tonnellaggio = ripetizioni × kg.'],
    ['Densità, PowerIndex','Densità = ripetizioni al minuto; PowerIndex premia molto lavoro in poco tempo (serve il campo Tempo).']]))}
  ${sec('Domande frequenti',`<ul>
    <li><b>Ho segnato male una serie.</b> Toccala: cambi esito e ripetizioni, oppure «Azzera».</li>
    <li><b>Come cancello una seduta?</b> Dalla seduta aperta «Elimina seduta», oppure Storico → tocca la seduta → «Elimina».</li>
    <li><b>La % 1RM è vuota.</b> Registra un massimale in Test, oppure scrivila a mano.</li>
    <li><b>Non sento i suoni.</b> Alza il volume dei contenuti multimediali e prova i suoni in fondo alla pagina del timer.</li>
    <li><b>Lo schermo si spegne.</b> Durante i timer resta acceso; fuori dai timer segue le impostazioni del telefono.</li>
    <li><b>Siamo in due sullo stesso telefono.</b> Test → Dati biometrici → Profili: ognuno ha i suoi dati.</li>
    <li><b>Cambio telefono.</b> Esporta il backup sul vecchio e importalo sul nuovo.</li></ul>`)}
  <h2 style="margin:22px 0 10px">Approfondimenti</h2>
  ${sec('Comporre una seduta: da dove partire',`<ul>
    <li><b>Da un WO</b> (Diario → Nuova seduta): copia gli esercizi dell’ultima seduta con quel WO, con il piano successivo e il finisher.</li>
    <li><b>Da una seduta vuota</b>: aggiungi gli esercizi uno per uno.</li>
    <li><b>Da un esercizio</b> (Esercizi → scheda dell’esercizio → «Aggiungi alla seduta»): lo aggiunge alla seduta aperta, oppure ne apre una nuova di oggi.</li>
    <li><b>Da un protocollo</b> (Esercizi → Protocolli → «Usa in seduta»): scegli gli esercizi (uno, o più se il protocollo è di gruppo: E2MOM, superset, EDT, circuito, AMRAP…) e li trovi nella seduta già con quel protocollo; il pulsante del timer sulla scheda parte già impostato.</li>
    <li><b>Solo il timer</b> (scheda Timer): senza toccare il diario.</li></ul>
    <p><b>Registrare o no.</b> Una seduta composta resta nel diario finché non la elimini (Diario → «Elimina seduta»). I timer usati senza seduta, alla fine, chiedono «Inserisci nel diario» o «Non inserire»: così puoi provare un protocollo o fare un allenamento extra senza registrarlo.</p>`)}
  ${sec('Il Diario: In corso, Programmate, Archiviate',`<ul>
    <li><b>In corso</b>: i WO che stai usando. Toccane uno per allenarti: copio gli esercizi dell’ultima volta e propongo il piano successivo. «Archivia» lo sposta negli archiviati. «+ Nuova seduta» ne apre una vuota.</li>
    <li><b>Programmate</b>: sedute preparate e mai eseguite, che si aprono così come le hai lasciate. «+ Nuova seduta programmata» ne crea una con nome, WO nuovo e data. Sono le uniche sedute che si possono eliminare.</li>
    <li><b>Usare una programmata</b>: aprila da Programmate, controlla o cambia quello che vuoi, poi «Avvia la seduta» (oppure segna le serie a mano). Alla <b>prima serie registrata</b> diventa una seduta dello storico con la data di oggi e il suo WO passa in «In corso», anche se era archiviato. Se la apri o la avvii e ti fermi prima della prima serie, resta tra le programmate.</li>
    <li><b>Archiviate</b>: WO eseguiti che ora non usi. Non si cancellano, per non perdere lo storico. «Rimetti in corso» li riporta in uso; «Programma di nuovo» ne prepara una seduta con il piano successivo; «Modifica una copia» crea una copia con un WO nuovo da cambiare liberamente.</li>
    <li>All’inizio sono in corso i WO usati negli ultimi sei mesi e archiviati gli altri. Una seduta eseguita con un WO archiviato lo rimette in corso.</li>
    <li>Con una seduta aperta, «← Sedute» torna all’elenco e «Riprendi» la riapre. Una singola seduta si può eliminare dallo Storico o dalla seduta stessa: se contiene dati (serie fatte, note) l’app chiede conferma e mostra cosa si perde; se è stata solo avviata e terminata senza nulla di fatto, la elimina subito. I WO eseguiti invece non si cancellano: si archiviano. Se chiudi una seduta in cui non hai fatto nessuna serie, l’app ti chiede se tenerla per un prossimo allenamento o scartarla, così lo storico non si riempie di sedute vuote.</li></ul>`)}
  ${sec('Preparare una seduta per un’altra volta',`<p>Puoi preparare una seduta senza farla subito: componi gli esercizi, i carichi, i protocolli, il finisher, poi tocca <b>«Salva, programma…»</b> in fondo alla seduta.</p>
    <ul><li><b>Aggiorna il WO</b>: le modifiche valgono le prossime volte che apri quel WO da «In corso»; nessuna seduta nuova.</li>
    <li><b>Programma per un altro giorno</b>: la salva in «Programmate» con la data scelta e la chiude.</li>
    <li><b>Salva come nuovo WO</b>: con un nome e un WO nuovo (il WO proposto è la prima lettera libera), in «In corso» o programmato. La seduta aperta resta com’era.</li></ul>
    <p>Le sedute preparate compaiono in <b>Diario → Programmate</b> e si aprono così come le hai lasciate. Per usarne una: aprila, controllala, «Avvia la seduta». Finché non c’è la prima serie registrata non contano nello storico, nell’andamento né nella progressione; alla prima serie diventano sedute normali, con la data del giorno in cui le fai, e il WO passa in «In corso». Da lì in poi la ritrovi in «In corso»: toccandola riparte con il piano successivo.</p>`)}
  ${sec('Avviare tutta la seduta dal diario',`<p>Nella seduta tocca <b>«Avvia la seduta»</b>, il pulsante in alto. Si apre il piano:</p>
    <ul><li><b>Blocchi</b>, nell’ordine: ogni esercizio o gruppo (superset, E2MOM, EDT…) con il suo timer, già impostato dal protocollo, e il finisher alla fine. «Modifica» apre il timer del blocco: tempi, giri, preparazione, colori, avvisi. «Salva e torna al piano» vale solo per questa seduta.</li>
    <li><b>Tra un blocco e l’altro</b>: la pausa in secondi e se il blocco successivo parte da solo.</li>
    <li><b>Fasi della seduta</b>: riscaldamento e defaticamento (anche lo stretching a posizioni).</li></ul>
    <p>Poi <b>«Avvia la seduta»</b>: riscaldamento → primo blocco → pausa (vedi il blocco successivo, con «Avvia ora» o «Salta questo blocco») → … → finisher → defaticamento → riepilogo con i tempi. Le serie si scrivono da sole nelle schede degli esercizi. Durante la seduta il pulsante del diario diventa «Torna alla seduta in corso».</p>`)}
  ${sec('Una seduta, passo per passo',`<ul>
    <li><b>Nuova seduta</b>: scegli il WO (X, F, Z, A…). Copio gli esercizi dell’ultima volta con il piano successivo già pronto; oppure parti da «Seduta vuota».</li>
    <li><b>Segna le serie</b>: un tocco su una serie = completata; un secondo tocco apre esito (a fatica, fallita con le ripetizioni vere, non eseguita) e − / +.</li>
    <li><b>Fatica e note</b> per ogni esercizio; la % 1RM si calcola da sola dal massimale («auto»), ma puoi scriverla a mano.</li>
    <li><b>Protocollo e timer</b>: scegli il protocollo dall’elenco (Esercizi → Protocolli) e il pulsante sulla scheda apre il timer già impostato. Con «Testo libero» il timer prova a leggere il testo (Rest 90″, EMOM 10x60″, EDT 15′, «+ Calf» = superset).</li>
    <li><b>Finisher</b> e <b>riepilogo</b> in fondo alla seduta. Il salvataggio è automatico: «Chiudi seduta» quando hai finito.</li></ul>`)}
  ${sec('Colori delle serie',`<p>${ch('var(--ok)','completata')} &nbsp; ${ch('var(--fat)','a fatica')} &nbsp; ${ch('var(--ko)','fallita (il numero è quante ne hai fatte)')} &nbsp; ${ch('var(--skip)','non eseguita')}</p>
    <p>Le serie tratteggiate sono ancora da fare e mostrano l’obiettivo. Con «Rep previste» compilato, una serie sotto l’obiettivo diventa rossa da sola.</p>`)}
  ${sec('Doppia progressione',`<p><b>Rep previste</b> = ripetizioni base; <b>Serie a +1</b> = quante delle prime serie ne fanno una in più. Esempio: 4-4-4-3-3-3 = base 3, prime 3 a +1.</p>
    <p>La seduta dopo: se qualche serie è fallita → stesso piano; se tutte riuscite → una serie a +1 in più; quando tutte sono a +1 → la base sale. Con «Progressione» imposti <b>tetto</b>, <b>riparti da</b> e <b>kg in più</b>: arrivato al tetto riparte dalla base bassa con più carico.</p>`)}
  ${sec('I timer',`<ul>
    <li><b>Set&amp;Pause</b>: avvii la serie, «Fine serie», parte il recupero (fisso, multiplo della durata o libero: in quel caso tocchi «Inizia serie»). Più esercizi: uno dopo l’altro oppure superset / triset / giant set. Nelle ripetizioni puoi scrivere una scala come 1-2-3-4-5 (Ladder).</li>
    <li><b>EMOM / E2MOM / E3MOM</b>: un esercizio per intervallo, a rotazione, per N giri; riposo a fine giro e a fine EMOM facoltativi; segni le ripetizioni durante o dopo l’intervallo.</li>
    <li><b>EDT</b>: alterni due esercizi per il tempo della PR Zone confermando le ripetizioni; con due PR Zone, pausa e poi un’altra coppia.</li>
    <li><b>AMRAP</b>: più giri possibile entro il tempo; a ogni esercizio confermi le ripetizioni con ➜ (✓ se l’esercizio è uno solo).</li>
    <li><b>RT</b>: un totale di ripetizioni da raggiungere; dopo ogni serie segni quante ne hai fatte e vedi quante ne mancano.</li>
    <li><b>Ladder</b>: la scala di ripetizioni (in salita, in discesa, su e giù, a onda o personalizzata), con uno o più esercizi, anche alternati, e recupero fisso, multiplo o libero.</li>
    <li><b>Circuito</b>: stazioni a tempo o a ripetizioni, pausa tra le stazioni e riposo tra i giri.</li>
    <li><b>Test</b>: Test 30′ / 15′ con +1 a ogni ripetizione, divise nei tre blocchi.</li>
    <li><b>Per tempo</b>: un percorso da finire il prima possibile, con tempo totale e parziali; corsa a km, esercizi a ripetizioni contate fino al totale. Con un <b>tempo limite</b> diventa <b>Beat the clock</b>: allo scadere il timer si ferma e registra quello che hai fatto.</li>
    <li><b>Conto alla rovescia</b>: un semplice timer libero con 6 tempi pronti (30″, 45″, 60″, 90″, 120″, 150″, che puoi cambiare con «Modifica i tempi») e un contatore di quante volte lo avvii, che correggi con − e + o azzeri.</li>
    <li><b>EMOM MAX</b>: al posto del numero di giri scegli «MAX»: vai avanti finché tocchi «Basta» e alla fine vedi quanti giri completi hai fatto. Scegli se, quando non fai le ripetizioni previste («Serie fallita»), ti fermi o continui.</li>
    <li><b>Ripetizioni e fatica che si ripetono</b>: se durante la seduta cambi le ripetizioni di una serie, la segni «a fatica» oppure «fallita» (che toglie una ripetizione), le serie successive dello stesso esercizio partono già con quel numero e quell’esito, finché non cambi di nuovo (nelle ladder si ripete solo «a fatica»). Vale anche in AMRAP ed EDT: ogni esercizio riparte dalle ripetizioni dell’ultima volta.</li>
    <li><b>Ladder sfida</b> (in salita o su e giù): da soli o in gruppo (fino a 8, a turno). Dopo ogni serie «Fatta» o «Fallita»; le ripetizioni possono salire fino a MAX, senza cima. In su e giù chi fallisce in salita comincia a scendere. Vince chi completa più serie. In su e giù il passo in discesa può essere diverso da quello in salita.</li>
    <li><b>Esercizi per arto</b> (monolaterali, vedi «Esercizi monolaterali e Lati»): in ogni esercizio e in Set&amp;Pause, Ladder, EMOM, EDT, Circuito e Per tempo scegli «Lati»: entrambi insieme, per arto prima DX poi SX, oppure per arto alternati. Le ripetizioni sono per arto. Con «prima DX poi SX» in Set&amp;Pause e Circuito tocchi «Fine lato destro» e poi «Fine serie»; nelle stazioni a tempo il cambio lato suona a metà.</li></ul>
    <p><b>Timer libero</b>: in alto nella scheda Timer scegli «Timer libero» per usare un timer da solo, senza seduta, senza fasi e senza scrivere nel diario; alla fine puoi ripeterlo o sceglierne un altro. «Con la seduta» torna al funzionamento collegato al diario.</p>
    <p>Per tutti: preparazione, colori, avviso prima della fine, avviso a metà, suoni (anche a voce), schermo intero, riposo alla fine. «Torna alla seduta» lascia il timer acceso. I timer avviati dalla seduta scrivono serie e tempo nel diario; gli altri a fine timer chiedono se inserirli.</p>`)}
  ${sec('Andamento: capire se e quanto migliori',`<p>Lo trovi in <b>Esercizi → Andamento</b> (tutti gli esercizi) e nella scheda di ogni esercizio (il dettaglio).</p>
    <h3 style="margin:10px 0 4px">Le cinque misure</h3><ul>
    <li><b>Forza stimata</b>: il massimale che dimostri con quello che hai fatto in seduta. Per ogni serie: ripetizioni massime stimate = ripetizioni fatte + quelle che probabilmente avevi ancora in riserva (fallita 0, a fatica 0,5, completata secondo la fatica e almeno 1); dalla tabella ripetizioni ↔ % trovi la percentuale; forza stimata = kg ÷ %. Si tiene la serie migliore della seduta. Esempio: 6 ripetizioni a fatica con 80 kg → 6,5 ripetizioni massime → 84% → 95,2 kg. Con recuperi brevi (EMOM, superset) la stanchezza abbassa le ripetizioni, quindi la stima è di solito più bassa del massimale dei test: conta la direzione della linea.</li>
    <li><b>Volume</b>: ripetizioni × % 1RM. Sale se fai più ripetizioni o usi carichi più vicini al massimale.</li>
    <li><b>Tonnellaggio</b>: kg × ripetizioni, il peso totale sollevato; non dipende dai massimali né da stime (a corpo libero i kg sono peso corporeo + zavorra).</li>
    <li><b>Densità</b>: ripetizioni al minuto (serve il campo Tempo).</li>
    <li><b>PowerIndex</b>: volume² ÷ tempo; premia molto lavoro in poco tempo (serve il campo Tempo).</li></ul>
    <h3 style="margin:10px 0 4px">La vista d’insieme</h3>
    <p>Scegli il periodo (3 mesi, 6 mesi, 1 anno, tutto) e la misura. Per ogni esercizio con almeno 4 sedute nel periodo vedi: il valore attuale, la variazione (▲ verde se sale di oltre l’1%, ▼ rossa se scende, ● grigia se è stabile) e un mini grafico. La variazione confronta la media del primo quarto delle sedute del periodo con quella dell’ultimo quarto, così una seduta storta non cambia il giudizio. In cima: quanti esercizi migliorano, peggiorano o sono stabili.</p>
    <h3 style="margin:10px 0 4px">Il dettaglio di un esercizio</h3>
    <ul><li>La frase in alto e i riquadri: forza stimata e variazione, miglior stima, carico massimo, volume a settimana (confrontato con la prima metà del periodo), sedute a settimana, % di serie fallite, densità, PowerIndex, ultimo test.</li>
    <li><b>Per seduta / Per settimana</b>: per seduta ogni punto è un allenamento; per settimana ogni punto è una settimana dell’anno (forza stimata e carico = la seduta migliore, volume = la somma, densità e PowerIndex = la media). La settimana ti mostra la tendenza anche se non ti alleni sempre negli stessi giorni.</li>
    <li><b>I grafici</b>: forza stimata, volume, densità, PowerIndex e carico usato. In orizzontale c’è il tempo (date o settimane), in verticale il valore della misura con la sua unità. I punti verdi sono sedute (o settimane) con tutte le serie riuscite, quelli rossi con almeno una serie fallita; la linea grigia sottile unisce i punti, quella scura è la media degli ultimi 5 punti e mostra la tendenza senza gli sbalzi.</li>
    <li><b>Tocca un punto</b> per leggere sotto il grafico la data (o la settimana) e il valore esatto.</li></ul>
    <h3 style="margin:10px 0 4px">Come leggerlo</h3>
    <p>Forza stimata che sale = a parità di carico fai più ripetizioni, o a parità di ripetizioni sollevi di più. Volume che sale con forza ferma = stai accumulando lavoro (spesso arriva dopo). Molti punti rossi in fila = carico o progressione troppo aggressivi. Densità e PowerIndex dicono se fai lo stesso lavoro in meno tempo.</p>`)}
  ${sec('Protocolli',`<p>Un protocollo descrive <b>come</b> fai un esercizio (o un gruppo di esercizi): serie, ripetizioni, tempi e recuperi. Li trovi in <b>Esercizi → Protocolli</b>.</p>
    <ul><li><b>Tipo e descrizione</b>: il tipo (Set&amp;Pause, EMOM, GVT…) viene dal protocollo da cui parti. Ogni protocollo ha una <b>descrizione breve</b> scritta da te o automatica (es. «EMOM 10x60″ x 6»): è quella che vedi ovunque nell’app e che usi per ritrovarlo con «Cerca».</li>
    <li><b>Varianti</b>: ogni modifica a un protocollo già usato in altre sedute diventa una <b>variante</b>, registrata a parte: le sedute passate restano esattamente com’erano. Se due protocolli avrebbero la stessa descrizione, l’app aggiunge un numero (es. «… (2)»). Se il protocollo è usato solo nella seduta aperta, viene semplicemente aggiornato.</li>
    <li><b>Dove si modificano</b>: solo dentro la seduta, nella «Struttura della seduta» → «Modifica protocollo». In Esercizi → Protocolli li consulti («Dettagli»), ne crei di nuovi o crei una variante; un protocollo usato in una seduta (anche programmata o in un WO) non si può eliminare.</li></ul>
    <p>I tipi di protocollo:</p>
    <ul>${PTIPI.map(([k])=>`<li>${PDESC[k]||''}</li>`).join('')}</ul>
    <p>Le ripetizioni del piano dell’esercizio (doppia progressione) hanno la precedenza; se l’esercizio non ha un piano valgono quelle del protocollo. I protocolli usati negli ultimi mesi sono già pronti, e le nuove sedute li riconoscono dal testo che usavi.</p>`)}
  ${sec('Struttura della seduta: gruppi, protocolli e timer',`<p>In ogni seduta, sopra gli esercizi, la <b>Struttura della seduta</b> mostra i blocchi nell’ordine: ogni blocco è un esercizio da solo oppure un <b>gruppo</b> di esercizi da fare insieme.</p>
    <ol><li><b>Gruppi</b>: nella scheda di un esercizio scegli «Gruppo A» (o B, C…). Gli esercizi con la stessa lettera si fanno insieme (superset, E2MOM, circuito, percorso per tempo…) e hanno <b>un solo protocollo</b> e <b>un solo timer</b>, che si impostano <b>dal gruppo</b>, nella Struttura della seduta (nella scheda dell’esercizio li vedi soltanto).</li>
    <li><b>Esercizi da soli</b>: ognuno ha il suo protocollo e il suo timer; il protocollo lo scegli anche nella scheda dell’esercizio.</li>
    <li><b>Protocollo del blocco</b>: dal menu del blocco scegli un protocollo <b>adatto</b> (per un gruppo l’app propone solo quelli che funzionano con quel numero di esercizi), oppure «Crea il protocollo». Se manca o non è adatto, la struttura lo segnala in rosso.</li>
    <li><b>Timer del blocco</b>: i timer sono <b>modelli generali</b> (Timer → Timer registrati). Dal menu «Timer» del blocco scegli il modello: il blocco ne incorpora una copia nella seduta. Con «Modifica timer» cambi preparazione, avvisi, colori, come segni le ripetizioni e anche i <b>tempi</b> (secondi per esercizio, recuperi, giri, minuti): restano nel timer di quel blocco e li ritrovi quando lo riapri o avvii la seduta. La modifica viene registrata anche come nuovo modello (una variante, se il modello è usato altrove).</li>
    <li><b>Riportare su altri blocchi</b>: «Usa questo protocollo anche per…» e «Usa questo timer anche per…» li copiano sui blocchi <b>omogenei</b>: gruppi con lo stesso numero di esercizi, oppure altri esercizi da soli. Ogni blocco resta distinto, con la sua copia.</li></ol>
    <p>Le sedute che avevi già continuano a funzionare: gli esercizi che prima partivano insieme (stesso protocollo di gruppo) vengono messi da soli in un gruppo quando apri la seduta.</p>`)}
  ${sec('Svolgimento della seduta: tutto in un colpo solo',`<p>Ogni seduta ha il suo <b>svolgimento</b>: <b>riscaldamento</b>, la <b>pausa tra i blocchi</b>, il <b>finisher</b> e il <b>defaticamento</b> (anche lo stretching a posizioni). I blocchi, ognuno con il suo protocollo e il suo timer, si fanno nell’ordine della «Struttura della seduta».</p>
    <ol><li><b>Impostarlo</b>: Diario → Struttura della seduta → «Svolgimento della seduta» → «Modifica lo svolgimento». Vale solo per quella seduta: non si sceglie da altre sedute.</li>
    <li><b>Copiarlo</b>: quando copi il WO in un altro, oppure apri di nuovo lo stesso WO, lo svolgimento viene copiato con gli esercizi, i gruppi, i protocolli e i timer dei blocchi.</li>
    <li><b>Per farla tutta</b>: nel Diario tocca «Avvia la seduta». Vedi i blocchi nell’ordine, la pausa e le fasi; «Avvia la seduta» parte con il riscaldamento, passa da un blocco all’altro con la pausa, poi il finisher e infine il defaticamento, senza dover toccare altro.</li></ol>
    <p>Le sedute nuove partono con le fasi impostate nella scheda Timer.</p>`)}
  ${sec('Stretching e mobilità: esercizi e routine',`<ol><li><b>Esercizi</b>: nella scheda di un esercizio, in «Tipo di esercizio», scegli <b>Stretching</b> o <b>Mobilità</b> (anche quando lo crei). Questi esercizi formano un elenco a parte: Esercizi → <b>Stretching</b>.</li>
    <li><b>Routine</b>: in Esercizi → Stretching crei una routine (es. «Stretching gambe»): le posizioni, scelte da quell’elenco, con i secondi di ognuna e il cambio posizione. Ogni routine ha un codice (STR-01 stretching, MOB-01 mobilità, MIX-01 tutte e due) e una descrizione.</li>
    <li><b>Nello svolgimento della seduta</b>: nel defaticamento «Stretching a posizioni» scegli la routine dal menu, oppure scegli le posizioni una per una dall’elenco e tocca «Salva come routine» per riusarle in altri WO.</li></ol>
    <p>Se dopo aver scelto una routine cambi qualche posizione, la modifica vale solo per quello svolgimento; la routine resta com’era.</p>`)}
  ${sec('Dal diario al timer: Avvia, Salva, Torna',`<p>Quando dalla scheda di un esercizio tocchi il pulsante del timer, oltre ad <b>Avvia</b> trovi <b>Salva</b> e <b>Torna alla seduta</b>.</p>
    <ul><li><b>Salva</b>: tiene le modifiche e torna alla seduta. Preparazione, avvisi, colori, modo di segnare e tempi (lavoro, recupero, giri, minuti) vanno nel timer di quel blocco della seduta; serie e ripetizioni previste vanno nell’esercizio.</li>
    <li><b>Torna alla seduta</b>: torna senza salvare niente.</li></ul>
    <p>Protocollo e timer di un gruppo si impostano dal gruppo, nella Struttura della seduta; da lì li riporti anche sugli altri gruppi con lo stesso numero di esercizi. Per gli esercizi da soli, «Usa questo protocollo anche per…» li riporta sugli altri esercizi da soli.</p>`)}
  ${sec('Esercizi a corpo libero e zavorra',`<p>Nella scheda di un esercizio (Esercizi → Elenco), in «Carico», scegli <b>A corpo libero</b> per trazioni, parallele, dip e simili. Nella seduta scrivi solo la <b>zavorra</b>: i <b>Kg</b> sono calcolati da soli, peso corporeo dell’ultima misurazione nei dati biometrici più la zavorra (es. 80 + 10 = 90 kg). Tutti i conti (% 1RM, tonnellaggio, forza stimata) usano questi Kg. Quando la progressione aggiunge kg, li aggiunge alla zavorra. Le sedute già fatte tengono i loro Kg.</p>
    <p>Per gli esercizi con attrezzi non cambia niente: scrivi i Kg; la zavorra è solo un’informazione in più.</p>`)}
  ${sec('Conto alla rovescia solo in secondi',`<p>Nella scheda Timer, nelle impostazioni generali, «Conto alla rovescia solo in secondi» mostra «45» invece di «0:45»: il numero diventa più grande, mentre pulsanti e ripetizioni restano della stessa misura. Da 10 minuti in su il tempo resta in minuti e secondi.</p>`)}
  ${sec('Esito automatico a fine seduta',`<p>Quando termini la seduta (con «Termina seduta» nel timer oppure con «Chiudi seduta» nel diario) ogni esercizio riceve una nota automatica in base a come hai segnato le serie:</p>
    ${tb(['Esito','Quando'],[['<b>Liscia</b>','tutte le serie completate normalmente'],['<b>Difficile</b>','1 o 2 serie segnate «a fatica»'],['<b>Dura</b>','3 o più serie segnate «a fatica»'],['<b>Fallita</b>','anche una sola serie segnata «fallita»']])}
    <p>La nota compare all’inizio delle note dell’esercizio (es. «Esito: Difficile (2 serie a fatica)») e, se non l’hai già scelta tu, imposta anche la <b>Fatica</b> (Liscia, Difficile, Dura, Fallito), che conta per l’RPE. Se cambi la Fatica a mano, la tua scelta resta.</p>`)}
  ${sec('Esercizi monolaterali e «Lati»',`<p>Nella scheda di ogni esercizio (Esercizi → tocca il nome) scegli <b>Bilaterale</b> o <b>Monolaterale</b>; quando crei un esercizio nuovo c’è la casella «Monolaterale». Se non lo indichi, l’app lo capisce dal nome (es. affondi, squat bulgaro, «a un braccio»).</p>
    <p>Solo per gli esercizi monolaterali la seduta e i timer propongono «Lati»: entrambi insieme, prima DX poi SX, oppure alternati.</p>`)}
  ${sec('Promemoria dei dati biometrici',`<p>In <b>Test → Dati biometrici → Promemoria</b> attiva «Ricordami di registrare nuovi dati biometrici» e scegli ogni quanto: settimanale, mensile, bimestrale, trimestrale, semestrale o annuale. Il periodo conta dall’ultima misurazione.</p>
    <p>Quando è ora, all’apertura dell’app compare un avviso: «Inserisci ora» ti porta alle misure, «Chiudi» lo nasconde fino alla prossima apertura, «Non ricordarmelo fino al prossimo periodo» lo nasconde fino al periodo successivo.</p>`)}
  ${sec('La schermata dell’EDT',`<ul>
    <li><b>In alto</b>: EDT, il cronometro della seduta e ⛶ per lo schermo intero.</li>
    <li><b>Al centro</b>: «PR Zone 1 / 2, tempo rimasto» (o solo «Tempo rimasto»), l’esercizio da fare adesso e il tempo grande che scende.</li>
    <li><b>Sotto il tempo</b>: il target di ripetizioni e l’esercizio che viene dopo.</li>
    <li><b>− numero +</b>: le ripetizioni della serie che hai appena fatto; parte dal target, correggilo se ne hai fatte di più o di meno.</li>
    <li><b>➜</b>: conferma le ripetizioni e passa all’altro esercizio. Il colore dello schermo cambia con l’esercizio.</li>
    <li><b>I due riquadri</b>: ripetizioni e serie fatte finora per ciascun esercizio della zona; quello evidenziato è in corso.</li>
    <li><b>Pausa, Termina, Torna alla seduta</b>. Nella pausa tra le PR Zone e nel riposo finale puoi ancora registrare la serie in corso.</li></ul>`)}
  ${sec('Più esercizi in sequenza con lo stesso timer',`<p>Per fare più esercizi uno dopo l’altro e il recupero solo a fine giro (come nel WO E):</p>
    <ol><li>nella scheda di ognuno scegli lo stesso <b>Gruppo</b> (es. «Gruppo A»);</li>
    <li>nella <b>Struttura della seduta</b> scegli o crea il protocollo del gruppo: Set&amp;Pause (diventa superset, triset o giant set), Circuito, EMOM con tanti esercizi quanti nel gruppo, AMRAP, Per tempo, GVT alternato…;</li>
    <li>il pulsante del timer diventa «Timer Triset» (o Superset, Circuito…): passi da un esercizio all’altro e alla fine del giro parte il recupero. Anche «Avvia la seduta» li tratta come un unico blocco.</li></ol>
    <p>Non serve rifare la seduta partendo dal timer.</p>`)}
  ${sec('Seduta completa: riscaldamento, finisher, stretching',`<ul>
    <li>In «Fasi della seduta» attivi <b>riscaldamento</b> e <b>defaticamento</b>: partono da soli o li avvii tu, a tempo fisso o finché non dici basta. Il defaticamento può essere <b>stretching a posizioni</b> (nome e secondi per ognuna).</li>
    <li>Il <b>finisher</b> (1–6 esercizi, con il suo WO) si fa a tempo, in Set&amp;Pause o a massime ripetizioni; viene riproposto dall’ultima seduta con lo stesso WO. Se c’è un finisher da fare, lo stretching aspetta che tu lo finisca.</li>
    <li>Alla fine hai i tempi di riscaldamento, allenamento, defaticamento e totale, salvati nella seduta.</li></ul>`)}
  ${sec('Esercizi, Andamento, Test e Misure',`<ul>
    <li><b>Esercizi</b>: «+ Nuovo esercizio» per crearne uno con il suo nome e la sua icona (o quella automatica, scelta dal nome); toccando l’icona nella scheda di un esercizio la cambi. Nella scheda: massimale in uso, tabella carichi, progressione, test, andamento e sedute.</li>
    <li><b>Andamento</b>: per periodo e per misura (forza stimata, tonnellaggio, volume, densità, PowerIndex) vedi quali esercizi migliorano; nella scheda dell’esercizio i grafici per seduta o per settimana (vedi «Andamento» qui sopra).</li>
    <li><b>Test</b>: 1RM, ripetizioni con carico, 5RM / corpo libero, massime ripetizioni a corpo libero, Test 30′ e 15′, Per tempo (ILTITO: un percorso preimpostato e modificabile, da finire nel minor tempo; conta tempo totale e parziali e alla fine puoi creare anche una seduta a sé). I test sul massimale valgono dalla data «Applica da» e aggiornano la % delle sedute da quella data. I massimali di default vengono dalle ultime settimane dello storico.</li>
    <li><b>Dati biometrici</b>: profilo (nome, sesso, data di nascita ed età), peso corporeo e circonferenze, con l’età a ogni data e la differenza dalla volta prima.</li></ul>`)}
  ${sec('Profili sullo stesso dispositivo',`<p>Se più persone usano lo stesso tablet, crea un profilo per ciascuno in <b>Test → Dati biometrici → Profili su questo dispositivo</b>. Ogni profilo ha sedute, test, protocolli, dati biometrici, impostazioni e seduta in corso separati.</p>
    <ul><li>All’apertura l’app chiede «Chi si allena?» (si può disattivare); per cambiare profilo tocca il nome in alto nel Diario.</li>
    <li>In <b>Esercizi → Squadra → Profili di questo dispositivo</b> vedi tutti i profili come una squadra: atleti, esercizi in miglioramento, confronto per esercizio e andamenti di ognuno. I dati di un profilo si aggiornano quando quel profilo usa l’app.</li>
    <li>Il backup esporta il profilo in uso: per salvare tutti, esporta da ciascun profilo.</li></ul>`)}
