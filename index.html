function chart(title,data,dec){
  const W=600,H=200,P=30;const vals=data.map(d=>d.v).filter(v=>v!=null);
  if(!vals.length)return '';
  let lo=Math.min(...vals),hi=Math.max(...vals);if(lo===hi){lo-=1;hi+=1}
  const x=i=>P+(W-2*P)*(data.length===1?.5:i/(data.length-1)),y=v=>H-P-(H-2*P)*(v-lo)/(hi-lo);
  const pts=data.map((d,i)=>d.v==null?null:[x(i),y(d.v)]).filter(Boolean);
  return `<div class="chart"><h3>${title}</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title} nelle ultime ${data.length} sedute">
    <line x1="${P}" x2="${W-P}" y1="${H-P}" y2="${H-P}" stroke="var(--line)"/>
    <text x="${P}" y="${H-4}" font-size="20" fill="var(--muted)">${fmtD(data[0].d)}</text>
    <text x="${W-P}" y="${H-4}" font-size="20" fill="var(--muted)" text-anchor="end">${fmtD(data[data.length-1].d)}</text>
    <text x="${P}" y="20" font-size="20" fill="var(--muted)">${fmtN(hi,dec)}</text><text x="${P}" y="${H-P-4}" font-size="20" fill="var(--muted)">${fmtN(lo,dec)}</text>
    <polyline fill="none" stroke="var(--ink)" stroke-width="2.5" points="${pts.map(p=>p.join(',')).join(' ')}"/>
    ${data.map((d,i)=>d.v==null?'':`<circle cx="${x(i)}" cy="${y(d.v)}" r="5" fill="${d.f?'var(--ko)':'var(--ok)'}" stroke="var(--surface)" stroke-width="1.5"/>`).join('')}
  </svg><div class="legend"><span><i style="background:var(--ok)"></i>tutte riuscite</span><span><i style="background:var(--ko)"></i>con serie fallite</span></div></div>`;
}

function parseProto(p){
  p=String(p||'').replace(/[″“”]/g,'"').replace(/''|""/g,'"');let m;
  if(m=p.match(/^\s*EDT\s*(\d+)/i))return {type:'edt',min:+m[1]};

function warnBeep(rem){if(T.cfg.warnSec>3&&rem<=T.cfg.warnSec*1000&&!T.warned){T.warned=true;sound('warn')}}

function tick(){

  else if(T.mode==='tst'){if(tstTick(t))return}
  else if(T.mode==='rec'){
    if(T.phase==='lead'){const rem=T.cfg.lead*1000-t;countdownBeeps(rem);if(rem<=0){T.restKind=null;spGo(t,true)}}
    else if(T.phase==='work'){const st=spStep();if(st&&st.w){const rem=st.w*1000-(t-T.ph0);if(T.side==='dx'&&rem<=st.w*500){T.side='sx';sound('change','sinistro')}countdownBeeps(rem);warnBeep(rem);halfBeep(rem,st.w*1000);if(rem<=0&&spEndSet(t)==='stop'){render();return}}}
    else if(T.phase==='rest'&&!isFinite(T.restMs)){}

      if(rem<=0){if(T.final){tStop();sound('end');render();return}T.k++;spGo(t,false)}}
  }else if(T.mode==='emom'){

      for(let i=0;i<T.slots.length;i++){if(u<acc+T.slots[i].sec*1000){idx=i;break}acc+=T.slots[i].sec*1000}
      if(idx===-1){emomAutoOk(T.slot);tStop();beepEnd();render();return}
      if(idx!==T.slot){if(T.slot>=0)emomAutoOk(T.slot);if(T.cfg.giriMax&&!T.slots[idx].rest)emomGrow(T.slots[idx].g);T.slot=idx;T.marked='';T.warned=false;T.halfDone=false;const sl=T.slots[idx];sound('change',sl.rest?'riposo':T.cfg.ex[sl.i].n);T.lastSec=null}
      T.rem=acc+T.slots[idx].sec*1000-u;countdownBeeps(T.rem);halfBeep(T.rem,T.slots[idx].sec*1000);

    const rem=edtRem(t);if(rem<=10500)countdownBeeps(rem);warnBeep(rem);
    (T.marks||[]).forEach(mk=>{if(!mk.done&&rem<=mk.rem&&rem>3500){mk.done=true;sound(mk.k,mk.say)}});
    if(rem<=0&&T.zone===0&&T.cfg.zones===2){if(T.cfg.restZ>0){T.zr=true;T.zr0=t;T.lastSec=null;T.warned=false;sound('change','pausa')}else edtZone2(t);updateRun();return}
    if(rem<=0){if(T.cfg.restEnd){T.final=true;T.finalStart=t;T.workEnd=t;T.lastSec=null;sound('change','riposo');updateRun();return}tStop();beepEnd();render();return}
  }
  updateRun();
}

    let msg='';

  },

};

/* ---------- v1.4: gruppi, codici di protocolli e timer, conto alla rovescia, esito automatico, promemoria ---------- */
const PDESC={
  sp:'<b>Set&amp;Pause</b>: fai una serie, poi recuperi per un tempo fisso (es. 90″) oppure proporzionale alla durata della serie (es. ×2: dopo una serie di 30″ riposi 60″). Indichi serie e ripetizioni (anche a intervallo, es. 6-8). In un gruppo diventa un superset (2 esercizi), triset (3) o giant set: gli esercizi si fanno uno dopo l’altro e il recupero arriva a fine giro.',
  st:'<b>ST, Serie Target</b>: devi completare tutte le serie previste (es. 5x5) prendendoti il recupero che ti serve, libero o con un minimo fisso. Conta il tempo totale: la volta dopo cerchi di finire prima con lo stesso lavoro. Si fa con un esercizio alla volta.',
  ladder:'<b>Ladder</b>: una scala di ripetizioni in cui ogni gradino è una serie (es. 1-2-3-4-5). Può salire, scendere, fare su e giù o a onda, ed essere ripetuta più volte. Il recupero può essere fisso, un multiplo della durata della serie o libero. In un gruppo gli esercizi si alternano sullo stesso gradino.',
  rt:'<b>RT, Ripetizioni Target</b>: un totale di ripetizioni da raggiungere (es. 50 trazioni) con tutte le serie che servono; l’app conta quante ne mancano. Puoi indicare le ripetizioni per serie e il recupero. Si fa con un esercizio alla volta.',
  emom:'<b>EMOM</b> (Every Minute On the Minute): all’inizio di ogni intervallo (di solito 60″) fai le ripetizioni previste; il tempo che avanza è recupero. <b>E2MOM / E3MOM</b>: 2 o 3 esercizi del gruppo, un intervallo ciascuno a turno, quindi il gruppo deve avere tanti esercizi quanti ne prevede il protocollo. Con giri <b>MAX</b> vai avanti finché ce la fai.',
  edt:'<b>EDT</b> (Escalating Density Training): due esercizi alternati in una PR Zone di N minuti (es. 15′), facendo più ripetizioni totali possibile senza arrivare al cedimento; la volta dopo cerchi di superarle. Con 4 esercizi fai 2 PR Zone con una pausa in mezzo.',
  amrap:'<b>AMRAP</b> (As Many Rounds As Possible): più giri possibile in un tempo fisso (es. 10′) con gli esercizi del gruppo, nell’ordine, ognuno con le sue ripetizioni (fino a 6 esercizi).',
  circ:'<b>Circuito</b>: gli esercizi del gruppo sono stazioni da fare una dopo l’altra, a tempo o a ripetizioni, con una pausa tra le stazioni e un riposo a fine giro; ripeti per i giri previsti.',
  max:'<b>Massime ripetizioni</b>: una sola serie al massimo delle ripetizioni possibili per ogni esercizio del gruppo, con un riposo tra un esercizio e l’altro. Serve come finisher o come verifica.',
  ft:'<b>Per tempo</b>: gli esercizi del gruppo formano un percorso da finire nel minor tempo possibile, nell’ordine della seduta. In ogni esercizio scrivi i km (corsa) oppure le ripetizioni da fare; il timer conta il tempo totale e i parziali, e per gli esercizi a ripetizioni somma le serie finché arrivi al totale.',
  hst:'<b>HST</b> (Hypertrophy-Specific Training): cicli di 2 settimane con 3 sedute a settimana (6 sedute per fase): prima <b>15</b> ripetizioni, poi <b>10</b>, poi <b>5</b>, infine <b>5 negative</b> (solo la discesa, lenta) o di nuovo a 5. In ogni fase parti più leggero, circa il 15–20% sotto il massimale per quelle ripetizioni, e aumenti il carico a ogni seduta fino ad arrivarci nell’ultima (15 rip. ≈ 65% del 1RM, 10 rip. ≈ 75%, 5 rip. ≈ 87%). Di solito 1–2 serie per esercizio. Per passare alla fase dopo crea una variante con la nuova fase.',
  gvt:'<b>GVT</b> (German Volume Training): <b>10 serie da 10</b> ripetizioni con lo stesso carico (circa il 60% del massimale, un peso che porteresti a 20 ripetizioni) e recupero breve (60–90″). Spesso si alternano due esercizi opposti (A1/A2, es. panca e rematore) nello stesso gruppo. C’è anche la versione <b>10 serie da 5</b>, più pesante (circa il 75–80% del massimale, recupero 90–120″), per la forza. Quando chiudi tutte le serie previste, la volta dopo aumenti il carico del 4–5%.',
  btc:'<b>Beat the clock</b>: un lavoro fisso (gli esercizi del gruppo con le loro ripetizioni o distanze) da finire entro un <b>tempo limite</b> (es. 12′). Se finisci prima hai battuto il cronometro e il tempo è il tuo risultato; allo scadere il timer si ferma e registra quello che hai fatto fino a lì.',
  rpm:'<b>1 rep al minuto</b>: poche ripetizioni pesanti (scegli <b>1, 2 o 3</b>) all’inizio di ogni minuto (o dell’intervallo che scegli) per N minuti, di solito con l’85–90% del massimale per 1 ripetizione e un po’ meno per 2 o 3: tanto lavoro di qualità senza accumulare fatica. Con un gruppo di 2–3 esercizi si alternano un intervallo ciascuno.'};
const PCODE={sp:'SP',st:'ST',ladder:'LAD',rt:'RT',emom:'EMOM',edt:'EDT',amrap:'AMRAP',circ:'CIRC',max:'MAX',ft:'FT',hst:'HST',gvt:'GVT',btc:'BTC',rpm:'RPM'};
const GRP='ABCDEFGH';
function nextCode(prefix,codes){let n=0;const re=new RegExp('^'+prefix.replace(/[-]/g,'\\-')+'-(\\d+)$');codes.forEach(c=>{const m=String(c||'').match(re);if(m)n=Math.max(n,+m[1])});return `${prefix}-${String(n+1).padStart(2,'0')}`}
const nextPCode=t=>nextCode(PCODE[t]||'P',[...S.protos.values()].map(x=>x&&x.code));

const tipoLbl=t=>(PTIPI.find(x=>x[0]===t)||['',''])[1];
function ensureCodes(force){if(!S.protosLoaded||(S.codesDone&&!force))return;S.codesDone=true;
  [...S.protos.values()].filter(P=>P&&!P.code).sort((a,b)=>String(a.id).localeCompare(String(b.id))).forEach(P=>{P.code=nextPCode(P.tipo);saveProtoDoc(P)})}
function useIn(fn,skip){let n=0;const chk=s=>{if(s&&s.id!==skip&&(s.ex||[]).some(fn))n++};S.hist.forEach(chk);(S.progs||[]).forEach(s=>{if(!S.hist.includes(s))chk(s)});Object.values(S.cfg.woTpl||{}).forEach(t=>{if(t&&(t.ex||[]).some(fn))n++});return n}
const protoUseOther=(id,skip)=>useIn(e=>e.pid===id,skip);
const protoUsedAny=id=>useIn(e=>e.pid===id,null)+(S.draft&&S.draft.ex.some(e=>e.pid===id)?1:0);
const timerUseOther=(id,skip)=>useIn(e=>e.tid===id,skip);
const timerUsedAny=id=>useIn(e=>e.tid===id,null)+(S.draft&&S.draft.ex.some(e=>e.tid===id)?1:0);

/* gruppi di esercizi nella seduta */
function grpOf(d,i){const e=d.ex[i];if(!e||e.fin||!e.g)return [i];return d.ex.map((x,j)=>!x.fin&&x.g===e.g?j:-1).filter(j=>j>=0)}
function sessBlocks(d){const out=[],seen=new Set();d.ex.forEach((e,i)=>{if(e.fin||seen.has(i))return;const idx=grpOf(d,i);idx.forEach(j=>seen.add(j));out.push({g:idx.length>1?e.g:'',idx})});return out}
function freeGrp(d){return [...GRP].find(L=>!d.ex.some(e=>!e.fin&&e.g===L))||'H'}
function autoGroups(d){
  if(!d||d.gV||!S.protosLoaded)return;d.gV=1;if(d.ex.some(e=>e.g)||d!==S.draft)return;
  const nf=d.ex.filter(e=>!e.fin);
  if(nf.length&&nf.every(e=>!e.pid&&(e.dist!=null||e.tgt!=null||/ILTITO|per tempo/i.test(e.p||'')))){let P=protoList().find(x=>x.tipo==='ft'&&!x.nome);
    if(!P){P={...newPf(),tipo:'ft',nome:'',id:'p'+Date.now().toString(36),code:nextPCode('ft'),src:[],updated:Date.now()};delete P.editId;S.protos.set(P.id,P);saveProtoDoc(P)}
    nf.forEach(e=>{e.pid=P.id;e.p=pName(P);if(nf.length>1)e.g='A';if(!(e.s||[]).some(y=>y[1])){e.s=[];e.b=null;e.k=0;if(e.dist==null&&e.tgt==null){if(exKind(e.n)==='corsa')e.dist=2;else e.tgt=50}}});return}
  const used=new Set();let L=0;
  d.ex.forEach((e,i)=>{if(e.fin||used.has(i))return;let idx=[i];try{idx=timerPlan(i).idx.filter(j=>d.ex[j]&&!d.ex[j].fin&&!used.has(j))}catch(err){}
    if(idx.length>1&&idx.includes(i)){const g=GRP[L++]||'H';idx.forEach(j=>{d.ex[j].g=g;used.add(j)})}else used.add(i)});
}
function protoFits(P,n){if(!P||P.deleted)return false;const t=P.tipo;
  if(n<=1)return !(t==='emom'&&emK(P)>1);
  if(t==='st'||t==='rt')return false;
  if(t==='emom')return emK(P)===n;
  if(t==='rpm')return n<=3;
  if(t==='edt')return n<=4;
  if(t==='amrap')return n<=6;
  return true}
function fitHint(P,n){const t=P.tipo;
  if(t==='emom'&&n===1)return `è un ${emomName(emK(P))}: serve un gruppo di ${emK(P)} esercizi`;
  if(t==='st'||t==='rt')return 'si fa con un esercizio alla volta: togli gli altri dal gruppo o scegli un protocollo per gruppi';
  if(t==='emom')return `è un ${emomName(emK(P))}: per ${n} esercizi serve ${n<=3?'un '+emomName(n):'un protocollo diverso (circuito, AMRAP…)'}`;
  if(t==='rpm')return 'al massimo 3 esercizi';if(t==='edt')return 'al massimo 4 esercizi (2 PR Zone)';if(t==='amrap')return 'al massimo 6 esercizi';return ''}
function applyKeep(x,P){if(!x)return;if((x.s||[]).some(y=>y[1])){x.pid=P?P.id:null;if(P)x.p=pName(P)}else applyProto(x,P)}
function gBadge(i){const d=S.draft,e=d&&d.ex[i];if(!e||e.fin||!e.g)return '';const g=grpOf(d,i);return g.length>1?`<span class="gbadge" title="Gruppo ${esc(e.g)}">${esc(e.g)}${g.indexOf(i)+1}</span>`:''}
function protoOpts(e,i){const n=e.fin?1:grpOf(S.draft,i).length,L=protoList().filter(P=>P.id===e.pid||protoFits(P,n));
  return PTIPI.map(([k,l])=>{const g=L.filter(P=>P.tipo===k);return g.length?`<optgroup label="${l}">${g.map(P=>`<option value="${esc(P.id)}" ${P.id===e.pid?'selected':''}>${esc(pLabel(P))}</option>`).join('')}</optgroup>`:''}).join('')}
function vGrpSel(e,i){return `<label class="f wide">Gruppo (esercizi da fare insieme)<select data-f="e:${i}:g"><option value="">Da solo</option>${[...GRP].map(L=>`<option value="${L}" ${e.g===L?'selected':''}>Gruppo ${L}</option>`).join('')}</select></label>`}

/* timer registrati */
const TKEYS=['lead','mark','colWork','colRest','col','restCol','warnSec','warnCol','half','restEnd','restEndSec','giroFmt','frac','minsLeft'];
const TMN={rec:'REC',emom:'EMOM',edt:'EDT',circ:'CIRC',amrap:'AMRAP',rt:'RT',ft:'FT',ses:'S'};
const tPrefix=(m,c)=>m==='ses'?'TS':m==='emom'&&c&&num(c.k)>1?`T-E${num(c.k)}MOM`:'T-'+(TMN[m]||'X');
const TMLBL={rec:'Serie e recupero',emom:'EMOM',edt:'EDT',circ:'Circuito',amrap:'AMRAP',rt:'RT',ft:'Per tempo',ses:'Svolgimento della seduta'};
function timersMap(){if(!S.cfg.timers||typeof S.cfg.timers!=='object'||Array.isArray(S.cfg.timers))S.cfg.timers={};return S.cfg.timers}
const timerList=()=>Object.values(timersMap()).filter(t=>t&&!t.deleted).sort((a,b)=>String(a.code).localeCompare(String(b.code),'it',{numeric:true}));
function tSub(mode,c){const o={};TKEYS.forEach(k=>{if(k==='mark'&&mode==='rec')return;if(c&&c[k]!==undefined)o[k]=clone(c[k])});return o}
const STDNAME={rec:'Generale per serie e recupero',emom:'Generale per EMOM, E2MOM ed E3MOM',edt:'Generale per EDT',circ:'Generale per circuito',amrap:'Generale per AMRAP',rt:'Generale per RT',ft:'Generale per tempo',ses:'Generale: fasi impostate nella scheda Timer'};
const tmName=t=>t?(t.std?(STDNAME[t.mode]||'Generale'):(String(t.desc||'').trim()||t.code)):'';
const tKindOf=(mode,c,label)=>{const l=String(label||'').replace(/^Timer\s+/,'').trim();if(l&&l!=='Set&Pause')return l;if(mode==='emom'&&c&&num(c.k)>1)return emomName(num(c.k));return l||TMLBL[mode]||mode};

function autoEsito(e){if(!e||e.st==='Non eseguito')return null;const s=(e.s||[]).filter(x=>x[1]==='ok'||x[1]==='fat'||x[1]==='ko');if(!s.length)return null;

  if(ko)return {k:'Fallita',f:'Fallito',t:`${ko} ${ko===1?'serie fallita':'serie fallite'}`};
  if(fat>=3)return {k:'Dura',f:'Dura',t:`${fat} serie a fatica`};
  if(fat>=1)return {k:'Difficile',f:'Difficile',t:`${fat} ${fat===1?'serie':'serie'} a fatica`};

/* promemoria dei dati biometrici */
const BIOPER=[['1w','Settimanale',0,7],['1m','Mensile',1],['2m','Bimestrale',2],['3m','Trimestrale',3],['6m','Semestrale',6],['12m','Annuale',12]];
function addPer(iso,per){const p=BIOPER.find(x=>x[0]===per)||BIOPER[1];if(p[3])return isoMinus(iso,-p[3]);
  const [y,m,d]=iso.split('-').map(Number),t=new Date(Date.UTC(y,m-1+p[2],1)),last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();
  return `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(Math.min(d,last))}`}
function bioDue(){const r=S.cfg.bioRem;if(!r||!r.on)return null;const l=misList()[0];return l?addPer(l.d,r.per||'1m'):todayIso()}

  if(S.bioDone)return;if(S.mode==='db'&&!(S.cfgOk&&S.misOk))return;if(S.mode!=='db'&&S.mode!=='local')return;tries=tries||0;
  if($('#sheetRoot').innerHTML){if(tries<80)setTimeout(()=>bioCheck(tries+1),1500);return}
  S.bioDone=true;const due=bioDue(),r=S.cfg.bioRem,t=todayIso();if(!due||due>t||(r.snooze&&r.snooze>t))return;
  const l=misList()[0],p=(BIOPER.find(x=>x[0]===(r.per||'1m'))||BIOPER[1])[1].toLowerCase();
  sheet(`<h3>Dati biometrici da aggiornare</h3><p class="muted">${l?`L’ultima misurazione è del ${fmtD(l.d)}`:'Non hai ancora registrato nessuna misurazione'}; il promemoria è ${p}.</p>
    <div class="row" style="margin-top:14px"><button class="btn primary" data-a="bioGo">Inserisci ora</button><button class="btn" data-a="closeSheet">Chiudi</button><button class="btn" data-a="bioSnooze">Non ricordarmelo fino al prossimo periodo</button></div>`)}
function vBioRem(){const r=S.cfg.bioRem||{},due=bioDue(),t=todayIso();
  return `<section class="card"><h3 style="margin-bottom:8px">Promemoria</h3>
    <label class="row" style="flex-wrap:nowrap"><input type="checkbox" ${r.on?'checked':''} data-f="br:on" style="width:22px;height:22px"> Ricordami di registrare nuovi dati biometrici</label>
    ${r.on?`<label class="f" style="max-width:260px;margin-top:8px">Ogni quanto<select data-f="br:per">${BIOPER.map(([k,l])=>`<option value="${k}" ${(r.per||'1m')===k?'selected':''}>${l}</option>`).join('')}</select></label>
    <p class="muted small" style="margin:6px 0 0">${due&&due<=t&&!(r.snooze&&r.snooze>t)?'È ora di registrarli: all’apertura dell’app compare un avviso finché non li inserisci.':`Prossimo avviso dal ${fmtD(r.snooze&&r.snooze>due?r.snooze:due)} (conta dall’ultima misurazione).`}</p>`:''}</section>`}

/* ---------- v1.4: timer della seduta (svolgimento), copia e modifica dei timer registrati ---------- */
const SESKEYS=['warmOn','warmAuto','warmMode','warmMin','coolOn','coolAuto','coolMode','coolMin','colWarm','colCool','coolKind','pos','posTr','rid'];
const gTc=m=>(S.tcBak&&S.tcBak[m])||S.tc[m];
const pickSes=c=>{const o={};SESKEYS.forEach(k=>{if(c&&c[k]!==undefined)o[k]=clone(c[k])});return o};
function tsEff(t){if(!t||t.std)return {sess:pickSes(gTc('sess')),pausa:load('diario-pausa')??120,auto:load('diario-pausaAuto')??true};
  const c=t.cfg||{};return {sess:{...pickSes(gTc('sess')),...clone(c.sess||{})},pausa:c.pausa??120,auto:c.auto??true}}
function tsDesc(c){const s=c.sess||{},p=[],pos=s.pos||[];
  p.push(s.warmOn?`riscaldamento ${s.warmMode==='open'?'libero':fmtN(num(s.warmMin)||0,1).replace(/,0$/,'')+'′'}${s.warmAuto?'':' (lo avvii tu)'}`:'senza riscaldamento');
  p.push(`pausa tra i blocchi ${num(c.pausa)||0}″${c.auto?'':' (avvio manuale)'}`);
  p.push(s.coolOn?(s.coolKind==='pos'?`stretching ${pos.length} ${pos.length===1?'posizione':'posizioni'} (${mmss(1000*(pos.reduce((a,x)=>a+(num(x.sec)||0),0)+(num(s.posTr)||0)*Math.max(0,pos.length-1)))})`:`defaticamento ${s.coolMode==='open'?'libero':fmtN(num(s.coolMin)||0,1).replace(/,0$/,'')+'′'}`):'senza defaticamento');
  return p.join(', ')}
const anyDesc=t=>t.mode==='ses'?tsDesc(tsEff(t)):t.std?'usa le impostazioni generali della scheda Timer':tFull(t);
function sesTimer(d){const t=d&&timersMap()[d.tsid];return t&&!t.deleted&&t.mode==='ses'?t:stdTimer('ses')}
function tsUseIn(id,skip){let n=0;const chk=s=>{if(s&&s.id!==skip&&s.tsid===id)n++};S.hist.forEach(chk);(S.progs||[]).forEach(s=>{if(!S.hist.includes(s))chk(s)});Object.values(S.cfg.woTpl||{}).forEach(t=>{if(t&&t.tsid===id)n++});return n}
const tUsed=(t,skip)=>t.mode==='ses'?tsUseIn(t.id,skip)+(skip==null&&S.draft&&S.draft.tsid===t.id?1:0):(skip==null?timerUsedAny(t.id):timerUseOther(t.id,skip));
function tcLoad(m,cfg){S.tcBak=S.tcBak||{};if(!S.tcBak[m])S.tcBak[m]=clone(S.tc[m]);S.tc[m]={...clone(S.tcBak[m]),...clone(cfg||{})}}

function tsRegister(d,cur,sess,pausa,auto,name){if(!d)return null;cur=cur||sesTimer(d);const nm=String(name??'').trim();
  const sub={sess:pickSes(sess),pausa:Math.max(0,num(pausa)||0),auto:!!auto},eff=tsEff(cur);
  if(JSON.stringify(sub)===JSON.stringify({sess:eff.sess,pausa:Math.max(0,num(eff.pausa)||0),auto:!!eff.auto})&&!(nm&&nm!==tmName(cur))){if(d.tsid!==cur.id){d.tsid=cur.id;scheduleSave()}return null}
  const M=timersMap();let t;
  if(!cur.std&&tsUseIn(cur.id,d.id)===0){cur.cfg=sub;if(nm){cur.desc=nm;cur.custom=true}cur.updated=Date.now();t=cur;t._upd=true}
  else{t={id:newTid(),code:nextCode('TS',Object.values(M).map(x=>x&&x.code)),mode:'ses',cfg:sub,desc:nm||tsProposal(d),custom:!!nm,base:cur.code,updated:Date.now()};M[t.id]=t}
  d.tsid=t.id;saveCfg();scheduleSave();return t}
const tsProposal=d=>`Svolgimento ${d&&d.wo?'WO '+d.wo:d&&d.nome?d.nome:'seduta'}`;

/* tempi del blocco (lavoro, recupero, giri, minuti): stanno nel timer del blocco */
function ttOf(mode,c){c=c||{};
  if(mode==='rec')return c.over&&c.over.maxMode?{}:{rest:c.rest||'fix',sec:num(c.sec)||0,mult:num(c.mult)||2,tr:num(c.tr)||0};
  if(mode==='emom')return {giri:num(c.giri)||1,giriMax:!!c.giriMax,restOn:!!c.restOn,restSec:num(c.restSec)||0,secs:(c.ex||[]).slice(0,c.k||1).map(x=>Math.max(5,num(x&&x.sec)||60))};
  if(mode==='edt')return {min:num(c.min)||1,min2:num(c.min2)||num(c.min)||1,restZ:num(c.restZ)||0,zones:c.zones===2?2:1};
  if(mode==='circ')return {giri:num(c.giri)||1,restEx:num(c.restEx)||0,restGiro:num(c.restGiro)||0,st:(c.items||[]).map(x=>x&&x.tipo==='time'?num(x.val)||0:null)};
  if(mode==='amrap')return {min:num(c.min)||1};

  if(mode==='ft')return {cap:num(c.cap)||0};

function ttFits(mode,tt,n){if(!tt)return false;if(mode==='emom')return (tt.secs||[]).length===n;if(mode==='circ')return (tt.st||[]).length===n;return true}
function ttApply(mode,c,tt){if(!tt||!c)return c;
  if(mode==='rec'){if(c.over&&c.over.maxMode)return c;if(tt.rest)c.rest=tt.rest;c.sec=tt.sec;c.between=tt.sec;c.mult=tt.mult;c.tr=tt.tr}
  else if(mode==='emom'){c.giri=tt.giri;c.giriMax=!!tt.giriMax;c.restOn=!!tt.restOn;c.restSec=tt.restSec||c.restSec;(tt.secs||[]).forEach((s,n)=>{if(c.ex&&c.ex[n])c.ex[n].sec=s})}
  else if(mode==='edt'){c.min=tt.min;c.min2=tt.min2;c.restZ=tt.restZ}
  else if(mode==='circ'){c.giri=tt.giri;c.restEx=tt.restEx;c.restGiro=tt.restGiro;(tt.st||[]).forEach((v,n)=>{const x=c.items&&c.items[n];if(x&&v!=null&&x.tipo==='time')x.val=v})}
  else if(mode==='amrap')c.min=tt.min;
  else if(mode==='rt'){c.target=tt.target;c.rest=tt.rest}
  else if(mode==='ft')c.cap=tt.cap;

function ttDesc(mode,tt){if(!tt)return '';const s=v=>`${num(v)||0}″`;

  if(mode==='edt')return tt.zones===2?`${tt.min}′ + ${tt.min2}′, pausa ${tt.restZ}′`:`${tt.min}′`;
  if(mode==='circ'){const st=(tt.st||[]).map(v=>v==null?'a ripetizioni':s(v));return `${tt.giri} giri${st.some(x=>x!=='a ripetizioni')?`, stazioni ${st.join(' / ')}`:''}, pausa ${s(tt.restEx)}, riposo ${s(tt.restGiro)} a fine giro`}

async function importBackup(obj,mode){

    const c=cur.get(x.id);if(c&&(c.updated||0)>=(x.updated||0))continue;
    (x.updated||x.deleted?upd:base).push(x);
  }
  if(S.mode==='db'){for(const x of [...base,...upd])await S.base.collection('sedute').doc(x.id).set(x)}
  else{
    const st=new Map(S.stor);base.forEach(x=>st.set(x.id,x));/* riscrive sempre tutto, anche se non c’è nulla di nuovo */
    const sd=new Map(S.sed);upd.forEach(x=>sd.set(x.id,x));const m={};sd.forEach((v,k)=>m[k]=v);
    if(!store('diario-storico',[...st.values()])||!store('diario-sedute',m))throw new Error('spazio');

    if(mode==='all'){
      const team=S.cfg.team,ex={...(S.cfg.esercizi||{})};Object.entries(c.esercizi||{}).forEach(([k,v])=>{if(v&&typeof v==='object')ex[k]={...(ex[k]||{}),...v}});

      Object.values(TN).forEach(t=>{if(t&&t.std&&stdM.has(t.mode)&&!CT[t.id])t.deleted=true});Object.entries(CT).forEach(([k,v])=>{if(v)TN[k]=v});
      const W={...(S.cfg.woTpl||{})};Object.entries(c.woTpl||{}).forEach(([k,v])=>{if(v&&(!W[k]||(v.updated||0)>=(W[k].updated||0)))W[k]=v});

      S.cfg={...S.cfg,...c,esercizi:ex,timers:TN,woTpl:W,ftTests:L,routines:{...(S.cfg.routines||{}),...((c.routines&&typeof c.routines==='object')?c.routines:{})}};if(team)S.cfg.team=team;else delete S.cfg.team;
      S.prefsLoaded=false;loadPrefs();CD.rem=null;cfg=true}
    else{

      if(c.woTpl&&typeof c.woTpl==='object'){const W={...(S.cfg.woTpl||{})};Object.entries(c.woTpl).forEach(([k,v])=>{if(v&&(!W[k]||(v.updated||0)>(W[k].updated||0))){W[k]=v;cfg=true}});S.cfg.woTpl=W}
      if(c.woState&&typeof c.woState==='object'){const W={...c.woState,...(S.cfg.woState||{})};if(JSON.stringify(W)!==JSON.stringify(S.cfg.woState||{})){S.cfg.woState=W;cfg=true}}

  if(kind==='rf'){const R=S.rf;if(!R)return;if(a==='desc')R.desc=v;else if(a==='posTr')R.posTr=v;else if(a==='pn'&&R.pos[+b])R.pos[+b].n=v;else if(a==='ps'&&R.pos[+b])R.pos[+b].sec=v;return}
  if(kind==='pe'){const P=S.plan;if(P&&S.planEdit!=null&&P.blocks[S.planEdit])P.blocks[S.planEdit].tname=v;return}
  if(kind==='ts'){if(!S.draft)return;S.draft.tsid=v;scheduleSave();render();return}
  if(kind==='tm2'){const E=S.tmEdit;if(!E)return;if(a==='desc')E.desc=v;else if(a==='pausa')E.pausa=Math.max(0,num(v)||0);else if(a==='auto')E.auto=!!v;else if(a==='c'){E.cfg[b]=el.type==='checkbox'?!!v:v;if(el.type==='checkbox')render()}return}
  if(kind==='bt'){const d=S.draft,t=timersMap()[v];if(!d||!t)return;const idx=d.gV?grpOf(d,+a):[+a];tmEmbed(d,idx,t,t.tt&&ttFits(t.mode,t.tt,idx.length)?t.tt:null);scheduleSave();render();return}
  if(kind==='bp'){const d=S.draft,P=v&&S.protos.get(v);if(!d||!P)return;(d.gV?grpOf(d,+a):[+a]).forEach(j=>applyKeep(d.ex[j],P));S.pf=null;S.tc.rec.links=null;S.tc.emom.link=null;S.tc.edt.link=null;S.tc.circ.links=null;scheduleSave();render();return}
  if(kind==='pq'){S.pq=v;const l=$('#pList');if(l)l.innerHTML=vProtoList();return}
  if(kind==='cd'){const c=cdCfg(),n=Math.round(num(v)||0);if(n>0&&n<=3600){c.p[+a]=n;saveCfg();if(!CD.run&&CD.rem==null)cdPaint()}return}
  if(kind==='br'){const r=S.cfg.bioRem={per:'1m',...(S.cfg.bioRem||{})};if(a==='on')r.on=!!v;else r[a]=v;delete r.snooze;S.bioDone=true;saveCfg();render();return}
  if(kind==='new'){S.newDate=v||todayIso();return}
  if(kind==='st'){S.storEx=v;render();return}
  if(kind==='xn'){S.exNew[a]=v;if(a==='n'){const k=autoKind(v),b=document.querySelector('[data-a=exNewIcon][data-v=""]');if(b)b.innerHTML=`${exIconK(k,36)}<span class="small">Automatica</span>`;const c=$('#exNewAuto');if(c)c.textContent=`(automatica dal nome: ${EXNOMI[k]})`}return}
  if(kind==='ex'){S.exQ=v;const l=$('#exList');if(l)l.innerHTML=vExList();return}
  if(kind==='cx'){if(!S.exSel)return;const c=S.cfg.esercizi[S.exSel]=S.cfg.esercizi[S.exSel]||{};c[a]=num(v);saveCfg();return}
  if(kind==='pf'){const f=S.pf;if(el.type==='checkbox'){f[a]=el.checked?el.dataset.on:(a==='group'?'single':'');render();return}
    if(a.includes('.')){const [arr,i,k]=a.split('.');f[arr][+i][k]=v}else f[a]=v;
    if(['da','a','passo','passoGiu','volte','lung','sposta','loDa','loA','hiDa','hiA','seq'].includes(a)){const lp=$('#ladPrev');if(lp)lp.textContent=ladPrev(f)}const nm=$('#pfName');if(nm)nm.textContent=pName(f);return}
  if(kind==='pn'){const P=S.plan;if(!P)return;if(a==='auto'){P.auto=el.checked}else if(a==='tsname'){P.tsname=v}else{P.pausa=Math.max(0,num(v)||0)}return}
  if(kind==='bx'){if(a==='dev')S.devEx=v;else S.team.ex=v;render();return}
  if(kind==='pl'){if(a==='__ask'){S.prof.ask=el.checked;saveProf();return}const x=S.prof.list.find(p=>p.id===a);if(x){x.nome=v.slice(0,30);clearTimeout(S.plT);S.plT=setTimeout(saveProf,800)}return}
  if(kind==='tm'){if(a==='ex'){S.team.ex=v;render();return}if(a==='sel'){teamWatch(v);render();return}
    if(a==='share'){S.cfg.team={codes:teamCodes(),share:el.checked};saveCfg();teamPublish(true);render();return}return}
  if(kind==='pr'){S.cfg.profilo=S.cfg.profilo||{};S.cfg.profilo[a]=v;saveCfg();if(a==='nome'&&S.prof.list.length>1){const x=S.prof.list.find(p=>p.id===PID);if(x){x.nome=v.slice(0,30);clearTimeout(S.plT);S.plT=setTimeout(saveProf,800)}}const pe=$('#prEta');if(pe){const x=etaAl(S.cfg.profilo.nascita,todayIso());pe.textContent=x!=null?`${x} anni`:'–'}return}
  if(kind==='mf'){const f=S.mf;if(a.startsWith('v.'))f.vals[a.slice(2)]=v;else f[a]=v;return}
  if(kind==='tf'&&a.startsWith('ftItems.')){const [,i,k]=a.split('.');const it=S.tf.ftItems[+i];if(it)it[k]=v;return}
  if(kind==='tf'&&a==='ftId'){const f=S.tf,P=ftTests().find(x=>x.id===v);if(P){f.ftId=P.id;f.ftNome=P.nome;f.ftItems=clone(P.items)}render();return}
  if(kind==='tf'){const f=S.tf;if(a.startsWith('parts.'))f.parts[+a.slice(6)]=v;else f[a]=v;
    if(a==='d'&&!f.fromTouched){f.from=v;const el=$('#tfFrom');if(el)el.value=v}
    if(a==='from')f.fromTouched=true;
    if(a==='rif')f.rifTouched=true;
    if((a==='n'||a==='d')&&ENDU[f.tipo]&&!f.rifTouched){const t=maxFor(f.n,f.d);f.rif=t?t.rm:'';const el=$('#tfRif');if(el)el.value=f.rif}
    const r=$('#tfRes');if(r)r.innerHTML=tfResult();return}
  if(kind==='dm'){const t=S.tests.get(a);if(!t)return;const n=num(v);if(!(n>0))return;t.rm=n;t.updated=Date.now();
    clearTimeout(S.dmT);S.dmT=setTimeout(async()=>{await saveTestDoc(t);await applyTest(t)},1200);return}
  if(kind==='tc'){if(/\.n$/.test(a)){const u=document.querySelector(`[data-uni="${a.slice(0,-2)}"]`);if(u){const o=a.slice(0,-2).split('.').reduce((q,k)=>q&&q[k],S.tc);u.style.display=isMono(v)||uniOf(o)?'':'none'}}const path=a.split('.');let o=S.tc;for(let i=0;i<path.length-1;i++)o=o[path[i]];o[path[path.length-1]]=v;if(/^(emom|rec|edt|amrap|rt)\.(col|warn|rest|half|frac|minsLeft|lead)|^sess\.|^snd\.|^circ\.|^lad\.|^ft\./.test(a))savePrefs();if(a.startsWith('lad.')){const lp=$('#ladPrevT');if(lp)lp.textContent=ladPrev(S.tc.lad)}if(/\.(restOn|restEnd|warmOn|coolOn|amax)$/.test(a))render();
    if(a.startsWith('tst.')){const c=S.tc.tst;if(a==='tst.rif')c.rifTouched=true;
      if(a==='tst.n'&&!c.rifTouched){const t=maxFor(c.n,todayIso());c.rif=t?t.rm:'';const el=$('#tstRif');if(el)el.value=c.rif}
      if(/^tst\.(step|lead|warn|half|col)/.test(a))savePrefs();const sg=$('#tstSug');if(sg)sg.textContent=tstSugTxt()}
    return}
  if(kind==='d'){if(!S.draft)return;
    if(a==='d'){if(!v)return;S.draft.d=v;const m=$('#sessMeta');if(m)m.textContent=`${ggOf(v)}, settimana ${weekOf(v)}`;
      S.draft.ex.forEach((e,i)=>{if(autoPct(e,v)){const el=$('#pct-'+i);if(el)el.value=pctShowOf(e);refreshCard(i)}})}
    else if(a.startsWith('fin.')){S.draft.fin=S.draft.fin||{mode:'emom',sec:60,giri:5,rest:60,wo:''};S.draft.fin[a.slice(4)]=v}
    else S.draft[a]=v;scheduleSave();return}
  if(kind==='e'){
    const i=+a,e=S.draft.ex[i];if(!e)return;
    const setP=()=>{const el=$('#pct-'+i);if(el&&document.activeElement!==el)el.value=pctShowOf(e)};
    if(['kg','z','t','dist','tgt'].includes(b)){e[b]=num(v);if(b==='kg'&&autoPct(e,S.draft.d))setP();if(b==='z'&&blSync(e,S.draft.d,true)){const k=$('#kgv-'+i);if(k)k.value=e.kg??'';setP()}if(b==='z'){const h=$('#clh-'+i);if(h)h.innerHTML=clHintTxt(e)}}
    else if(b==='uni'){e.uni=v;delete e.perLeg}
    else if(b==='pct'){const n=num(v);if(n==null){e.pctMan=false;e.pct=null;autoPct(e,S.draft.d)}else{e.pct=n>1.5?n/100:n;e.pctMan=true}}
    else if(b==='b'){e.b=num(v);syncSets(e)}
    else if(b==='k'){e.k=Math.max(0,num(v)||0);syncSets(e)}
    else if(b==='n_s'){const n=num(v);if(n&&n>=1&&n<=20)setN(e,n);else return}
    else if(b==='g'){const d=S.draft;d.gV=1;if(v)e.g=v;else delete e.g;
      if(e.g){const o=d.ex.find((x,k)=>k!==i&&!x.fin&&x.g===e.g&&x.pid&&S.protos.get(x.pid));if(o&&o.pid!==e.pid)applyKeep(e,S.protos.get(o.pid));const ot=d.ex.find((x,k)=>k!==i&&!x.fin&&x.g===e.g&&x.tid);if(ot)e.tid=ot.tid}
      if(S.pf&&S.pf.sess)S.pf=null;S.tc.rec.links=null;S.tc.emom.link=null;S.tc.edt.link=null;S.tc.circ.links=null;scheduleSave();render();return}
    else if(b==='pid'){const P0=v&&S.protos.get(v),gi=S.draft.gV&&!e.fin?grpOf(S.draft,i):[i];gi.forEach(j=>{if(j===i)applyProto(e,P0);else applyKeep(S.draft.ex[j],P0)});if(S.pf&&S.pf.sess)S.pf=null;
      S.tc.rec.links=null;S.tc.emom.link=null;S.tc.edt.link=null;S.tc.circ.links=null;scheduleSave();render();return}
    else e[b]=v;
    if(b==='f')delete e.fAuto;
    if(b==='n'){const u=document.querySelector(`[data-uni="e${i}"]`);if(u)u.style.display=isMono(v)||uniOf(e)?'':'none'}
    if(b==='n'){if(autoPct(e,S.draft.d))setP();const ic=document.querySelector('#card-'+i+' .card-h .exi');if(ic)ic.outerHTML=exIcon(v,38)}
    if(b==='st'&&v==='Non eseguito')e.s.forEach(x=>{x[1]='skip'});
    if(b==='st'&&v==='Eseguito')e.s.forEach(x=>{if(x[1]==='skip')x[1]=''});syncSets(e);
    refreshCard(i);if(b==='p')S.draft.ex.forEach((x,j)=>{const el=$('#tb-'+j);if(el)el.textContent=timerPlan(j).label});scheduleSave();return}
  if(kind==='c'){
    const e=S.draft.ex[+a];if(!e||!e.n)return;const cfg=S.cfg.esercizi[e.n]=S.cfg.esercizi[e.n]||{};cfg[b]=num(v);
    saveCfg();return}
}
document.addEventListener('input',ev=>{const el=ev.target;if(el.tagName==='SELECT'||el.type==='checkbox')return;onField(el)});
document.addEventListener('change',ev=>{const el=ev.target;if(el.tagName==='SELECT'||el.type==='checkbox'||el.type==='date')onField(el,true)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&((T&&!T.done)||sesActive())){wake(true);tick()}});
window.addEventListener('pagehide',()=>{if(S.draft)persistDraft()});
function impDone(t,m){sheet(`<h3>${t}</h3><p class="muted">${m}</p><div class="row" style="margin-top:14px"><button class="btn primary" data-a="closeSheet">Chiudi</button></div>`)}
function bakCounts(o){const c=o.cfg||{},n=a=>(Array.isArray(a)?a:[]).filter(x=>x&&!x.deleted).length;
  return {sed:n(o.sedute),test:n(o.test),mis:n(o.misure),pro:n(o.protocolli),tim:Object.values(c.timers||{}).filter(x=>x&&!x.deleted).length,es:Object.keys(c.esercizi||{}).length,wo:Object.keys(c.woTpl||{}).length}}
function vImpAsk(o){const k=bakCounts(o),c=o.cfg||{},d=o.exported?fmtD(String(o.exported).slice(0,10)):'';
  const what=[`${k.sed} sedute`,k.wo?`${k.wo} WO`:'',`${k.test} test e massimali`,`${k.mis} misurazioni`,`${k.pro} protocolli`,k.tim?`${k.tim} timer registrati`:'',k.es?`${k.es} esercizi con le loro impostazioni`:'',c.timer?'le impostazioni dei timer':'',c.profilo?'il profilo':'',c.bioRem?'il promemoria dei dati biometrici':''].filter(Boolean);
  return `<h3>Importare il backup${d?` del ${d}`:''}?</h3><p class="muted">Contiene ${what.join(', ')}.</p>
   <p class="small" style="margin:8px 0 4px"><b>Ripristina tutto</b>: le impostazioni (timer, esercizi, profilo, promemoria, conto alla rovescia) diventano quelle del backup. È la scelta giusta su un dispositivo nuovo.</p>
   <p class="small" style="margin:0 0 4px"><b>Aggiungi ai miei dati</b>: tiene le tue impostazioni e aggiunge solo quello che manca.</p>
   <p class="muted small" style="margin:0">In tutti e due i casi sedute, test, misure e protocolli vengono uniti a quelli che hai: non si cancella niente.</p>
   <div class="row" style="margin-top:14px"><button class="btn primary" data-a="impGo" data-m="all">Ripristina tutto</button><button class="btn" data-a="impGo" data-m="add">Aggiungi ai miei dati</button><button class="btn" data-a="closeSheet">Annulla</button></div>`}
A.impGo=async function(el){const obj=S.impObj,all=el.dataset.m==='all';if(!obj){closeSheet();return}S.impObj=null;sheet('<h3>Importo il backup…</h3>');
  try{const r=await importBackup(obj,all?'all':'add');
    impDone('Backup importato',(S.prof.list.length>1?`Nel profilo «${esc(profName(PID))}»: `:'')+(r.n?`${r.n} sedute nuove o aggiornate.`:`nessuna seduta nuova: ${S.hist.length} sedute erano già presenti${S.mode==='local'?' e le ho salvate di nuovo nella memoria del dispositivo':''}.`)+(r.nt?` ${r.nt} test e massimali importati.`:'')+(r.nm?` ${r.nm} misurazioni importate.`:'')+(r.np?` ${r.np} protocolli importati.`:'')+(r.cfg?(all?' Impostazioni di timer, esercizi, WO, profilo e promemoria riprese dal backup.':' Ho aggiunto le impostazioni che mancavano.'):''));render()}
  catch(e){impDone('Backup non importato',e&&e.message==='spazio'?'Lo spazio del browser per questa app è pieno.':'Il file non è un backup del diario: scegli il file diario-backup….json esportato dall’app.')}};
function impText(txt,name){txt=String(txt||'').replace(/^\uFEFF/,'').trim();const fn=esc(name||'');
  if(!txt){impDone('Backup non importato',`Il file «${fn}» è vuoto: quando l’hai esportato il salvataggio non era andato a buon fine. Esporta di nuovo il backup (ora l’app controlla che il file sia salvato) e riprova.`);return}
  let obj=null;try{obj=JSON.parse(txt)}catch(e){impDone('Backup non importato',`Il file «${fn}» è incompleto o danneggiato (${Math.max(1,Math.round(txt.length/1024))} KB). Esporta di nuovo il backup e riprova.`);return}
  if(!obj||obj.app!=='diario-allenamento'||!Array.isArray(obj.sedute)){impDone('Backup non importato',`Il file «${fn}» non è un backup del diario: scegli il file diario-backup….json esportato dall’app.`);return}
  S.impObj=obj;sheet(vImpAsk(obj));
}
$('#fileImp').addEventListener('change',async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;let txt='';try{txt=await f.text()}catch(e){}impText(txt,f.name)});
window.__importDone=()=>{try{if(!window.AndroidBridge||!AndroidBridge.importPending)return;const t=AndroidBridge.importPending();if(t)impText(t,'backup')}catch(e){}};
if(STANDALONE&&'serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js').then(r=>{try{r.update()}catch(e){}}).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had||window.__swReload)return;window.__swReload=true;const go=()=>{if(T&&!T.done){setTimeout(go,5000);return}try{if(S.draft)persistDraft()}catch(e){}location.reload()};go()})}

init();
